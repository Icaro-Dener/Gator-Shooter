const pickupCenterY = b => b.y - 14 + pickupFloat(b) - b.pop * 30;   // nasce com um pulinho

// recompensa de fim de wave (some em DROP_LIFE, como os outros drops)
function spawnReward(kind, x, y) {
  pickups.push({ kind, x, y, amount: kind === 'ammo' ? ROGUE.rewardAmmo + 4 * run.wave : 0, scale: kind === 'ammo' ? 4.2 : 4,
    t: rand(0, 6), age: 0, shine: 0, nextShine: 0.5, pop: 1, life: DROP_LIFE, reward: true });
  particles.push({ x, y: y - 20, vx: 0, vy: 0, life: 0.4, age: 0, size: 70, grow: -170, color: 'ring', drag: 0 });
}

// campo de treino: sem nenhuma munição, aparece uma caixa ao lado da casa (não some)
const TRAINING_AMMO = 12;
let trainingAmmoT = 0;
function updateTrainingAmmo(dt) {
  const empty = mode === 'test' && player.ammo === 0 && player.reserve === 0 && !pickups.some(p => p.kind === 'ammo');
  if (!empty) { trainingAmmoT = 0; return; }
  if ((trainingAmmoT += dt) < 0.6) return;              // pequena pausa antes de aparecer
  trainingAmmoT = 0;
  const R = houseRect();
  pickups.push({ kind: 'ammo', x: Math.min(WORLD_W - 40, R.r + 56), y: R.b - 10, amount: TRAINING_AMMO, scale: 4.2,
    t: 0, age: 0, shine: 0, nextShine: 0.5, pop: 1, life: Infinity, reward: true });
  particles.push({ x: R.r + 56, y: R.b - 30, vx: 0, vy: 0, life: 0.4, age: 0, size: 70, grow: -170, color: 'ring', drag: 0 });
  sfx.select();
}

function canCollect(b) {
  if (gameOver) return false;
  if (b.kind === 'heal') return house.active && house.hp < houseMax();
  return player.reserve < RESERVE_MAX;
}

function collectHeal(b) {
  const gained = Math.round(Math.min(houseMax() * ROGUE.rewardHeal, houseMax() - house.hp));
  house.hp += gained;
  house.heal = 1;
  sfx.heal();
  const cy = pickupCenterY(b);
  for (let i = 0; i < 14; i++) {   // cruzinhas verdes subindo da casa
    const R = houseRect();
    particles.push({ x: rand(R.l, R.r), y: rand(R.t, R.b), vx: rand(-20, 20), vy: rand(-120, -50),
      life: rand(0.6, 1.1), age: 0, size: rand(3, 5), color: Math.random() < .6 ? '#7bd04a' : '#ffffff', drag: 1 });
  }
  particles.push({ x: b.x, y: cy, vx: 0, vy: 0, life: 0.35, age: 0, size: 10, grow: 260, color: 'ring', drag: 0 });
  particles.push({ x: house.x, y: houseRect().t - 30, vx: 0, vy: -50, life: 1.1, age: 0, size: 0, color: 'text', text: `+${gained} CASA`, tint: '#7bd04a', drag: 1.5 });
}

function collectPickup(b) {
  if (b.kind === 'heal') return collectHeal(b);
  const gained = Math.min(b.amount, RESERVE_MAX - player.reserve);
  player.reserve += gained;
  reservePop = 1;
  sfx.reload();
  const cy = pickupCenterY(b);
  for (let i = 0; i < 16; i++) {   // explosão de faíscas
    const a = (i / 16) * Math.PI * 2, sp = rand(150, 320);
    particles.push({ x: b.x, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: rand(0.25, 0.45), age: 0, size: rand(3, 5), color: Math.random() < .5 ? '#ffffff' : '#ffe08a', drag: 6 });
  }
  particles.push({ x: b.x, y: cy, vx: 0, vy: 0, life: 0.35, age: 0, size: 10, grow: 260, color: 'ring', drag: 0 });
  particles.push({ x: b.x, y: cy - 30, vx: 0, vy: -60, life: 0.9, age: 0, size: 0, color: 'text', text: `+${gained}`, drag: 1.5 });
  sparkle(b.x + 20, cy - 20);
}

function updatePickups(dt) {
  for (let i = pickups.length - 1; i >= 0; i--) {
    const b = pickups[i];
    b.t += dt; b.age += dt;
    b.pop *= Math.exp(-7 * dt);
    if (b.shine >= 0) {
      b.shine += dt / BOX_SHINE_TIME;
      if (b.shine >= 1) { b.shine = -1; b.nextShine = rand(...BOX_SHINE_EVERY); }
    } else if ((b.nextShine -= dt) <= 0) {
      b.shine = 0;
      sparkle(b.x + rand(-BOX_W, BOX_W) * b.scale * 0.4, pickupCenterY(b) + rand(-BOX_H, BOX_H) * b.scale * 0.3);
    }
    const near = Math.hypot(player.x - b.x, player.y - b.y) < BOX_RADIUS + b.scale * 4;
    if (near && canCollect(b)) { collectPickup(b); pickups.splice(i, 1); continue; }
    const healUseless = b.kind === 'heal' && house.hp >= houseMax() && b.pop < 0.2;   // casa 100%: a cura some
    if (b.age > b.life || healUseless) {
      particles.push({ x: b.x, y: pickupCenterY(b), vx: 0, vy: -15, life: 0.4, age: 0, size: 10, grow: 25, color: 'dust', drag: 2 });
      pickups.splice(i, 1);
    }
  }
}

function drawPickup(b) {
  const spr = b.kind === 'heal' ? medkitImg : boxImg;
  if (!spr.complete) return;
  // pisca nos últimos 3 segundos
  const left = b.life - b.age;
  if (left < 2 && Math.floor(left * (left < 0.8 ? 16 : 8)) % 2 === 0) return;
  const SW = spr.width, SH = spr.height;
  const w = SW * b.scale, h = SH * b.scale;
  const lift = pickupFloat(b) - b.pop * 30;

  // sombra no chão: menor quando a caixa sobe
  const sk = Math.max(0.3, 1 - (lift + 5) / 20 * 0.6);
  ctx.fillStyle = 'rgba(0,0,0,.25)';
  ctx.beginPath();
  ctx.ellipse(b.x, b.y + h / 2 - 2, w * 0.38 * sk, 5 * sk, 0, 0, Math.PI * 2);
  ctx.fill();

  // sprite + faixa de brilho diagonal recortada pelo formato do sprite
  if (pickupBuf.width !== SW || pickupBuf.height !== SH) { pickupBuf.width = SW; pickupBuf.height = SH; }
  pickupCtx.clearRect(0, 0, SW, SH);
  pickupCtx.globalCompositeOperation = 'source-over';
  pickupCtx.drawImage(spr, 0, 0);
  if (b.shine >= 0) {
    const sx = -8 + b.shine * (SW + 16);
    pickupCtx.globalCompositeOperation = 'source-atop';
    pickupCtx.fillStyle = 'rgba(255,255,255,.85)';
    pickupCtx.beginPath();
    pickupCtx.moveTo(sx, 0); pickupCtx.lineTo(sx + 3, 0); pickupCtx.lineTo(sx + 3 - SH, SH); pickupCtx.lineTo(sx - SH, SH);
    pickupCtx.fill();
    pickupCtx.fillStyle = 'rgba(255,255,255,.45)';
    pickupCtx.beginPath();
    pickupCtx.moveTo(sx + 5, 0); pickupCtx.lineTo(sx + 6, 0); pickupCtx.lineTo(sx + 6 - SH, SH); pickupCtx.lineTo(sx + 5 - SH, SH);
    pickupCtx.fill();
  }
  const cy = Math.round(pickupCenterY(b));
  // recompensa de wave: aura pulsante
  if (b.reward) {
    ctx.fillStyle = b.kind === 'heal' ? 'rgba(123,208,74,.22)' : 'rgba(255,224,138,.22)';
    ctx.beginPath(); ctx.arc(b.x, cy, w * 0.62 + Math.sin(b.t * 5) * 4, 0, Math.PI * 2); ctx.fill();
  }
  ctx.drawImage(pickupBuf, Math.round(b.x - w / 2), Math.round(cy - h / 2), w, h);

  // rótulo
  ctx.font = 'bold 13px monospace';
  ctx.textAlign = 'center';
  const label = b.kind === 'heal' ? `+${Math.round(ROGUE.rewardHeal * 100)}% CASA` : `+${b.amount}`;
  const ly = Math.round(cy - h / 2 - 6);
  ctx.fillStyle = '#000'; ctx.fillText(label, b.x + 1, ly + 1);
  ctx.fillStyle = b.kind === 'heal' ? '#7bd04a' : b.amount >= DROP_TABLE[0].amount ? '#ffe08a' : '#f4f1de';
  ctx.fillText(label, b.x, ly);
  ctx.textAlign = 'left';
}

function impact(x, y, ang, strong) {
  const n = strong ? 6 : 3;
  for (let i = 0; i < n; i++) {
    const a = ang + Math.PI + rand(-1, 1), sp = rand(60, strong ? 260 : 140);
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(0.15, 0.35), age: 0,
      size: rand(2, 4), color: strong ? '#ffe08a' : '#d8c3a0', drag: 6 });
  }
  particles.push({ x, y, vx: 0, vy: -15, life: 0.3, age: 0, size: 5, grow: 20, color: 'dust', drag: 2 });
}

// =====================================================================
// Inimigo / dano
// =====================================================================
function inEnemy(e, x, y, pad = 0) {
  const hw = ENEMY_HITBOX.w * SCALE / 2 + pad, hh = ENEMY_HITBOX.h * SCALE / 2 + pad;
  return Math.abs(x - e.x) < hw && Math.abs(y - e.y) < hh;
}

function hitEnemy(e, b, ang, dmg = PELLET_DAMAGE) {
  const crit = Math.random() < critChance();
  if (crit) dmg *= CRIT_MULT;
  const dealt = Math.min(dmg, e.hp);
  e.hp -= dmg;
  // vampirismo: parte do dano vira vida da casa
  if (house.active && vampirism() > 0 && house.hp > 0) {
    house.hp = Math.min(houseMax(), house.hp + dealt * vampirism());
    house.heal = Math.max(house.heal || 0, 0.25);
  }
  if (crit) {
    particles.push({ x: e.x + rand(-10, 10), y: e.y - 40, vx: rand(-20, 20), vy: -90, life: 0.6, age: 0, size: 0,
      color: 'text', text: `${Math.round(dmg)}!`, tint: '#ffd166', drag: 3 });
    for (let i = 0; i < 5; i++)
      particles.push({ x: b.x, y: b.y, vx: rand(-200, 200), vy: rand(-200, 200), life: 0.25, age: 0, size: 4, color: '#ffd166', drag: 8 });
    sfx.crit();
  }
  if (e.hp > 0) sfx.hit();
  e.flash = 0.09;               // fica branco
  e.jiggle = 1;                 // tremidinha
  e.hpShow = 2;                 // mostra a barra de vida por um tempo
  if (!e.homeRel) { e.x += Math.cos(ang) * 6; e.y += Math.sin(ang) * 6; }  // leve empurrão do impacto
  cam.trauma = Math.min(1, cam.trauma + 0.015);
  for (let i = 0; i < 4; i++) { // respingo vermelho na direção do tiro
    const a = ang + rand(-0.7, 0.7), sp = rand(120, 320);
    particles.push({ x: b.x, y: b.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: rand(0.2, 0.4), age: 0, size: rand(3, 5), color: Math.random() < .6 ? '#ac3232' : '#ffffff', drag: 7 });
  }
  if (e.hp <= 0) killEnemy(e);
}

function killEnemy(e) {
  e.alive = false;
  sfx.kill();
  e.respawn = ENEMY_RESPAWN;
  if (mode === 'rogue') run.kills++;
  rollDrop(e.x, e.y + ENEMY_H * SCALE / 2 - 10);
  cam.trauma = Math.min(1, cam.trauma + (mode === 'rogue' ? 0.05 : 0.2));
  for (let i = 0; i < 28; i++) {
    const a = rand(0, Math.PI * 2), sp = rand(100, 480);
    particles.push({ x: e.x + rand(-15, 15), y: e.y + rand(-20, 20), vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: rand(0.3, 0.7), age: 0, size: rand(4, 8), color: Math.random() < .7 ? '#ac3232' : '#ffffff', drag: 5 });
  }
  particles.push({ x: e.x, y: e.y, vx: 0, vy: 0, life: 0.35, age: 0, size: 12, grow: 300, color: 'ring', drag: 0 });
}

// nasce fora da tela, numa borda aleatória, e caminha até o jogador
function spawnEdgeEnemy(cfg) {
  // nasce fora da tela, numa borda aleatória, e atravessa a mata até a clareira
  const m = 50, side = Math.floor(Math.random() * 4);
  let x, y;
  if (side === 0)      { x = rand(0, WORLD_W); y = -m; }
  else if (side === 1) { x = WORLD_W + m; y = rand(0, WORLD_H); }
  else if (side === 2) { x = rand(0, WORLD_W); y = WORLD_H + m; }
  else                 { x = -m; y = rand(0, WORLD_H); }
  enemies.push(makeEnemy(x, y, ROGUE.enemyHp, ROGUE.enemySpeed));
}

function damageHouse(e) {
  if (gameOver) return;
  house.hp = Math.max(0, house.hp - BITE_DAMAGE);
  house.flash = 0.08;
  house.shake = 1;
  house.pop = 1;
  e.lunge = 1;
  sfx.bite();
  cam.trauma = Math.min(1, cam.trauma + 0.12);
  const R = houseRect();
  const px = Math.max(R.l, Math.min(R.r, e.x)), py = Math.max(R.t, Math.min(R.b, e.y));
  for (let i = 0; i < 6; i++) {    // lascas de madeira/tijolo
    const a = Math.atan2(e.y - py, e.x - px) + rand(-0.9, 0.9), sp = rand(80, 260);
    particles.push({ x: px, y: py, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(0.25, 0.5), age: 0,
      size: rand(3, 6), color: Math.random() < .5 ? '#7a3b2e' : '#4a2a20', drag: 5 });
  }
  if (house.hp <= 0) destroyHouse();
}

function destroyHouse() {
  gameOver = true; mouse.down = false;
  sfx.houseDown();
  cam.trauma = 1;
  const R = houseRect();
  for (let i = 0; i < 60; i++) {
    const x = rand(R.l, R.r), y = rand(R.t - 30, R.b), a = rand(0, Math.PI * 2), sp = rand(80, 520);
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 120, life: rand(0.5, 1.2), age: 0,
      size: rand(4, 10), color: ['#7a3b2e', '#4a2a20', '#2f2f3a', '#9c5a3c'][i % 4], drag: 3 });
  }
  for (let i = 0; i < 10; i++)
    particles.push({ x: rand(R.l, R.r), y: rand(R.t, R.b), vx: rand(-30, 30), vy: rand(-60, -20), life: rand(0.8, 1.6), age: 0,
      size: rand(12, 22), grow: 30, color: 'smoke', drag: 1 });
}

function hurtPlayer(src) {
  if (player.invuln > 0 || gameOver) return;
  player.hp--;
  sfx.hurt();
  player.invuln = INVULN_TIME;
  player.hurt = 1;
  heartPop = 1;
  cam.trauma = Math.min(1, cam.trauma + 0.7);
  // empurra para longe de quem encostou
  const a = Math.atan2(player.y - src.y, player.x - src.x);
  player.vx = Math.cos(a) * CONTACT_KNOCKBACK;
  player.vy = Math.sin(a) * CONTACT_KNOCKBACK;
  for (let i = 0; i < 10; i++) {
    const pa = rand(0, Math.PI * 2), sp = rand(100, 300);
    particles.push({ x: player.x, y: player.y, vx: Math.cos(pa) * sp, vy: Math.sin(pa) * sp,
      life: rand(0.2, 0.4), age: 0, size: rand(3, 5), color: Math.random() < .5 ? '#ffffff' : '#e63946', drag: 6 });
  }
  if (player.hp <= 0) { gameOver = true; mouse.down = false; sfx.gameOver(); }
}

// =====================================================================
// Modos
// =====================================================================
function startMode(m) {
  mode = m;
  paused = false;
  resetStats();
  cards.list = [];
  sfx.select();
  gameOver = false;
  Object.assign(player, { hp: PLAYER_HP, ammo: AMMO_MAX, reserve: RESERVE_START, reloading: false, reloadT: 0, meleeT: -1, meleeCd: 0, invuln: 0, hurt: 0, vx: 0, vy: 0, cooldown: 0.2,
    x: WORLD_W / 2, y: WORLD_H / 2 });
  // roguelike: casa de verdade (vida, alvo dos jacarés). Campo de treino: só cosmética.
  Object.assign(house, { hp: houseMax(), flash: 0, shake: 0, pop: 0, active: m === 'rogue', decor: m === 'test' });
  if (m === 'rogue' || m === 'test') player.y = houseRect().b + player.h / 2 + 24;   // nasce na frente da porta
  Object.assign(run, { time: 0, kills: 0, spawnTimer: 0, wave: 0, phase: 'break', phaseT: ROGUE.firstBreak,
    toSpawn: 0, cfg: null, banner: null });
  bullets.length = 0; particles.length = 0; enemies.length = 0; pickups.length = 0;
  ammoPop.fill(0); mouse.down = false;
  if (m === 'test') {
    for (const pos of ENEMY_POSITIONS)
      enemies.push(makeEnemy(Math.round(WORLD_W * pos.x), Math.round(WORLD_H * pos.y), ENEMY_HP, 0, pos));
  }
}

// botões do menu (em coordenadas de tela)
function menuButtons() {
  const w = Math.min(340, canvas.width - 40), h = 64, x = (canvas.width - w) / 2, cy = canvas.height / 2;
  return [
    { id: 'test',  label: '1  ·  CAMPO DE TREINO', sub: '3 jacarés parados para treinar', x, y: cy - 10, w, h },
    { id: 'rogue', label: '2  ·  ROGUELIKE',       sub: 'defenda a casa wave após wave',     x, y: cy + h + 6, w, h },
  ];
}
// botões da pausa
function pauseButtons() {
  const w = Math.min(300, canvas.width - 40), h = 52, x = (canvas.width - w) / 2, y0 = canvas.height / 2 - 40;
  const vy = y0 + (h + 10) * 3 + 6, vb = 44;
  return [
    { id: 'resume',  label: 'CONTINUAR',      sub: '', x, y: y0, w, h },
    { id: 'restart', label: 'RECOMEÇAR',      sub: '', x, y: y0 + h + 10, w, h },
    { id: 'menu',    label: 'MENU PRINCIPAL', sub: '', x, y: y0 + (h + 10) * 2, w, h },
    { id: 'volDown', label: '−', sub: '', x, y: vy, w: vb, h: vb, small: true },
    { id: 'volUp',   label: '+', sub: '', x: x + w - vb, y: vy, w: vb, h: vb, small: true },
  ];
}
const hoveredIn = list => list.find(b => mouse.x >= b.x && mouse.x <= b.x + b.w && mouse.y >= b.y && mouse.y <= b.y + b.h);
const hoveredButton = () => hoveredIn(menuButtons());

function setPaused(v) {
  if (paused === v) return;
  paused = v;
  mouse.down = false; mouse.pressed = false; mouse.rightPressed = false;
  keys.clear();
  sfx.select();
}
function pauseAction(id) {
  if (id === 'volDown') return setMusicLevel(musicLevel - 0.1);
  if (id === 'volUp') return setMusicLevel(musicLevel + 0.1);
  if (id === 'resume') setPaused(false);
  else if (id === 'restart') startMode(mode);
  else if (id === 'menu') startMode('menu');
}

window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (mode === 'menu') { if (k === '1') startMode('test'); if (k === '2') startMode('rogue'); return; }
  if (k === 'control' && gameOver) { toggleStats(); return; }
  if (gameOver) {                         // tela de game over: R recomeça, ESC volta ao menu
    if (k === 'r') startMode(mode);
    if (k === 'escape') startMode('menu');
    return;
  }
  if (k === 'control') { toggleStats(); return; }
  if (mode === 'rogue' && run.phase === 'cards' && !paused && ['1', '2', '3'].includes(k)) { pickCard(+k - 1); return; }
  if (k === 'escape' || k === 'p') { setPaused(!paused); return; }
  if (paused) {
    if (k === 'arrowleft' || k === '-') pauseAction('volDown');
    if (k === 'arrowright' || k === '+' || k === '=') pauseAction('volUp');
    if (k === 'r') pauseAction('restart');
    if (k === 'q') pauseAction('menu');
    return;
  }
  if (k === 'r' && !e.repeat && mode !== 'menu') startReload();
});

// =====================================================================
// Recarga: 1 cartucho por RELOAD_SHELL. Um toque no R recarrega até encher (ou acabar a reserva).
// =====================================================================
function canReload() { return player.ammo < AMMO_MAX && player.reserve > 0 && !gameOver; }
function startReload() {
  if (player.reloading || !canReload()) { if (!canReload() && player.reserve === 0 && player.ammo < AMMO_MAX) emptyFlash = 1; return; }
  player.reloading = true;
  player.reloadT = 0;
  sfx.reloadStart();
}
function updateReload(dt) {
  if (!player.reloading) return;
  player.reloadT += dt;
  if (player.reloadT >= reloadShell() - 1e-6) {
    player.ammo++;
    player.reserve--;
    ammoPop[player.ammo - 1] = 1;
    sfx.shellIn();
    // cartucho entrando: faísca dourada na arma
    const h = hand();
    for (let i = 0; i < 3; i++)
      particles.push({ x: h.x + player.facing * 14, y: h.y - 10, vx: rand(-60, 60), vy: rand(-140, -60), life: 0.25, age: 0,
        size: 3, color: '#ffe08a', drag: 5 });
    player.reloadT = Math.max(0, player.reloadT - reloadShell());   // mantém o resto do tempo
    // continua sozinho até encher a escopeta ou acabar a reserva
    if (!canReload()) { player.reloading = false; player.reloadT = 0; }
  }
}

// =====================================================================
// Waves
// =====================================================================
function banner(text, sub, color = '#f4f1de', dur = 2.4, big = false) { run.banner = { text, sub, color, t: 0, dur, big }; }

function startWave() {
  run.wave++;
  run.cfg = waveConfig(run.wave);
  run.toSpawn = run.cfg.count;
  run.spawnTimer = 0.3;
  run.phase = 'fight';
  banner(`WAVE ${run.wave}`, `${run.cfg.count} jacarés`, '#e9c46a', 2.0, true);
  sfx.waveStart();
}

function finishWave() {
  run.phase = 'cards';                 // jogo congela até escolher um upgrade
  run.phaseT = ROGUE.breakTime;
  openCards();
  const full = house.hp >= houseMax();
  banner(`WAVE ${run.wave} COMPLETA`, full ? '+ munição' : '+ munição   + curativo da casa', '#7bd04a', 2.2);
  sfx.waveClear();
  // recompensas na frente da porta
  const R = houseRect(), y = Math.min(WORLD_H - 40, R.b + 70);
  spawnReward('ammo', house.x - 60, y);
  if (!full) spawnReward('heal', house.x + 60, y);
}

function updateWaves(dt) {
  if (run.banner && (run.banner.t += dt) > run.banner.dur) run.banner = null;
  if (gameOver) return;
  run.time += dt;
  if (run.phase === 'break') {
    if ((run.phaseT -= dt) <= 0) startWave();
    return;
  }
  // fight: vai soltando os jacarés da wave
  if (run.toSpawn > 0 && (run.spawnTimer -= dt) <= 0) {
    const alive = enemies.filter(e => e.alive).length;
    const n = Math.min(run.cfg.group, run.toSpawn, ROGUE.maxEnemies - alive);
    for (let i = 0; i < n; i++) spawnEdgeEnemy(run.cfg);
    run.toSpawn -= n;
    run.spawnTimer = run.cfg.interval;
  }
  if (run.toSpawn === 0 && !enemies.some(e => e.alive)) finishWave();
}

// =====================================================================
// Cartas de upgrade (1 de 3) — aparecem ao fim de cada wave
// =====================================================================
const cards = { list: [], t: 0, picked: -1, pickT: 0 };
function openCards() {
  const pool = UPGRADES.slice();
  cards.list = [];
  for (let i = 0; i < 3; i++) cards.list.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
  cards.t = 0; cards.picked = -1; cards.pickT = 0;
  mouse.down = false;
}
function cardRects() {
  const n = 3, gap = 18;
  const w = Math.min(190, (canvas.width - 40 - gap * 2) / 3), h = Math.min(250, w * 1.35);
  const x0 = (canvas.width - (w * n + gap * (n - 1))) / 2, y = canvas.height / 2 - h / 2 + 20;
  return cards.list.map((u, i) => ({ u, i, x: x0 + i * (w + gap), y, w, h }));
}
function pickCard(i) {
  if (cards.picked >= 0 || !cards.list[i] || cards.t < 0.35) return;   // pequena trava contra clique acidental
  cards.picked = i; cards.pickT = 0;
  const u = cards.list[i];
  const oldMax = houseMax();
  lv[u.id]++;
  if (u.id === 'houseHp') house.hp += houseMax() - oldMax;       // a vida extra já vem cheia
  statFlash[u.id] = 1;
  sfx.upgrade();
}
function updateCards(dt) {
  cards.t += dt;
  if (cards.picked >= 0 && (cards.pickT += dt) > 0.45) {          // animação da escolha e volta ao jogo
    run.phase = 'break';
    cards.list = [];
  }
}

// =====================================================================
// Melee
// =====================================================================
function startMelee() {
  player.meleeT = 0;
  player.meleeCd = meleeCooldown();
  player.meleeAngle = player.aim;
  player.meleeHit = false;
  player.reloading = false; player.reloadT = 0;   // golpe cancela a recarga
  sfx.swing();
}

function meleeStrike() {
  player.meleeHit = true;
  const h = hand(), a = player.meleeAngle;
  let hits = 0;
  for (const e of enemies) {
    if (!e.alive) continue;
    const dx = e.x - h.x, dy = e.y - h.y, dist = Math.hypot(dx, dy);
    let diff = Math.atan2(dy, dx) - a;
    diff = Math.atan2(Math.sin(diff), Math.cos(diff));
    const reach = meleeRange() + ENEMY_HITBOX.w * SCALE / 2;
    if (dist < reach && (Math.abs(diff) < MELEE_ARC / 2 || dist < ENEMY_HITBOX.w * SCALE)) {
      hits++;
      const ang = Math.atan2(dy, dx);
      if (!e.homeRel) { e.x += Math.cos(ang) * meleeKnock(); e.y += Math.sin(ang) * meleeKnock(); }
      hitEnemy(e, { x: e.x - Math.cos(ang) * 20, y: e.y - Math.sin(ang) * 20 }, ang, meleeDamage());
    }
  }
  // faíscas do corte ao longo do arco
  for (let i = 0; i < 20; i++) {
    const t = a + rand(-MELEE_ARC / 2, MELEE_ARC / 2), r = rand(40, meleeRange());
    particles.push({ x: h.x + Math.cos(t) * r, y: h.y + Math.sin(t) * r, vx: Math.cos(t) * 80, vy: Math.sin(t) * 80,
      life: rand(0.1, 0.22), age: 0, size: rand(2, 4), color: '#ffffff', drag: 8 });
  }
  if (hits) { sfx.slash(); cam.trauma = Math.min(1, cam.trauma + 0.12); }
}

function updateMelee(dt) {
  const wasCooling = player.meleeCd > 0;
  player.meleeCd = Math.max(0, player.meleeCd - dt);
  if (wasCooling && player.meleeCd === 0) { player.meleeReadyPop = 1; sfx.meleeReady(); }
  player.meleeReadyPop *= Math.exp(-5 * dt);
  if (mouse.rightPressed && player.meleeCd <= 0 && player.meleeT < 0 && !gameOver) startMelee();
  mouse.rightPressed = false;
  if (player.meleeT >= 0) {
    player.meleeT += dt;
    if (!player.meleeHit && player.meleeT >= MELEE_HIT_AT) meleeStrike();
    if (player.meleeT >= MELEE_FRAME * 3) player.meleeT = -1;
  }
}

// =====================================================================
// Update
// =====================================================================
function update(dt) {
  // (re)constrói o mapa quando os tiles carregam ou a janela muda de tamanho
  const sizeChanged = map.builtW !== canvas.width || map.builtH !== canvas.height;
  if ((!map.ready || sizeChanged) && canvas.width > 0 && sandSet.complete && grassSet.complete) buildMap();
  if (!map.ready) return;

  clock += dt;
  if (mode === 'menu') {
    updateTrees(dt);
    if (mouse.pressed) { const b = hoveredButton(); if (b) startMode(b.id); }
    mouse.pressed = false;
    return;
  }
  if (paused) {                       // tudo congelado; só os botões da pausa respondem
    if (mouse.pressed) { const b = hoveredIn(pauseButtons()); if (b) pauseAction(b.id); }
    mouse.pressed = false; mouse.rightPressed = false; mouse.down = false;
    return;
  }
  for (const k in statFlash) statFlash[k] = Math.max(0, statFlash[k] - dt * 0.8);
  if (mode === 'rogue' && run.phase === 'cards') {   // escolhendo upgrade: jogo congelado
    updateCards(dt);
    if (mouse.pressed) { const c = hoveredIn(cardRects()); if (c) pickCard(c.i); }
    mouse.pressed = false; mouse.rightPressed = false; mouse.down = false;
    updateTrees(dt);
    return;
  }

  // movimento
  let dx = 0, dy = 0;
  if (keys.has('a')) dx -= 1;
  if (keys.has('d')) dx += 1;
  if (keys.has('w')) dy -= 1;
  if (keys.has('s')) dy += 1;
  const len = Math.hypot(dx, dy);
  if (len > 0) { dx /= len; dy /= len; }
  if (gameOver) { dx = 0; dy = 0; }

  const kd = Math.exp(-12 * dt);           // knockback some rápido
  player.vx *= kd; player.vy *= kd;
  const prevX = player.x, prevY = player.y;
  player.x += (dx * SPEED + player.vx) * dt;
  player.y += (dy * SPEED + player.vy) * dt;
  player.x = Math.max(player.w / 2, Math.min(WORLD_W - player.w / 2, player.x));
  player.y = Math.max(player.h / 2, Math.min(WORLD_H - player.h / 2, player.y));
  pushOutOfHouse(player, PLAYER_HITBOX.w * SCALE / 2, PLAYER_HITBOX.h * SCALE / 2);
  updateWalk(dt, len > 0, Math.hypot(player.x - prevX, player.y - prevY), dx);

  // câmera fixa: o cenário inteiro cabe na tela (só o tremor desloca)
  cam.x = 0; cam.y = 0;

  // mira
  const mw = mouseWorld(), h = hand();
  player.aim = Math.atan2(mw.y - h.y, mw.x - h.x);
  if (FACE_MOUSE) player.facing = Math.cos(player.aim) < 0 ? -1 : 1;
  else if (dx !== 0) player.facing = dx;

  // tiro
  player.cooldown -= dt;
  updateMelee(dt);
  if (mouse.down && player.cooldown <= 0 && !gameOver && player.meleeT < 0) {
    if (player.ammo > 0) {
      player.reloading = false;      // atirar cancela a recarga (o cartucho em andamento não conta)
      shoot();
      player.ammo--;
      ammoPop[player.ammo] = 1;
      player.cooldown = shotCooldown();
    } else if (mouse.pressed && !player.reloading) {
      // sem munição: "clique seco" — HUD pisca e a arma dá um tranquinho
      emptyFlash = 1;
      sfx.dry();
      player.kick = 0.8;
      player.cooldown = 0.15;
    }
  }
  mouse.pressed = false;
  updateReload(dt);
  updatePickups(dt);
  updateTufts(dt);
  updateTrees(dt);
  updateTrainingAmmo(dt);
  reservePop *= Math.exp(-6 * dt);

  // roguelike: waves
  if (mode === 'rogue') updateWaves(dt);
  house.heal = Math.max(0, (house.heal || 0) - dt * 1.5);

  // inimigos: perseguem (speed > 0) ou ficam parados; dano por contato
  const ox = (ENEMY_HITBOX.w + PLAYER_HITBOX.w) * SCALE / 2;
  const oy = (ENEMY_HITBOX.h + PLAYER_HITBOX.h) * SCALE / 2;
  for (const e of enemies) {
    e.flash -= dt;
    e.jiggle *= Math.exp(-12 * dt);
    e.hpShow -= dt;
    if (!e.alive) {
      if (e.homeRel && (e.respawn -= dt) <= 0) {   // inimigo do campo de treino reaparece
        Object.assign(e, { alive: true, hp: e.maxHp, flash: 0.15, hpShow: 0 });
        particles.push({ x: e.x, y: e.y, vx: 0, vy: 0, life: 0.3, age: 0, size: 60, grow: -180, color: 'ring', drag: 0 });
      }
      continue;
    }
    e.lunge *= Math.exp(-10 * dt);
    if (e.speed > 0 && !gameOver) {
      // alvo: o ponto mais próximo da casa (roguelike) ou o jogador
      let tx = player.x, ty = player.y;
      if (house.active) {
        const R = houseRect();
        tx = Math.max(R.l, Math.min(R.r, e.x)); ty = Math.max(R.t, Math.min(R.b, e.y));
      }
      const ddx = tx - e.x, ddy = ty - e.y, dist = Math.hypot(ddx, ddy) || 1;
      if (Math.abs(ddx) > 4) e.facing = ddx < 0 ? -1 : 1;
      if (!e.attacking) {
        e.x += ddx / dist * e.speed * dt;
        e.y += ddy / dist * e.speed * dt;
        e.walk += dt * e.speed * 0.09;
      }
      e.dirX = ddx / dist; e.dirY = ddy / dist;
    }
    if (house.active) {
      // encostou na casa: para e morde
      const hw = ENEMY_HITBOX.w * SCALE / 2, hh = ENEMY_HITBOX.h * SCALE / 2;
      e.attacking = pushOutOfHouse(e, hw + 1, hh + 1) || (() => {
        const R = houseRect();
        return e.x > R.l - hw - 3 && e.x < R.r + hw + 3 && e.y > R.t - hh - 3 && e.y < R.b + hh + 3;
      })();
      if (e.attacking && !gameOver && (e.bite -= dt) <= 0) { e.bite = BITE_EVERY; damageHouse(e); }
    } else if (Math.abs(player.x - e.x) < ox && Math.abs(player.y - e.y) < oy) hurtPlayer(e);
  }
  // separação simples para não empilharem
  const minD = ENEMY_HITBOX.w * SCALE * 0.9;
  for (let i = 0; i < enemies.length; i++) {
    const a = enemies[i]; if (!a.alive || a.homeRel) continue;
    for (let j = i + 1; j < enemies.length; j++) {
      const b = enemies[j]; if (!b.alive || b.homeRel) continue;
      const ddx = b.x - a.x, ddy = b.y - a.y, d = Math.hypot(ddx, ddy);
      if (d > 0 && d < minD) {
        const push = (minD - d) / 2, nx = ddx / d, ny = ddy / d;
        a.x -= nx * push; a.y -= ny * push; b.x += nx * push; b.y += ny * push;
      }
    }
  }
  if (house.active) for (const e of enemies) if (e.alive) pushOutOfHouse(e, ENEMY_HITBOX.w * SCALE / 2, ENEMY_HITBOX.h * SCALE / 2);
  house.flash -= dt;
  house.shake *= Math.exp(-10 * dt);
  house.pop *= Math.exp(-5 * dt);

  // remove mortos que não reaparecem
  for (let i = enemies.length - 1; i >= 0; i--) if (!enemies[i].alive && !enemies[i].homeRel) enemies.splice(i, 1);

  player.invuln -= dt;
  player.hurt *= Math.exp(-8 * dt);
  heartPop *= Math.exp(-6 * dt);

  emptyFlash *= Math.exp(-6 * dt);
  for (let i = 0; i < AMMO_MAX; i++) ammoPop[i] *= Math.exp(-10 * dt);

  // recuperação do recuo / efeitos
  const rk = Math.exp(-14 * dt);
  player.kick *= rk; player.kickRot *= rk;
  player.flash -= dt;
  crossPulse *= Math.exp(-9 * dt);
  cam.trauma = Math.max(0, cam.trauma - dt * 3.5);
  const shake = cam.trauma * cam.trauma * 14 * SHAKE_SCALE;   // amplitude máxima ~4 px
  cam.sx = rand(-1, 1) * shake; cam.sy = rand(-1, 1) * shake;

  // projéteis
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.age += dt;
    b.px = b.x; b.py = b.y;
    const d = Math.exp(-SHOT.drag * dt);
    b.vx *= d; b.vy *= d;
    b.x += b.vx * dt; b.y += b.vy * dt;
    const ang = Math.atan2(b.vy, b.vx);
    const out = b.x < 0 || b.y < 0 || b.x > WORLD_W || b.y > WORLD_H;
    // testa o ponto atual e o meio do passo (projéteis rápidos não atravessam o inimigo)
    const mx = (b.x + b.px) / 2, my = (b.y + b.py) / 2;
    const pad = SHOT.bulletScale * (bulletMul() - 1) * 1.5;   // balas maiores acertam um pouco mais longe
    const target = enemies.find(e => e.alive && !b.hits.includes(e) && (inEnemy(e, b.x, b.y, pad) || inEnemy(e, mx, my, pad)));
    if (target) {
      // atravessa: acerta este jacaré e segue em frente, um pouco mais fraco e mais lento
      hitEnemy(target, b, ang, pelletDamage() * b.dmgMul);
      b.hits.push(target);
      b.dmgMul *= SHOT.pierceFalloff;
      b.vx *= 0.85; b.vy *= 0.85;
      if (b.hits.length >= SHOT.pierce) bullets.splice(i, 1);
    } else if (out) {
      impact(Math.max(0, Math.min(WORLD_W, b.x)), Math.max(0, Math.min(WORLD_H, b.y)), ang, true);
      bullets.splice(i, 1);
    } else if (b.age >= b.life) {
      impact(b.x, b.y, ang, false);
      bullets.splice(i, 1);
    }
  }

  // partículas
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.age += dt;
    if (p.age >= p.life) { particles.splice(i, 1); continue; }
    const d = Math.exp(-(p.drag || 0) * dt);
    p.vx *= d; p.vy *= d;
    if (p.gravity) p.vy += p.gravity * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.grow) p.size += p.grow * dt;
    if (p.rot !== undefined) p.rot += p.vr * dt;
    if (p.floor !== undefined && p.y > p.floor && p.vy > 0) {   // quique da cápsula
      if (Math.abs(p.vy) > 120) sfx.shell();
      p.y = p.floor; p.vy *= -0.35; p.vx *= 0.6; p.vr *= 0.5;
      if (Math.abs(p.vy) < 40) { p.vy = 0; p.gravity = 0; p.drag = 10; }
    }
  }
}

// =====================================================================
// Render
// =====================================================================
// =====================================================================
// Tufos de grama: vento + dobram quando alguém passa (mola amortecida)
// =====================================================================
// =====================================================================
// Árvores: vento na copa, folhas caindo e tremida quando um jacaré sai
// =====================================================================
function shakeTree(t, dir) {
  t.vel += (dir || (Math.random() < 0.5 ? -1 : 1)) * TREE.shakeImpulse;
  t.cool = TREE.shakeCooldown;
  for (let i = 0; i < 5; i++) dropLeaf(t, true);
}

function dropLeaf(t, burst = false) {
  const S = TREE.scale, w = 48 * S;
  const left = t.x - TREE.trunkX * S;
  const x = left + rand(0.12, 0.88) * w, y = t.baseY - (TREE.baseRow - rand(4, 22)) * S;
  leaves.push({ x, y, vx: burst ? rand(-70, 70) : rand(-12, 12), vy: burst ? rand(-60, 10) : rand(15, 30),
    ph: rand(0, 6.28), sw: rand(18, 34), floor: t.baseY + rand(-6, 26), age: 0, landed: 0,
    size: Math.random() < 0.6 ? 2 : 1, color: LEAF_COLORS[Math.floor(Math.random() * LEAF_COLORS.length)] });
}

function updateTrees(dt) {
  for (const t of trees) {
    // jacaré andando passa pela árvore (tronco ou embaixo da copa) -> ela balança
    if ((t.cool -= dt) <= 0) {
      const S = TREE.scale;
      for (const e of enemies) {
        if (!e.alive || e.speed <= 0) continue;
        const feet = e.y + ENEMY_H * SCALE / 2;
        if (Math.abs(e.x - t.x) < 16 * S && feet > t.baseY - 26 * S && feet < t.baseY + 6 * S) {
          shakeTree(t, e.x < t.x ? 1 : -1);   // balança para o lado contrário de quem passou
          sfx.rustle();
          break;
        }
      }
    }
    // mola amortecida: a tremida vai sumindo
    t.vel += (-t.sway * 60 - t.vel * 5) * dt;
    t.sway += t.vel * dt;
    if ((t.leafT -= dt) <= 0) { t.leafT = rand(...TREE.leafEvery); if (t.side === 'top' || Math.random() < 0.6) dropLeaf(t); }
  }
  for (let i = leaves.length - 1; i >= 0; i--) {
    const l = leaves[i];
    l.age += dt;
    if (l.landed > 0) { if ((l.landed += dt) > 2.5) leaves.splice(i, 1); continue; }
    l.vx *= Math.exp(-2 * dt);
    l.vy += (40 - l.vy) * Math.min(1, dt * 2);          // cai devagar (resistência do ar)
    l.x += (l.vx + Math.cos(l.age * 3 + l.ph) * l.sw) * dt;   // vai e volta enquanto cai
    l.y += l.vy * dt;
    if (l.y >= l.floor) { l.y = l.floor; l.landed = 0.001; }
    if (l.age > 12) leaves.splice(i, 1);
  }
}

function drawTree(t) {
  if (!treeImg.complete) return;
  const S = TREE.scale;
  const wind = Math.sin(clock * 1.1 + t.phase) * 0.6 + Math.sin(clock * 0.47 + t.x * 0.01) * 0.4;
  const sway = wind * TREE.windAmp + t.sway;
  const x0 = Math.round(t.x - TREE.trunkX * S), y0 = Math.round(t.baseY - TREE.baseRow * S);
  // sombra
  ctx.fillStyle = 'rgba(0,0,0,.22)';
  ctx.beginPath(); ctx.ellipse(t.x, t.baseY, 15 * S, 3 * S, 0, 0, Math.PI * 2); ctx.fill();
  // em faixas: a copa desliza mais em cima, o tronco não mexe
  if (t.flip) { ctx.save(); ctx.translate(2 * x0 + 48 * S, 0); ctx.scale(-1, 1); }
  for (let r = 0; r < 48; r += TREE.slice) {
    const n = Math.min(TREE.slice, 48 - r);
    let off = 0;
    if (r < TREE.canopyRows) off = Math.round(sway * (0.35 + 0.65 * Math.pow(1 - r / TREE.canopyRows, 1.2)));
    ctx.drawImage(treeImg, 0, r, 48, n, x0 + (t.flip ? -off : off), y0 + r * S, 48 * S, n * S);
  }
  if (t.flip) ctx.restore();
}

// =====================================================================
// Iluminação: sombra da mata nas bordas, sol na clareira, raios, luzes dinâmicas e vagalumes
// =====================================================================
const lightCanvas = document.createElement('canvas');
const lightCtx = lightCanvas.getContext('2d');
const shadeCache = document.createElement('canvas');   // sombra estática (recalculada só ao mudar o tamanho)

function buildLightCache() {
  const W = WORLD_W, H = WORLD_H, [r, g, b] = LIGHT.shade;
  shadeCache.width = lightCanvas.width = W;
  shadeCache.height = lightCanvas.height = H;
  const c = shadeCache.getContext('2d');
  c.clearRect(0, 0, W, H);
  // radial: clara no meio, escura perto das árvores (elíptica, acompanha a tela)
  const R = Math.max(W, H) * 0.62;
  c.save();
  c.translate(W / 2, H / 2);
  c.scale(W / Math.max(W, H), H / Math.max(W, H));
  const gr = c.createRadialGradient(0, 0, R * 0.42, 0, 0, R);
  gr.addColorStop(0, `rgba(${r},${g},${b},0)`);
  gr.addColorStop(0.45, `rgba(${r},${g},${b},${LIGHT.edgeDark * 0.35})`);
  gr.addColorStop(1, `rgba(${r},${g},${b},${LIGHT.edgeDark})`);
  c.fillStyle = gr;
  c.fillRect(-R * 2, -R * 2, R * 4, R * 4);
  c.restore();
  // faixa extra embaixo das copas (topo e base da tela)
  const top = c.createLinearGradient(0, 0, 0, 140);
  top.addColorStop(0, `rgba(${r},${g},${b},0.35)`); top.addColorStop(1, `rgba(${r},${g},${b},0)`);
  c.fillStyle = top; c.fillRect(0, 0, W, 140);
  const bot = c.createLinearGradient(0, H, 0, H - 90);
  bot.addColorStop(0, `rgba(${r},${g},${b},0.3)`); bot.addColorStop(1, `rgba(${r},${g},${b},0)`);
  c.fillStyle = bot; c.fillRect(0, H - 90, W, 90);
}

// abre um "buraco" de luz na sombra
function punchLight(x, y, radius, strength) {
  const g = lightCtx.createRadialGradient(x, y, 0, x, y, radius);
  g.addColorStop(0, `rgba(0,0,0,${strength})`);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  lightCtx.fillStyle = g;
  lightCtx.fillRect(x - radius, y - radius, radius * 2, radius * 2);
}

function fireflyPos(f) {
  return { x: f.bx + Math.sin(clock * f.sx + f.ph) * f.ax + Math.sin(clock * f.sx * 2.3 + f.ph * 2) * 10,
           y: f.by + Math.cos(clock * f.sy + f.ph) * f.ay + Math.sin(clock * 1.7 + f.ph) * 4 };
}
// pisca devagar e às vezes "apaga" (curva pontuda)
const fireflyGlow = f => Math.pow(Math.max(0, Math.sin(clock * f.blink + f.ph)), 3);

function drawLighting() {
  if (!WORLD_W) return;
  // 1) sombra: cópia da sombra estática, com luzes recortadas
  lightCtx.globalCompositeOperation = 'source-over';
  lightCtx.clearRect(0, 0, lightCanvas.width, lightCanvas.height);
  lightCtx.drawImage(shadeCache, 0, 0);
  lightCtx.globalCompositeOperation = 'destination-out';
  if (mode !== 'menu' && player.hp > 0) punchLight(player.x, player.y, 150, LIGHT.playerLight);
  if (player.flash > 0) {                                  // clarão do tiro ilumina em volta
    const m = muzzlePos(), k = player.flash / 0.07;
    punchLight(m.x, m.y, 260, 0.9 * k);
  }
  for (const f of fireflies) { const q = fireflyPos(f); punchLight(q.x, q.y, 34, 0.5 * fireflyGlow(f)); }
  for (const p of particles) if (p.color === 'ring' && p.size > 20) punchLight(p.x, p.y, p.size * 1.2, 0.35 * (1 - p.age / p.life));
  ctx.drawImage(lightCanvas, 0, 0);

  // 2) luz quente da clareira + raios de sol (aditivo, bem sutil)
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const cx = WORLD_W / 2, cy = WORLD_H / 2, R = SAND_RADIUS * Math.min(WORLD_W, WORLD_H) * 1.35;
  const pulse = 1 + Math.sin(clock * 0.4) * 0.12;
  const sun = ctx.createRadialGradient(cx, cy - R * 0.15, 0, cx, cy, R);
  sun.addColorStop(0, `rgba(255,225,150,${LIGHT.sun * pulse})`);
  sun.addColorStop(1, 'rgba(255,225,150,0)');
  ctx.fillStyle = sun;
  ctx.fillRect(cx - R, cy - R, R * 2, R * 2);
  // raios diagonais vindos de cima à esquerda, oscilando devagar
  for (let i = 0; i < 4; i++) {
    const a = LIGHT.rays * (0.6 + 0.4 * Math.sin(clock * (0.25 + i * 0.07) + i * 2));
    const x = cx - R * 0.9 + i * R * 0.5 + Math.sin(clock * 0.15 + i) * 20, w = 26 + i * 9;
    const g = ctx.createLinearGradient(x, 0, x + WORLD_H * 0.45, WORLD_H);
    g.addColorStop(0, `rgba(255,240,190,${a})`);
    g.addColorStop(0.7, `rgba(255,240,190,${a * 0.4})`);
    g.addColorStop(1, 'rgba(255,240,190,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(x, 0); ctx.lineTo(x + w, 0);
    ctx.lineTo(x + w + WORLD_H * 0.45, WORLD_H); ctx.lineTo(x + WORLD_H * 0.45, WORLD_H);
    ctx.fill();
  }
  ctx.restore();
}

function drawFireflies() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const f of fireflies) {
    const g = fireflyGlow(f);
    if (g < 0.02) continue;
    const q = fireflyPos(f);
    const halo = ctx.createRadialGradient(q.x, q.y, 0, q.x, q.y, 14);
    halo.addColorStop(0, `rgba(210,255,120,${0.45 * g})`);
    halo.addColorStop(1, 'rgba(210,255,120,0)');
    ctx.fillStyle = halo;
    ctx.fillRect(q.x - 14, q.y - 14, 28, 28);
    ctx.fillStyle = `rgba(240,255,170,${0.9 * g})`;
    ctx.fillRect(Math.round(q.x) - 2, Math.round(q.y) - 2, 4, 4);   // miolo em pixel
  }
  ctx.restore();
}

function drawLeaves(landed) {
  const S = TREE.scale;
  for (const l of leaves) {
    if ((l.landed > 0) !== landed) continue;
    ctx.globalAlpha = l.landed > 0 ? Math.max(0, 1 - (l.landed - 1.5)) : 1;
    ctx.fillStyle = l.color;
    const w = (l.size === 2 ? 2 : 1) * S, h = S;
    // folha "virando" enquanto cai: alterna a largura
    const flipW = l.landed > 0 ? w : Math.max(S, Math.round(w * Math.abs(Math.cos(l.age * 5 + l.ph))));
    ctx.fillRect(Math.round(l.x - flipW / 2), Math.round(l.y), flipW, h);
  }
  ctx.globalAlpha = 1;
}

function updateTufts(dt) {
  const bodies = [];
  if (mode !== 'menu' && player.hp > 0) bodies.push({ x: player.x, y: player.y + player.h / 2 - 6, moving: true });
  for (const e of enemies) if (e.alive) bodies.push({ x: e.x, y: e.y + ENEMY_H * SCALE / 2 - 6 });
  for (const t of tufts) {
    let push = 0, near = false;
    for (const b of bodies) {
      const dx = t.x - b.x, dy = (t.y - b.y) * 1.6, dist = Math.hypot(dx, dy);
      if (dist < TUFT.pushRadius) {
        near = true;
        push += Math.sign(dx || 1) * TUFT.pushForce * (1 - dist / TUFT.pushRadius) * 1.6;
      }
    }
    if (near && !t.touched) {   // folhinhas ao entrar no tufo
      for (let i = 0; i < 2; i++)
        particles.push({ x: t.x + rand(-8, 8), y: t.y - rand(10, 24), vx: rand(-50, 50), vy: rand(-90, -40), life: rand(0.3, 0.5),
          age: 0, size: 3, color: Math.random() < .5 ? '#7bd04a' : '#4f9a3c', gravity: 300, drag: 3 });
    }
    t.touched = near;
    // mola: puxa para a posição empurrada (ou 0) e oscila um pouco ao soltar
    const target = Math.max(-TUFT.pushForce, Math.min(TUFT.pushForce, push));
    t.vel += ((target - t.bend) * 90 - t.vel * 9) * dt;
    t.bend += t.vel * dt;
  }
}

function drawTuft(t) {
  const im = t.big ? tuftBigImg : tuftSmallImg;
  if (!im.complete) return;
  const S = TUFT.scale, w = im.width, h = im.height;
  // vento: onda que atravessa a tela + rajadas lentas
  const wind = Math.sin(clock * 1.7 + t.x * 0.011 + t.phase * 0.3) * 0.65
             + Math.sin(clock * 0.53 + t.x * 0.004) * 0.35;
  const sway = wind * TUFT.windAmp * (t.big ? 1.2 : 0.8) + t.bend;
  const x0 = Math.round(t.x - (w * S) / 2), y0 = Math.round(t.y - h * S);
  // desenha linha a linha: o topo se desloca mais que a base (base fica presa no chão)
  for (let r = 0; r < h; r++) {
    const k = Math.pow(1 - r / h, 1.6);
    const off = Math.round(sway * k);
    if (t.flip) {
      ctx.save(); ctx.translate(x0 + w * S + off, 0); ctx.scale(-1, 1);
      ctx.drawImage(im, 0, r, w, 1, 0, y0 + r * S, w * S, S);
      ctx.restore();
    } else {
      ctx.drawImage(im, 0, r, w, 1, x0 + off, y0 + r * S, w * S, S);
    }
  }
}

function drawGun() {
  if (player.meleeT >= 0) {
    // golpe de faca: 3 frames do GIF, apontado para onde o golpe começou
    const f = meleeImgs[Math.min(2, Math.floor(player.meleeT / MELEE_FRAME))];
    if (!f.complete) return;
    const h = hand(), a = player.meleeAngle;
    ctx.save();
    ctx.translate(Math.round(h.x + Math.cos(a) * 2 * SCALE), Math.round(h.y + Math.sin(a) * 2 * SCALE));
    ctx.rotate(a);
    if (Math.cos(a) < 0) ctx.scale(1, -1);
    const ms = MELEE_SCALE * meleeRangeMul();   // faca cresce junto com o alcance
    ctx.drawImage(f, -MELEE_GRIP.x * ms, -MELEE_GRIP.y * ms, MELEE_W * ms, MELEE_H * ms);
    ctx.restore();
    return;
  }
  if (player.reloading) {
    // pose de recarga: arma de lado, inclinada para cima, animação do GIF (frame 1 -> 2)
    const f = reloadImgs[player.reloadT < reloadShell() / 2 ? 0 : 1];
    if (!f.complete) return;
    const h = hand();
    ctx.save();
    ctx.translate(Math.round(h.x + player.facing * 8), Math.round(h.y - 2));
    ctx.scale(player.facing, 1);
    ctx.rotate(-0.35 + Math.sin(player.reloadT / reloadShell() * Math.PI) * 0.08);
    ctx.drawImage(f, -RELOAD_GRIP.x * SCALE, -RELOAD_GRIP.y * SCALE, RELOAD_W * SCALE, RELOAD_H * SCALE);
    ctx.restore();
    return;
  }
  if (!gunSprite.complete) return;
  const g = gunTransform();
  ctx.save();
  ctx.translate(Math.round(g.x), Math.round(g.y));
  ctx.rotate(g.rot);
  if (g.flip < 0) ctx.scale(1, -1);  // mirando à esquerda: não fica de cabeça para baixo
  ctx.drawImage(gunSprite, -GUN_GRIP.x * SCALE, -GUN_GRIP.y * SCALE, GUN_W * SCALE, GUN_H * SCALE);
  ctx.restore();
}

function drawMuzzleFlash() {
  if (player.flash <= 0) return;
  const m = muzzlePos(), a = player.flashAngle, k = player.flash / 0.07;
  ctx.save();
  ctx.translate(m.x, m.y); ctx.rotate(a);
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = `rgba(255,200,80,${0.35 * k})`;
  ctx.beginPath(); ctx.arc(8, 0, 34 * k + 10, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff3c4';
  ctx.beginPath();                                  // cone do clarão
  ctx.moveTo(0, -7 * k); ctx.lineTo(44 * k + 12, 0); ctx.lineTo(0, 7 * k);
  ctx.moveTo(4, 0); ctx.lineTo(18, -16 * k); ctx.lineTo(14, 0); ctx.lineTo(18, 16 * k);
  ctx.fill();
  ctx.restore();
}

// =====================================================================
// Caminhada: passo aberto -> pernas juntas (corpo sobe) -> passo aberto -> ...
// =====================================================================
function updateWalk(dt, input, moved, dx) {
  const walking = input && !gameOver && moved > SPEED * dt * 0.3;   // andando de verdade (não preso na parede)
  player.moveX += ((walking ? dx : 0) - player.moveX) * Math.min(1, dt * 12);
  if (walking) {
    if (!player.walking) player.walkDist = WALK.stepLen;  // começa já no passo aberto
    player.walkDist += moved;
    const frame = Math.floor(player.walkDist / WALK.stepLen) % 2 === 1 ? 'step' : 'pass';
    if (frame === 'step' && player.walkFrame !== 'step') footstep();
    player.walkFrame = frame;
    player.idleT = 0;
  } else {
    if (player.walking) player.walkFrame = 'stand';
    player.idleT += dt;
    // parado: pernas abertas, respirando (corpo sobe 1 px de vez em quando)
    player.walkFrame = Math.sin(player.idleT * 2.4) > 0.55 ? 'breath' : 'stand';
  }
  player.walking = walking;
  updateBlink(dt);
}

// piscadas: de vez em quando (3-7 s), às vezes duas seguidas
function updateBlink(dt) {
  if (player.blinkT > 0) { player.blinkT -= dt; return; }
  if ((player.blinkNext -= dt) > 0) return;
  player.blinkT = BLINK.dur;
  if (player.blinkAgain) {                       // esta é a segunda da dupla
    player.blinkAgain = false;
    player.blinkNext = rand(...BLINK.every);
  } else if (Math.random() < BLINK.doubleChance) {
    player.blinkAgain = true;
    player.blinkNext = BLINK.dur + 0.12;         // segunda piscada logo em seguida
  } else {
    player.blinkNext = rand(...BLINK.every);
  }
}

function footstep() {
  sfx.step();
  if (!WALK.dust) return;
  const fx = player.x + rand(-10, 10), fy = player.y + player.h / 2 - 4;
  for (let i = 0; i < 2; i++)
    particles.push({ x: fx, y: fy, vx: rand(-40, 40) - player.moveX * 30, vy: rand(-30, -8), life: rand(0.25, 0.4), age: 0,
      size: rand(3, 5), grow: 10, color: 'dust', drag: 4 });
}

function drawPlayer() {
  const px = Math.round(player.x), py = Math.round(player.y);
  ctx.fillStyle = 'rgba(0,0,0,.28)';
  ctx.beginPath();
  ctx.ellipse(px, py + player.h / 2 - 2, player.w * 0.35, 6, 0, 0, Math.PI * 2);
  ctx.fill();
  const fr = walkFrame(player.walkFrame, player.blinkT > 0);
  if (!fr) return;
  ctx.save();
  ctx.translate(px, py + player.h / 2);                 // pivô nos pés: inclina sem tirar os pés do chão
  ctx.rotate(player.moveX * WALK.tilt);
  if (player.facing !== SPRITE_FACES) ctx.scale(-1, 1);
  // invencível: pisca; logo após o dano: fica branco
  if (player.invuln > 0 && Math.floor(player.invuln * 14) % 2 === 0) ctx.globalAlpha = 0.35;
  ctx.drawImage(player.hurt > 0.5 ? whiteOf(fr) : fr, -player.w / 2, -player.h - SCALE, player.w, player.h + SCALE);
  ctx.restore();
}

function drawBullets() {
  ctx.lineCap = 'round';
  for (const b of bullets) {
    const k = 1 - b.age / b.life, s = SHOT.bulletScale * bulletMul();
    // rastro
    ctx.strokeStyle = `rgba(255,255,255,${0.35 * k})`;
    ctx.lineWidth = s * 0.6;
    ctx.beginPath();
    ctx.moveTo(b.x - (b.x - b.px) * 2.5, b.y - (b.y - b.py) * 2.5);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
    // projétil: mesmo formato 3x1 do tiro.png, pintado de branco
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(Math.atan2(b.vy, b.vx));
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(-1.5 * s, -0.5 * s, 3 * s, 1 * s);
    ctx.restore();
  }
}

function drawParticles() {
  for (const p of particles) {
    const k = 1 - p.age / p.life;
    if (p.color === 'shell') {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.globalAlpha = Math.min(1, k * 3);
      ctx.fillStyle = '#ac3232'; ctx.fillRect(-4, -2, 6, 4);   // corpo vermelho
      ctx.fillStyle = '#df9b26'; ctx.fillRect(2, -2, 3, 4);    // base de latão
      ctx.restore();
    } else if (p.color === 'text') {
      ctx.globalAlpha = Math.min(1, k * 2);
      ctx.font = 'bold 18px monospace';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#000'; ctx.fillText(p.text, p.x + 2, p.y + 2);
      ctx.fillStyle = p.tint || '#ffe08a'; ctx.fillText(p.text, p.x, p.y);
      ctx.textAlign = 'left';
      ctx.globalAlpha = 1;
    } else if (p.color === 'sparkle') {               // estrelinha de 4 pontas
      const r = p.size * Math.sin(Math.PI * (1 - k)); // cresce e some
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(Math.round(p.x - 1), Math.round(p.y - r), 2, Math.round(r * 2));
      ctx.fillRect(Math.round(p.x - r), Math.round(p.y - 1), Math.round(r * 2), 2);
    } else if (p.color === 'ring') {
      ctx.strokeStyle = `rgba(255,240,180,${k})`;
      ctx.lineWidth = 3 * k + 1;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.stroke();
    } else if (p.color === 'smoke' || p.color === 'dust') {
      ctx.fillStyle = p.color === 'smoke' ? `rgba(220,220,210,${0.35 * k})` : `rgba(230,200,150,${0.4 * k})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.globalAlpha = k;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
      ctx.globalAlpha = 1;
    }
  }
  ctx.globalAlpha = 1;
}

function drawCrosshair() {
  const x = Math.round(mouse.x), y = Math.round(mouse.y);
  const g = 3 + crossPulse * 9, r = 9 + crossPulse * 9;
  ctx.strokeStyle = '#f4f1de';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x - r, y); ctx.lineTo(x - g, y);
  ctx.moveTo(x + g, y); ctx.lineTo(x + r, y);
  ctx.moveTo(x, y - r); ctx.lineTo(x, y - g);
  ctx.moveTo(x, y + g); ctx.lineTo(x, y + r);
  ctx.stroke();
  ctx.fillStyle = '#e63946';
  ctx.fillRect(x - 1, y - 1, 2, 2);
}

function drawEnemy(e) {
  if (!e.alive || !enemyImg.complete) return;
  const w = ENEMY_W * SCALE, h = ENEMY_H * SCALE;
  const lx = (e.dirX || 0) * e.lunge * 14, ly = (e.dirY || 0) * e.lunge * 14;   // bote na mordida
  const ex = Math.round(e.x + lx + rand(-1, 1) * e.jiggle * 4), ey = Math.round(e.y + ly);
  // andando: pulinhos + balanço (só temos 1 frame de sprite)
  const moving = e.speed > 0 && !gameOver && !e.attacking;
  const hop = moving ? Math.abs(Math.sin(e.walk)) * 6 : 0;
  const tilt = moving ? Math.sin(e.walk) * 0.08 : 0;

  ctx.fillStyle = 'rgba(0,0,0,.28)';
  ctx.beginPath();
  ctx.ellipse(e.x, ey + h / 2 - 2, w * 0.35 * (1 - hop / 30), 6, 0, 0, Math.PI * 2);
  ctx.fill();

  const sq = 1 + e.jiggle * 0.08;  // "squash" rápido ao ser atingido
  ctx.save();
  ctx.translate(ex, ey + h / 2 - hop);
  ctx.rotate(tilt);
  ctx.scale(sq * (e.facing === -1 ? 1 : -1), 1 / sq);   // sprite olha para a esquerda
  ctx.drawImage(e.flash > 0 ? whiteOf(enemyImg) : enemyImg, -w / 2, -h, w, h);
  ctx.restore();

  // barra de vida (aparece depois de tomar dano)
  if (e.hpShow > 0) {
    const bw = 56, bh = 6, bx = e.x - bw / 2, by = ey - h / 2 - 16;
    ctx.globalAlpha = Math.min(1, e.hpShow * 2);
    ctx.fillStyle = '#000'; ctx.fillRect(bx - 2, by - 2, bw + 4, bh + 4);
    ctx.fillStyle = '#3a1414'; ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = '#e63946'; ctx.fillRect(bx, by, Math.round(bw * e.hp / e.maxHp), bh);
    ctx.globalAlpha = 1;
  }
}

const fmtTime = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;

function drawRunHud() {
  if (mode !== 'rogue') return;
  const alive = enemies.filter(e => e.alive).length;
  const left = run.phase === 'fight' ? run.toSpawn + alive : 0;
  const text = run.wave === 0 ? 'PREPARE-SE' : `WAVE ${run.wave}`;
  const cx = canvas.width / 2;
  ctx.textAlign = 'center';
  ctx.font = 'bold 24px monospace';
  ctx.fillStyle = '#000'; ctx.fillText(text, cx + 2, 34);
  ctx.fillStyle = '#e9c46a'; ctx.fillText(text, cx, 32);
  ctx.font = 'bold 13px monospace';
  const sub = run.phase === 'fight' ? `${left} jacarés  ·  ${run.kills} abates`
                                    : `próxima em ${Math.ceil(run.phaseT)}s  ·  ${run.kills} abates`;
  ctx.fillStyle = '#000'; ctx.fillText(sub, cx + 1, 53);
  ctx.fillStyle = '#f4f1de'; ctx.fillText(sub, cx, 52);
  ctx.textAlign = 'left';
  drawBanner();
}

// anúncios no centro. Início de wave: entra "batendo" na tela, com clarão e faixas de cinema.
function drawBanner() {
  const b = run.banner;
  if (!b || gameOver || paused || run.phase === 'cards') return;
  const W = canvas.width, H = canvas.height, t = b.t;
  const outA = Math.min(1, (b.dur - t) / 0.4);
  if (b.big) {
    // clarão
    if (t < 0.3) { ctx.fillStyle = `rgba(255,240,210,${0.45 * (1 - t / 0.3)})`; ctx.fillRect(0, 0, W, H); }
    // faixas de cinema
    const bar = H * 0.12 * Math.min(1, t / 0.18) * outA;
    ctx.fillStyle = 'rgba(0,0,0,.75)'; ctx.fillRect(0, 0, W, bar); ctx.fillRect(0, H - bar, W, bar);
    // faixa vermelha atrás do texto
    const cy = H * 0.42;
    const stripe = Math.min(1, t / 0.15);
    ctx.fillStyle = `rgba(150,20,20,${0.55 * outA})`;
    ctx.fillRect(W / 2 - (W / 2) * stripe, cy - 70, W * stripe, 120);
    ctx.fillStyle = `rgba(255,90,60,${0.8 * outA})`;
    ctx.fillRect(W / 2 - (W / 2) * stripe, cy - 74, W * stripe, 4); ctx.fillRect(W / 2 - (W / 2) * stripe, cy + 50, W * stripe, 4);
    // texto: começa enorme e "bate" no lugar, com um tremidinho só no texto
    const k = Math.min(1, t / 0.16);
    const sc = k < 1 ? 3 - 2 * (1 - Math.pow(1 - k, 3)) : 1 + Math.sin(Math.min(1, (t - 0.16) / 0.25) * Math.PI) * 0.06;
    const jit = t < 0.5 ? (1 - t / 0.5) * 5 : 0;
    const fs = Math.min(130, Math.floor(W / 5.2));
    ctx.save();
    ctx.globalAlpha = Math.min(1, t / 0.08) * outA;
    ctx.translate(W / 2 + rand(-jit, jit), cy + rand(-jit, jit));
    ctx.scale(sc, sc);
    ctx.textAlign = 'center';
    ctx.font = `bold ${fs}px monospace`;
    ctx.lineJoin = 'round'; ctx.lineWidth = 10; ctx.strokeStyle = '#000';
    ctx.strokeText(b.text, 0, 26);
    const g = ctx.createLinearGradient(0, -fs * 0.6, 0, 26);
    g.addColorStop(0, '#ffe08a'); g.addColorStop(1, '#ff6b3d');
    ctx.fillStyle = g; ctx.fillText(b.text, 0, 26);
    if (b.sub) {
      ctx.font = 'bold 20px monospace';
      ctx.lineWidth = 5; ctx.strokeText(b.sub.toUpperCase(), 0, 66);
      ctx.fillStyle = '#f4f1de'; ctx.fillText(b.sub.toUpperCase(), 0, 66);
    }
    ctx.restore();
    return;
  }
  const inT = Math.min(1, t / 0.25), a = Math.min(inT, outA), sc = 1 + (1 - inT) * 0.6;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.translate(W / 2, H * 0.3);
  ctx.scale(sc, sc);
  ctx.textAlign = 'center';
  ctx.font = 'bold 56px monospace';
  ctx.lineWidth = 8; ctx.lineJoin = 'round'; ctx.strokeStyle = '#000'; ctx.strokeText(b.text, 0, 0);
  ctx.fillStyle = b.color; ctx.fillText(b.text, 0, 0);
  if (b.sub) {
    ctx.font = 'bold 18px monospace';
    ctx.lineWidth = 4; ctx.strokeText(b.sub, 0, 34);
    ctx.fillStyle = '#f4f1de'; ctx.fillText(b.sub, 0, 34);
  }
  ctx.restore();
}

// jacarezinho com a escopeta na mão (tela inicial)
function drawTitleGator(cx, cy) {
  const fr = walkFrame(Math.sin(clock * 2.4) > 0.55 ? 'breath' : 'stand', clock % 4.3 < BLINK.dur);
  if (!fr || !gunSprite.complete) return;
  const S = 6, w = 18 * S, h = 18 * S;
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.beginPath(); ctx.ellipse(cx, cy + h / 2 - 2, w * 0.36, 8, 0, 0, Math.PI * 2); ctx.fill();
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(-1, 1);                                        // sprite olha para a esquerda: vira para a direita
  ctx.drawImage(fr, -w / 2, -h / 2 - S, w, h + S);
  ctx.restore();
  // escopeta empunhada, apontando um pouco para cima, com um leve "respirar"
  const a = -0.28 + Math.sin(clock * 1.3) * 0.04;
  const hx = cx + GUN_HAND.x * S, hy = cy + GUN_HAND.y * S;
  ctx.save();
  ctx.translate(hx + Math.cos(a) * GUN_RADIUS * S, hy + Math.sin(a) * GUN_RADIUS * S);
  ctx.rotate(a);
  ctx.drawImage(gunSprite, -GUN_GRIP.x * S, -GUN_GRIP.y * S, GUN_W * S, GUN_H * S);
  ctx.restore();
}

function drawButtons(list, hov) {
  for (const b of list) {
    const on = hov === b;
    ctx.fillStyle = on ? '#f4f1de' : 'rgba(20,28,20,.9)';
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = '#f4f1de'; ctx.lineWidth = 2;
    ctx.strokeRect(b.x + 1, b.y + 1, b.w - 2, b.h - 2);
    ctx.fillStyle = on ? '#10170f' : '#f4f1de';
    ctx.font = b.small ? 'bold 26px monospace' : 'bold 20px monospace';
    if (!b.sub) { ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2 + (b.small ? 9 : 7)); continue; }
    ctx.fillText(b.label, b.x + b.w / 2, b.y + (b.h > 56 ? 28 : 26));
    ctx.font = '13px monospace';
    ctx.fillStyle = on ? '#3a4a3a' : '#a9b8a0';
    ctx.fillText(b.sub, b.x + b.w / 2, b.y + (b.h > 56 ? 48 : 43));
  }
}

// ícones pequenos em pixel art para as cartas
const PIX = {
  crit: ['...#...', '...#...', '.#####.', '##.#.##', '.#####.', '...#...', '...#...'],
  vamp: ['...#...', '..###..', '.#####.', '#######', '#######', '.#####.', '..###..'],
};
function drawPix(pat, x, y, s, col) {
  ctx.fillStyle = col;
  pat.forEach((row, r) => [...row].forEach((ch, c) => { if (ch === '#') ctx.fillRect(x + c * s, y + r * s, s, s); }));
}
function drawCardIcon(u, cx, cy, sz) {
  const img2 = { atkSpd: gunSprite, shotDmg: gunSprite, pellets: gunSprite, reload: ammoFullImg, bulletSz: null,
    houseHp: houseImg, meleeCd: meleeImgs[0], meleeDmg: meleeImgs[0], meleeKb: meleeImgs[0], meleeRng: meleeImgs[0] }[u.id];
  if (u.id === 'crit') return drawPix(PIX.crit, cx - 3.5 * sz / 7, cy - 3.5 * sz / 7, sz / 7, '#ffd166');
  if (u.id === 'vamp') return drawPix(PIX.vamp, cx - 3.5 * sz / 7, cy - 3.5 * sz / 7, sz / 7, '#e63946');
  if (u.id === 'bulletSz') {                         // bala branca grande
    ctx.fillStyle = '#fff'; ctx.fillRect(cx - sz * 0.45, cy - sz * 0.15, sz * 0.9, sz * 0.3); return;
  }
  if (!img2 || !img2.complete) return;
  const k = sz / Math.max(img2.width, img2.height);
  ctx.drawImage(img2, Math.round(cx - img2.width * k / 2), Math.round(cy - img2.height * k / 2), img2.width * k, img2.height * k);
  if (u.id === 'pellets') { ctx.fillStyle = '#fff'; for (let i = 0; i < 3; i++) ctx.fillRect(cx + sz * 0.55, cy - 10 + i * 9, 10, 4); }
}

function wrapText(text, maxW) {
  const words = text.split(' '), lines = []; let line = '';
  for (const w of words) {
    const t = line ? line + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t;
  }
  if (line) lines.push(line);
  return lines;
}

function drawCards() {
  if (mode !== 'rogue' || run.phase !== 'cards' || !cards.list.length) return;
  ctx.fillStyle = 'rgba(6,10,8,.55)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  const rects = cardRects(), hov = cards.picked < 0 ? hoveredIn(rects) : null;
  ctx.textAlign = 'center';
  const titleA = Math.min(1, cards.t / 0.3);
  ctx.globalAlpha = titleA;
  ctx.font = 'bold 30px monospace';
  ctx.fillStyle = '#000'; ctx.fillText('ESCOLHA UM UPGRADE', canvas.width / 2 + 3, rects[0].y - 26);
  ctx.fillStyle = '#e9c46a'; ctx.fillText('ESCOLHA UM UPGRADE', canvas.width / 2, rects[0].y - 29);
  ctx.globalAlpha = 1;
  for (const r of rects) {
    // entrada: sobe e aparece, uma de cada vez
    const ent = Math.max(0, Math.min(1, (cards.t - r.i * 0.08) / 0.3));
    const e = 1 - Math.pow(1 - ent, 3);
    let y = r.y + (1 - e) * 60, a = e, sc = 1;
    const on = hov === r, chosen = cards.picked === r.i;
    if (on) y -= 8;
    if (cards.picked >= 0) {
      if (chosen) { sc = 1 + Math.sin(Math.min(1, cards.pickT / 0.2) * Math.PI) * 0.08; y -= 12; }
      else a *= Math.max(0, 1 - cards.pickT / 0.25);
    }
    if (a <= 0.01) continue;
    const col = CAT_COLOR[r.u.cat];
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(r.x + r.w / 2, y + r.h / 2); ctx.scale(sc, sc); ctx.translate(-r.w / 2, -r.h / 2);
    ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(5, 6, r.w, r.h);                 // sombra
    ctx.fillStyle = '#18221a'; ctx.fillRect(0, 0, r.w, r.h);
    ctx.fillStyle = col; ctx.fillRect(0, 0, r.w, 6);                                  // faixa da categoria
    ctx.strokeStyle = on || chosen ? '#fff' : col; ctx.lineWidth = on || chosen ? 3 : 2;
    ctx.strokeRect(1, 1, r.w - 2, r.h - 2);
    // ícone
    ctx.fillStyle = 'rgba(255,255,255,.05)'; ctx.fillRect(12, 18, r.w - 24, r.h * 0.34);
    drawCardIcon(r.u, r.w / 2, 18 + r.h * 0.17, Math.min(64, r.w * 0.42));
    // textos
    ctx.textAlign = 'center';
    ctx.font = 'bold 15px monospace'; ctx.fillStyle = '#f4f1de';
    ctx.fillText(r.u.title, r.w / 2, r.h * 0.34 + 44);
    ctx.font = '12px monospace'; ctx.fillStyle = '#c9d4c0';
    wrapText(r.u.desc, r.w - 22).forEach((l, i) => ctx.fillText(l, r.w / 2, r.h * 0.34 + 66 + i * 16));
    ctx.font = 'bold 11px monospace'; ctx.fillStyle = col;
    ctx.fillText(r.u.cat.toUpperCase() + '  ·  ' + (lv[r.u.id] ? `nível ${lv[r.u.id]} → ${lv[r.u.id] + 1}` : 'NOVO'), r.w / 2, r.h - 30);
    ctx.fillStyle = 'rgba(244,241,222,.55)'; ctx.fillText(`[${r.i + 1}]`, r.w / 2, r.h - 12);
    ctx.restore();
  }
  ctx.textAlign = 'left';
}

// coração em pixel art (7x6)
const HEART = ['.##.##.', '#######', '#######', '.#####.', '..###..', '...#...'];
function drawHeart(x, y, s, full) {
  for (let r = 0; r < HEART.length; r++)
    for (let c = 0; c < 7; c++) if (HEART[r][c] === '#') {
      ctx.fillStyle = full ? (r === 1 && c === 1 ? '#ffb3b3' : '#e63946') : '#3a2a2a';
      ctx.fillRect(x + c * s, y + r * s, s, s);
    }
}

function drawHearts() {
  const s = 4, gap = 6, x0 = 16, y0 = 16;
  for (let i = 0; i < PLAYER_HP; i++) {
    const lost = i === player.hp;                // o coração que acabou de ser perdido pula
    const pop = lost ? heartPop : 0;
    const x = x0 + i * (7 * s + gap) + (pop ? rand(-1, 1) * pop * 4 : 0);
    const y = y0 - pop * 8;
    // contorno
    ctx.fillStyle = '#000';
    for (let r = 0; r < HEART.length; r++)
      for (let c = 0; c < 7; c++) if (HEART[r][c] === '#') ctx.fillRect(x + c * s - 2, y + r * s - 2, s + 4, s + 4);
    drawHeart(x, y, s, i < player.hp);
    if (pop > 0.05) { ctx.globalAlpha = pop; drawHeart(x, y, s, true); ctx.globalAlpha = 1; }
  }
}

function drawHouse() {
  if ((!house.active && !house.decor) || !houseImg.complete) return;
  const w = HOUSE_W * HOUSE_SCALE, h = HOUSE_H * HOUSE_SCALE;
  const sx = rand(-1, 1) * house.shake * 4;
  const x = Math.round(house.x - w / 2 + sx), y = Math.round(house.y - h / 2);
  ctx.fillStyle = 'rgba(0,0,0,.28)';
  ctx.fillRect(x + 6, y + h - 6, w - 6, 12);
  if (house.hp <= 0) {                       // destruída: escombros escuros
    ctx.globalAlpha = 0.45;
    ctx.drawImage(houseImg, x, y + h * 0.45, w, h * 0.55);
    ctx.globalAlpha = 1;
    return;
  }
  ctx.drawImage(house.flash > 0 ? whiteOf(houseImg) : houseImg, x, y, w, h);
  // rachaduras conforme perde vida
  const dmg = 1 - house.hp / houseMax();
  if (dmg > 0.33) {
    ctx.fillStyle = 'rgba(20,10,10,.7)';
    const cracks = [[0.22, 0.55], [0.7, 0.62], [0.45, 0.8], [0.85, 0.45], [0.12, 0.85]];
    const n = Math.floor(dmg * cracks.length);
    for (let i = 0; i < n; i++) {
      const [cx, cy] = cracks[i], X = x + cx * w, Y = y + cy * h, s = HOUSE_SCALE;
      ctx.fillRect(X, Y, s, s * 3); ctx.fillRect(X + s, Y + s * 2, s, s * 3); ctx.fillRect(X - s, Y + s * 4, s, s * 2);
    }
  }
}

function drawHouseBar() {

  ctx.fillStyle = '#3a1414'; ctx.fillRect(x + sx, y, bw, bh);
  ctx.fillStyle = k > 0.5 ? '#7bd04a' : k > 0.25 ? '#e9c46a' : '#e63946';
  ctx.fillRect(x + sx, y, Math.round(bw * k), bh);
  ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(x + sx, y, Math.round(bw * k), 4);  // brilho
  if (pop > 0.05) { ctx.fillStyle = `rgba(255,255,255,${pop * 0.6})`; ctx.fillRect(x + sx, y, bw, bh); }

  ctx.font = 'bold 12px monospace';

}

function drawMeleeIcon(x, y) {
  const s = 52, ready = player.meleeCd <= 0;
  const pop = player.meleeReadyPop, sc = 1 + pop * 0.25;
  ctx.save();
  ctx.translate(x + s / 2, y + s / 2);

  ctx.translate(-s / 2, -s / 2);

  }
  ctx.strokeStyle = ready ? '#f4f1de' : 'rgba(244,241,222,.35)'; ctx.lineWidth = 2;

  if (pop > 0.05) { ctx.fillStyle = `rgba(255,255,255,${pop * 0.7})`; ctx.fillRect(0, 0, s, s); }

function drawAmmo() {
  if (!ammoFullImg.complete || !ammoEmptyImg.complete) return;
  const w = 9 * AMMO_SCALE, h = 16 * AMMO_SCALE;
  const total = AMMO_MAX * w + (AMMO_MAX - 1) * AMMO_GAP;
  const x0 = canvas.width - AMMO_MARGIN - total;
  const y0 = canvas.height - AMMO_MARGIN - h;
  // gasta da direita para a esquerda
  for (let i = 0; i < AMMO_MAX; i++) {
    const full = i < player.ammo;
    const pop = ammoPop[i];
    const shakeX = emptyFlash > 0.05 ? rand(-1, 1) * emptyFlash * 3 : 0;
    const x = Math.round(x0 + i * (w + AMMO_GAP) + shakeX);
    const y = Math.round(y0 - pop * 10);               // gauge "pula" ao esvaziar
    ctx.drawImage(full ? ammoFullImg : ammoEmptyImg, x, y, w, h);
    if (pop > 0.05) {                                  // brilho branco no instante do tiro
      ctx.fillStyle = `rgba(255,255,255,${pop * 0.8})`;
      ctx.fillRect(x, y, w, h);
    }
  }
  if (emptyFlash > 0.05) {                             // sem munição: contorno vermelho
    ctx.strokeStyle = `rgba(230,57,70,${emptyFlash})`;
    ctx.lineWidth = 3;
    ctx.strokeRect(x0 - 6, y0 - 6, total + 12, h + 12);
  }
  // barra de progresso da recarga logo acima das gauges
  if (player.reloading) {
    const k = player.reloadT / reloadShell();
    ctx.fillStyle = '#000'; ctx.fillRect(x0, y0 - 14, total, 6);
    ctx.fillStyle = '#ffe08a'; ctx.fillRect(x0, y0 - 14, Math.round(total * k), 6);
  }
  drawMeleeIcon(canvas.width - AMMO_MARGIN - 52, y0 - 76);
  // contador "pente / reserva"
  const txt = `${player.ammo}/${player.reserve}`;
  const sc = 1 + reservePop * 0.35;
  ctx.save();
  ctx.translate(x0 - 14, y0 + h / 2 + 10);
  ctx.scale(sc, sc);
  ctx.font = 'bold 30px monospace';
  ctx.textAlign = 'right';
  ctx.fillStyle = '#000'; ctx.fillText(txt, 2, 2);
  ctx.fillStyle = player.reserve === 0 ? '#e63946' : reservePop > 0.1 ? '#ffe08a' : '#f4f1de';
  ctx.fillText(txt, 0, 0);
  ctx.restore();
  ctx.textAlign = 'left';
}

function render() {
  ctx.fillStyle = '#10170f';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  ctx.translate(-Math.round(cam.x + cam.sx), -Math.round(cam.y + cam.sy));
  if (map.ready) ctx.drawImage(map.canvas, 0, 0, WORLD_W, WORLD_H);

  // objetos ordenados por profundidade (y): quem está mais abaixo fica na frente
  const drawPlayerAndGun = () => {
    if (player.hp <= 0) return;
    const gunBehind = Math.sin(player.aim) < 0;   // mirando para cima: arma atrás do corpo
    if (gunBehind) drawGun();
    drawPlayer();
    if (!gunBehind) drawGun();
  };
  const objs = pickups.map(b => ({ y: b.y - 30, draw: () => drawPickup(b) }));
  // tufos ordenados pela base: o dino fica atrás quando está acima deles
  for (const t of tufts) objs.push({ y: t.y - 36, draw: () => drawTuft(t) });
  // árvores ordenadas pela base do tronco: quem passa atrás fica escondido pela copa
  for (const t of trees) objs.push({ y: t.baseY - 36, draw: () => drawTree(t) });
  if (mode !== 'menu') {
    objs.push({ y: player.y, draw: drawPlayerAndGun });
    for (const e of enemies) objs.push({ y: e.y, draw: () => drawEnemy(e) });
    // casa ordenada pela base das paredes (centro equivalente dos personagens)
    if (house.active || house.decor) objs.push({ y: houseRect().b - 36, draw: drawHouse });
  }
  objs.sort((a, b) => a.y - b.y);

  drawLeaves(true);                    // folhas já no chão
  drawParticles();
  for (const o of objs) o.draw();
  drawLeaves(false);                   // folhas caindo, por cima de tudo
  drawLighting();                      // sombra da mata + sol da clareira
  drawBullets();                       // tiros e clarão brilham por cima da sombra
  drawMuzzleFlash();
  drawFireflies();
  if (mode !== 'menu') drawReloadHint();
  ctx.restore();

  if (mode === 'menu') {
    drawMenu();
  } else {
    drawAmmo();
    if (mode === 'rogue') drawHouseBar(); else drawHearts();
    drawStats();
    drawRunHud();
    drawCards();
    drawGameOver();
    drawPause();
  }
  drawCrosshair();
}

// =====================================================================
// Loop
// =====================================================================
let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  update(dt);
  music.update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
