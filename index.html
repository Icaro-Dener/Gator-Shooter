function drawMenu() {
  const W = canvas.width, H = canvas.height;
  ctx.imageSmoothingEnabled = false;                        // pixel art sempre nítido
  ctx.fillStyle = 'rgba(8,12,8,.5)';
  ctx.fillRect(0, 0, W, H);
  // escala inteira: a cabeça ocupa ~40% da largura (limitada pela altura em telas estreitas)
  const S = Math.max(5, Math.round(Math.min(W / 38, H / 19)));
  const bob = Math.sin(clock * 1.6) * S * 0.25;
  drawTitleGator(S, Math.min(W * 0.42, PLAYER_SPR.w * S * 0.72), H * 0.23 + bob, -0.05);
  // logo embaixo à esquerda, por cima do jacaré
  if (titleImg.complete) {
    const L = Math.max(2, Math.floor(Math.min(W * 0.46, H * 0.62 * 2.7) / titleImg.width));
    const lw = titleImg.width * L, lh = titleImg.height * L;
    const lx = Math.round(W * 0.04), ly = Math.round(H - lh - H * 0.04 + Math.sin(clock * 2) * L * 0.5);
    ctx.filter = 'brightness(0)'; ctx.globalAlpha = 0.5;    // sombra
    ctx.drawImage(titleImg, lx + L * 2, ly + L * 3, lw, lh);
    ctx.filter = 'none'; ctx.globalAlpha = 1;
    ctx.drawImage(titleImg, lx, ly, lw, lh);
  }
  // botões no canto inferior direito, sobre uma placa escura
  const bs = menuButtons(), pad = 8;
  const lastB = bs[bs.length - 1], px = bs[0].x - pad, py = bs[0].y - pad, pw = bs[0].w + pad * 2, ph = lastB.y + lastB.h - bs[0].y + pad * 2;
  ctx.fillStyle = 'rgba(10,16,10,.82)'; ctx.fillRect(px, py, pw, ph);
  ctx.textAlign = 'center';
  drawButtons(bs, hoveredButton());
  ctx.textAlign = 'left';
}

// coração em pixel art (7x6)
const HEART = ['.##.##.', '#######', '#######', '.#####.', '..###..', '...#...'];
function drawHeart(x, y, s, full) {
  for (let r = 0; r < HEART.length; r++)
    for (let c = 0; c < 7; c++) if (HEART[r][c] === '#') {
      ctx.fillStyle = full ? (r === 1 && c === 1 ? '#ffb3b3' : '#e63946') : '#3a2a2a';
      ctx.fillRect(x + c * s, y + r * s, s, s);
    }
}

function drawHearts() {
  const s = 4, gap = 6, x0 = 16, y0 = 16;
  for (let i = 0; i < PLAYER_HP; i++) {
    const lost = i === player.hp;                // o coração que acabou de ser perdido pula
    const pop = lost ? heartPop : 0;
    const x = x0 + i * (7 * s + gap) + (pop ? rand(-1, 1) * pop * 4 : 0);
    const y = y0 - pop * 8;
    // contorno
    ctx.fillStyle = '#000';
    for (let r = 0; r < HEART.length; r++)
      for (let c = 0; c < 7; c++) if (HEART[r][c] === '#') ctx.fillRect(x + c * s - 2, y + r * s - 2, s + 4, s + 4);
    drawHeart(x, y, s, i < player.hp);
    if (pop > 0.05) { ctx.globalAlpha = pop; drawHeart(x, y, s, true); ctx.globalAlpha = 1; }
  }
}

function drawHouse() {
  if ((!house.active && !house.decor) || !houseImg.complete) return;
  if (run.banner && run.banner.intro && mode === 'rogue') {      // aviso inicial: contorno pulsando na base da casa
    const R = houseRect(), k = 0.5 + 0.5 * Math.sin(clock * 8);
    ctx.strokeStyle = `rgba(233,196,106,${0.5 + 0.4 * k})`; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.ellipse(house.x, R.b - 10, (R.r - R.l) * 0.62 + k * 12, 60 + k * 6, 0, 0, Math.PI * 2); ctx.stroke();
  }
  const w = HOUSE_W * HOUSE_SCALE, h = HOUSE_H * HOUSE_SCALE;
  const sx = rand(-1, 1) * house.shake * 4;
  const x = Math.round(house.x - w / 2 + sx), y = Math.round(house.y - h / 2);
  ctx.fillStyle = 'rgba(0,0,0,.28)';
  ctx.fillRect(x + 6, y + h - 6, w - 6, 12);
  if (house.hp <= 0) {                       // destruída: escombros escuros
    ctx.globalAlpha = 0.45;
    ctx.drawImage(houseImg, x, y + h * 0.45, w, h * 0.55);
    ctx.globalAlpha = 1;
    return;
  }
  ctx.drawImage(house.flash > 0 ? whiteOf(houseImg) : houseImg, x, y, w, h);
  if (nightK > 0 && house.flash <= 0 && houseNightImg.complete) {      // à noite: janelas acesas
    ctx.globalAlpha = nightK; ctx.drawImage(houseNightImg, x, y, w, h); ctx.globalAlpha = 1;
  }
  // rachaduras conforme perde vida
  const dmg = 1 - house.hp / houseMax();
  if (dmg > 0.33) {
    ctx.fillStyle = 'rgba(20,10,10,.7)';
    const cracks = [[0.22, 0.55], [0.7, 0.62], [0.45, 0.8], [0.85, 0.45], [0.12, 0.85]];
    const n = Math.floor(dmg * cracks.length);
    for (let i = 0; i < n; i++) {
      const [cx, cy] = cracks[i], X = x + cx * w, Y = y + cy * h, s = HOUSE_SCALE;
      ctx.fillRect(X, Y, s, s * 3); ctx.fillRect(X + s, Y + s * 2, s, s * 3); ctx.fillRect(X - s, Y + s * 4, s, s * 2);
    }
  }
  for (const f of house.fires || []) {        // dia quente: focos de fogo onde morderam
    const fi = fireImgs[Math.floor((clock + f.x * 0.01) * 10) % 2]; if (!fi.complete) continue;
    const fw = 16 * 4; ctx.globalAlpha = Math.min(1, f.t * 2);
    ctx.drawImage(fi, Math.round(f.x - fw / 2), Math.round(f.y - fw + 8), fw, fw); ctx.globalAlpha = 1;
  }
}

// seta na borda da tela apontando para a casa quando ela não está visível (pisca ao ser atacada)
function drawHouseMarker() {
  if (!house.active || house.hp <= 0 || gameOver) return;
  const sx = (house.x - cam.x - cam.sx) * ZOOM, sy = (house.y - cam.y - cam.sy) * ZOOM;
  const W = canvas.width, H = canvas.height, hw = HOUSE_W * HOUSE_SCALE * ZOOM / 2, hh = HOUSE_H * HOUSE_SCALE * ZOOM / 2;
  if (sx + hw > 0 && sx - hw < W && sy + hh > 0 && sy - hh < H) return;
  const cx = W / 2, cy = H / 2, a = Math.atan2(sy - cy, sx - cx);
  const k = Math.min((W / 2 - 60) / Math.abs(Math.cos(a) || 1e-6), (H / 2 - 100) / Math.abs(Math.sin(a) || 1e-6));   // longe do HUD
  const x = cx + Math.cos(a) * k, y = cy + Math.sin(a) * k;
  const hit = house.flash > 0 || house.shake > 0.05;
  const pulse = 1 + Math.sin(clock * 6) * 0.06 + (hit ? 0.15 : 0);
  ctx.save();
  ctx.translate(Math.round(x), Math.round(y));
  ctx.globalAlpha = 0.9;
  ctx.fillStyle = 'rgba(10,16,10,.75)';
  ctx.beginPath(); ctx.arc(0, 0, 26 * pulse, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = hit ? '#e63946' : '#e9c46a'; ctx.lineWidth = 3; ctx.stroke();
  if (houseImg.complete) ctx.drawImage(houseImg, -16, -12, 32, 22);
  ctx.rotate(a);                                   // seta para fora do círculo
  ctx.fillStyle = hit ? '#e63946' : '#e9c46a';
  ctx.beginPath(); ctx.moveTo(38 * pulse, 0); ctx.lineTo(28 * pulse, -8); ctx.lineTo(28 * pulse, 8); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawHouseBar() {
  const bw = Math.max(80, Math.min(240, canvas.width - 420)), bh = 14;
  const x = 66, y = canvas.height - 34;                                    // canto inferior esquerdo
  const k = house.hp / houseMax(), pop = house.pop;
  if (houseImg.complete) ctx.drawImage(houseImg, 16, y - 12, 40, 28);       // ícone
  const sx = rand(-1, 1) * pop * 3;
  ctx.fillStyle = '#000'; ctx.fillRect(x - 3 + sx, y - 3, bw + 6, bh + 6);
  ctx.fillStyle = '#3a1414'; ctx.fillRect(x + sx, y, bw, bh);
  ctx.fillStyle = k > 0.5 ? '#7bd04a' : k > 0.25 ? '#e9c46a' : '#e63946';
  ctx.fillRect(x + sx, y, Math.round(bw * k), bh);
  ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(x + sx, y, Math.round(bw * k), 4);  // brilho
  if (pop > 0.05) { ctx.fillStyle = `rgba(255,255,255,${pop * 0.6})`; ctx.fillRect(x + sx, y, bw, bh); }
  if (house.heal > 0.02) { ctx.strokeStyle = `rgba(123,208,74,${house.heal})`; ctx.lineWidth = 3; ctx.strokeRect(x - 5, y - 5, bw + 10, bh + 10); }
  ctx.font = 'bold 12px monospace';
  ctx.fillStyle = '#000'; ctx.fillText(`CASA ${Math.ceil(house.hp)}/${Math.round(houseMax())}`, x + 5 + sx, y - 7);
  ctx.fillStyle = '#f4f1de'; ctx.fillText(`CASA ${Math.ceil(house.hp)}/${Math.round(houseMax())}`, x + 4 + sx, y - 8);
}

function drawReloadHint() {
  if (gameOver || player.reloading || player.ammo > 0) return;
  const msg = player.reserve > 0 ? 'R  recarregar' : 'SEM MUNIÇÃO';
  const a = 0.6 + Math.sin(clock * 8) * 0.4;
  ctx.globalAlpha = a;
  ctx.font = 'bold 14px monospace';
  ctx.textAlign = 'center';
  const y = player.y - player.h / 2 - 14;
  ctx.fillStyle = '#000'; ctx.fillText(msg, player.x + 1, y + 1);
  ctx.fillStyle = player.reserve > 0 ? '#f4f1de' : '#e63946'; ctx.fillText(msg, player.x, y);
  ctx.textAlign = 'left';
  ctx.globalAlpha = 1;
}

function drawGameOver() {
  if (!gameOver) return;
  ctx.fillStyle = 'rgba(10,0,0,.6)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#e63946';
  ctx.font = 'bold 48px monospace';
  ctx.fillText(house.active && house.hp <= 0 ? 'A CASA CAIU' : 'VOCÊ MORREU', canvas.width / 2, canvas.height / 2);
  ctx.fillStyle = '#f4f1de';
  ctx.font = '18px monospace';
  let y = canvas.height / 2 + 36;
  if (mode === 'rogue') {
    ctx.fillText(`chegou à wave ${run.wave}  ·  ${run.kills} abates  ·  ${fmtTime(run.time)}`, canvas.width / 2, y);
    y += 28;
  }
  ctx.fillText('R recomeçar  ·  ESC menu', canvas.width / 2, y);
  ctx.textAlign = 'left';
}

function drawMeleeIcon(x, y) {
  const s = 52, ready = player.meleeCd <= 0;
  const pop = player.meleeReadyPop, sc = 1 + pop * 0.25;
  ctx.save();
  ctx.translate(x + s / 2, y + s / 2);
  ctx.scale(sc, sc);
  ctx.translate(-s / 2, -s / 2);
  ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, 0, s, s);
  if (knifeIconImg.complete) ctx.drawImage(knifeIconImg, Math.round((s - knifeIconImg.width * 3) / 2), Math.round((s - knifeIconImg.height * 3) / 2), knifeIconImg.width * 3, knifeIconImg.height * 3);
  if (!ready) {   // escurece de cima para baixo conforme o tempo que falta
    const k = player.meleeCd / meleeCooldown();
    ctx.fillStyle = 'rgba(0,0,0,.65)'; ctx.fillRect(0, 0, s, Math.round(s * k));
    ctx.font = 'bold 16px monospace'; ctx.textAlign = 'center';
    ctx.fillStyle = '#000'; ctx.fillText(Math.ceil(player.meleeCd), s / 2 + 1, s / 2 + 7);
    ctx.fillStyle = '#f4f1de'; ctx.fillText(Math.ceil(player.meleeCd), s / 2, s / 2 + 6);
    ctx.textAlign = 'left';
  }
  ctx.strokeStyle = ready ? '#f4f1de' : 'rgba(244,241,222,.35)'; ctx.lineWidth = 2;
  ctx.strokeRect(1, 1, s - 2, s - 2);
  if (pop > 0.05) { ctx.fillStyle = `rgba(255,255,255,${pop * 0.7})`; ctx.fillRect(0, 0, s, s); }
  hudKeyLabel('BOTÃO DIR.', s / 2, -6);
  ctx.restore();
  drawRunIcon(x, y - 76);
}
// legenda pequena em cima dos ícones do HUD
function hudKeyLabel(t, cx, y) {
  ctx.font = 'bold 10px monospace'; ctx.textAlign = 'center';
  const w = ctx.measureText(t).width + 8;
  ctx.fillStyle = 'rgba(0,0,0,.7)'; ctx.fillRect(cx - w / 2, y - 10, w, 13);
  ctx.fillStyle = '#e9c46a'; ctx.fillText(t, cx, y);
  ctx.textAlign = 'left';
}
// ícone da corrida (acende enquanto corre)
function drawRunIcon(x, y) {
  const s = 52, on = player.running;
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = on ? 'rgba(233,196,106,.35)' : 'rgba(0,0,0,.55)'; ctx.fillRect(0, 0, s, s);
  const L = legImgs[on ? Math.floor(clock * 10) % 2 : 1];
  if (L.complete) ctx.drawImage(L, Math.round((s - L.width * 3) / 2), Math.round((s - L.height * 3) / 2) + 6, L.width * 3, L.height * 3);
  ctx.fillStyle = on ? '#fff' : 'rgba(244,241,222,.6)';                 // risquinhos de velocidade
  for (let i = 0; i < 3; i++) ctx.fillRect(8 + (on ? (clock * 60 + i * 9) % 10 : 0), 12 + i * 7, 10 - i * 2, 2);
  ctx.strokeStyle = on ? '#e9c46a' : '#f4f1de'; ctx.lineWidth = 2; ctx.strokeRect(1, 1, s - 2, s - 2);
  hudKeyLabel('SHIFT', s / 2, -6);
  ctx.restore();
}
// dicas no começo da partida (somem depois de usar ou depois de um tempo)
const tips = { t: 0, usedRun: false, usedMelee: false };
function drawStartTips() {
  if (!settings.tips || mode === 'menu' || gameOver || paused || shop.open || cut.on || (run.phase === 'cards' && cards.list.length)) return;
  const all = tips.usedRun && tips.usedMelee;
  const a = Math.min(1, tips.t / 0.6) * Math.max(0, Math.min(1, ((all ? 0 : 12) - tips.t) / 1.2 + (all ? 0 : 0)));
  if (a <= 0.01) return;
  const items = [];
  if (!tips.usedRun) items.push(['SHIFT', 'correr']);
  if (!tips.usedMelee) items.push(['BOTÃO DIREITO', 'faca']);
  if (!items.length) return;
  ctx.save(); ctx.globalAlpha = a;
  ctx.font = 'bold 18px monospace';
  const parts = items.map(([k, v]) => ({ k, v, w: ctx.measureText(k).width + 26 + ctx.measureText(v).width }));
  const gap = 36, total = parts.reduce((t, q) => t + q.w, 0) + gap * (parts.length - 1);
  let x = canvas.width / 2 - total / 2; const y = canvas.height - 150 + Math.sin(clock * 3) * 3;
  ctx.fillStyle = 'rgba(8,12,8,.75)'; ctx.fillRect(x - 18, y - 30, total + 36, 44);
  ctx.strokeStyle = 'rgba(233,196,106,.6)'; ctx.lineWidth = 2; ctx.strokeRect(x - 18, y - 30, total + 36, 44);
  for (const q of parts) {
    const kw = ctx.measureText(q.k).width + 14;
    ctx.fillStyle = '#e9c46a'; ctx.fillRect(x, y - 22, kw, 28);
    ctx.fillStyle = '#10170f'; ctx.fillText(q.k, x + 7, y - 2);
    ctx.fillStyle = '#f4f1de'; ctx.fillText(q.v, x + kw + 12, y - 2);
    x += q.w + gap;
  }
  ctx.restore();
}

function drawAmmo() {
  if (player.weapon !== 'shotgun') return drawAltAmmo();
  if (!ammoFullImg.complete || !ammoEmptyImg.complete) return;
  const N = ammoMax(), AS = N > 8 ? AMMO_SCALE * 0.75 : AMMO_SCALE;   // com mais cartuchos as gauges encolhem
  const w = 9 * AS, h = 16 * AS;
  const total = N * w + (N - 1) * AMMO_GAP;
  const x0 = canvas.width - AMMO_MARGIN - total;
  const y0 = canvas.height - AMMO_MARGIN - h;
  // gasta da direita para a esquerda
  for (let i = 0; i < N; i++) {
    const full = i < player.ammo;
    const pop = ammoPop[i];
    const shakeX = emptyFlash > 0.05 ? rand(-1, 1) * emptyFlash * 3 : 0;
    const x = Math.round(x0 + i * (w + AMMO_GAP) + shakeX);
    const y = Math.round(y0 - pop * 10);               // gauge "pula" ao esvaziar
    ctx.drawImage(full ? ammoFullImg : ammoEmptyImg, x, y, w, h);
    if (pop > 0.05) {                                  // brilho branco no instante do tiro
      ctx.fillStyle = `rgba(255,255,255,${pop * 0.8})`;
      ctx.fillRect(x, y, w, h);
    }
  }
  if (emptyFlash > 0.05) {                             // sem munição: contorno vermelho
    ctx.strokeStyle = `rgba(230,57,70,${emptyFlash})`;
    ctx.lineWidth = 3;
    ctx.strokeRect(x0 - 6, y0 - 6, total + 12, h + 12);
  }
  // barra de progresso da recarga logo acima das gauges
  if (player.reloading) {
    const k = player.reloadT / reloadShell();
    ctx.fillStyle = '#000'; ctx.fillRect(x0, y0 - 14, total, 6);
    ctx.fillStyle = '#ffe08a'; ctx.fillRect(x0, y0 - 14, Math.round(total * k), 6);
  }
  drawMeleeIcon(canvas.width - AMMO_MARGIN - 52, canvas.height - AMMO_MARGIN - 16 * AMMO_SCALE - 76);
  // contador "pente / reserva"
  const txt = `${player.ammo}/${player.reserve}`;
  const sc = 1 + reservePop * 0.35;
  ctx.save();
  ctx.translate(x0 - 14, y0 + h / 2 + 10);
  ctx.scale(sc, sc);
  ctx.font = 'bold 30px monospace';
  ctx.textAlign = 'right';
  ctx.fillStyle = '#000'; ctx.fillText(txt, 2, 2);
  ctx.fillStyle = player.reserve === 0 ? '#e63946' : reservePop > 0.1 ? '#ffe08a' : '#f4f1de';
  ctx.fillText(txt, 0, 0);
  ctx.restore();
  ctx.textAlign = 'left';
}

let renderN = 0;
// olhos dos jacarés: ponto vermelho com brilho, em coordenadas de tela, por cima da escuridão
function drawEnemyEyes() {
  if (nightK <= 0.01) return;
  ctx.save();
  for (const e of enemies) {
    const q = e.eye;
    if (!e.alive || !q || !q.on || q.n !== renderN) continue;
    const px = e.T.sc * ZOOM, k = nightK * (0.85 + Math.sin(clock * 5 + e.x * 0.1) * 0.15);
    ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(q.x, q.y, 0, q.x, q.y, px * 3.2);
    g.addColorStop(0, `rgba(255,40,30,${0.6 * k})`); g.addColorStop(1, 'rgba(255,40,30,0)');
    ctx.fillStyle = g; ctx.fillRect(q.x - px * 3.2, q.y - px * 3.2, px * 6.4, px * 6.4);
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = `rgba(255,70,55,${k})`;
    ctx.fillRect(Math.round(q.x - px / 2), Math.round(q.y - px / 2), Math.round(px), Math.round(px));
  }
  ctx.restore();
}

function render() {
  renderN++;
  ctx.fillStyle = '#10170f';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  ctx.setTransform(ZOOM, 0, 0, ZOOM, -Math.round((cam.x + cam.sx) * ZOOM), -Math.round((cam.y + cam.sy) * ZOOM));
  const vw = viewW(), vh = viewH();
  if (map.ready) {                       // só o pedaço do mapa que aparece
    const mx = Math.max(0, Math.floor(cam.x / SCALE) - 2), my = Math.max(0, Math.floor(cam.y / SCALE) - 2);
    const mw = Math.min(map.canvas.width - mx, Math.ceil(vw / SCALE) + 5), mh = Math.min(map.canvas.height - my, Math.ceil(vh / SCALE) + 5);
    if (mw > 0 && mh > 0) ctx.drawImage(map.canvas, mx, my, mw, mh, mx * SCALE, my * SCALE, mw * SCALE, mh * SCALE);
  }
  // fora da tela não desenha (margem para copas, sombras e sprites grandes)
  const inView = (x, y, mx, top, bot) => x > cam.x - mx && x < cam.x + vw + mx && y > cam.y - top && y < cam.y + vh + bot;

  // objetos ordenados por profundidade (y): quem está mais abaixo fica na frente
  const drawPlayerAndGun = () => {
    if (player.hp <= 0) return;
    drawPlayer();
    drawGun();                                    // a escopeta fica sempre na frente do jacaré
  };
  const objs = pickups.map(b => ({ y: b.y - 30, draw: () => drawPickup(b) }));
  // tufos ordenados pela base: o dino fica atrás quando está acima deles
  for (const t of tufts) if (inView(t.x, t.y, 40, 10, 70)) objs.push({ y: t.y - 36, draw: () => drawTuft(t) });
  // árvores ordenadas pela base do tronco: quem passa atrás fica escondido pela copa
  for (const t of trees) if (inView(t.x, t.baseY, 110, 30, 170)) objs.push({ y: t.baseY - 36, draw: () => drawTree(t) });
  if (mode !== 'menu') {
    objs.push({ y: player.y, draw: drawPlayerAndGun });
    for (const e of enemies) if (inView(e.x, e.y, 120, 120, 140)) objs.push({ y: e.y, draw: () => drawEnemy(e) });
    // casa ordenada pela base das paredes (centro equivalente dos personagens)
    if (house.active || house.decor) objs.push({ y: houseRect().b - 36, draw: drawHouse });
    for (const t of teeth) objs.push({ y: t.y - 30, draw: () => drawTooth(t) });
    for (const h of hats) objs.push({ y: h.y - 20, draw: () => drawHat(h) });
    if (shop.rod > 0 && (house.active || house.decor) && house.hp > 0) objs.push({ y: houseRect().b - 35, draw: drawRod });   // logo depois da casa: em cima do telhado
    for (const m of mines) objs.push({ y: m.y - 50, draw: () => drawMine(m) });
    for (const f of fences) objs.push({ y: f.base - 18, draw: () => drawFence(f) });
    for (const t of throwables) objs.push({ y: throwPos(t).y, draw: () => drawThrowable(t) });
    if (ally.active) objs.push({ y: ally.y, draw: drawAlly });
    if (bill.active) objs.push({ y: bill.y - 36, draw: drawBill });
    for (const b of bullets) objs.push({ y: b.y + BULLET_DEPTH, draw: () => drawBullet(b) });
    for (const b of enemyBullets) objs.push({ y: b.y + BULLET_DEPTH, draw: () => drawEnemyBullet(b) });
  }
  objs.sort((a, b) => a.y - b.y);

  drawLeaves(true);                    // folhas já no chão
  drawParticles();
  drawHealBeams(1 / 60);
  for (const o of objs) o.draw();
  drawLeaves(false);                   // folhas caindo, por cima de tudo
  drawLighting();                      // sombra da mata + sol da clareira
  drawHiddenBehindHouse();             // silhueta de quem está atrás da casa
  drawHealerGlows();                   // chama verde do healer brilhando
  drawBolt();
  drawBuildGhost();                     // modo cerca: quadrado verde/vermelho                          // relâmpago
  for (const p of particles) if (p.color === 'dmg') drawDamageNumber(p, 1 - p.age / p.life); else if (p.color === 'hdmg') drawHouseDamageNumber(p, 1 - p.age / p.life);   // números de dano por cima de tudo (fora da escuridão)
  drawMuzzleFlash();
  drawFireflies();
  if (mode !== 'menu') drawReloadHint();
  ctx.restore();
  drawEnemyEyes();

  if (mode === 'menu') {
    if (story.open) drawStory(); else { drawMenu(); if (setUI.open) drawSettings(); }
  } else {
    drawEventFx();                       // eventos de wave (calor, lua, neblina)
    drawRain();                          // chuva por baixo do HUD
    drawLeaves();
    drawHouseMarker();
    drawAmmo();
    drawWeaponHud();
    drawConsumablesHud();
    drawStartTips();
    if (house.active) drawHouseBar(); else if (mode !== 'test') drawHearts();
    drawStats();
    drawTeethHud();
    drawRunHud();
    drawBillOverlay();
    drawIntro();
    drawCards();
    drawShop();
    drawGameOver();
    drawPause();
  }
  drawCrosshair();
  drawFps();
}

// =====================================================================
// Loop
// =====================================================================
let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  update(dt);
  music.update(dt);
  sfx.setRain(rainVolume());
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
