<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gator Shooter</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
  html, body { margin: 0; height: 100%; background: #10170f; overflow: hidden; }
  canvas { display: block; image-rendering: pixelated; cursor: none; }
  #dev {
    position: fixed; top: 12px; right: 12px; width: 270px; max-height: calc(100% - 24px); overflow-y: auto;
    background: rgba(12,18,12,.92); border: 2px solid #e9c46a; color: #f4f1de; font: 12px monospace;
    padding: 10px 12px; cursor: default; display: none; z-index: 10; box-shadow: 4px 5px 0 rgba(0,0,0,.5);
  }
  #dev h3 { margin: 0 0 6px; font-size: 14px; color: #e9c46a; display: flex; justify-content: space-between; }
  #dev h4 { margin: 10px 0 4px; font-size: 11px; color: #a9b8a0; letter-spacing: 1px; }
  #dev .row { display: flex; align-items: center; justify-content: space-between; margin: 2px 0; }
  #dev .row span.v { color: #e9c46a; min-width: 22px; text-align: center; }
  #dev button { font: bold 12px monospace; background: #1c281d; color: #f4f1de; border: 1px solid #f4f1de;
    padding: 3px 7px; cursor: pointer; }
  #dev button:hover { background: #f4f1de; color: #10170f; }
  #dev .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  #dev label { display: flex; align-items: center; gap: 6px; margin: 3px 0; cursor: pointer; }
</style>
</head>

<canvas id="game"></canvas>

function waveConfig(n) {
  return {
    count: 6 + (n - 1) * 5,                                   // 6, 11, 16, 21... (+5 por wave)
    interval: Math.max(0.35, 1.4 * Math.pow(0.9, n - 1)),     // chegam cada vez mais seguidos
    group: 1 + Math.floor((n - 1) / 2),                       // wave 3: duplas, 5: trios, 7: grupos de 4...

    rushers: n >= 15 ? Math.min(12, 4 + 2 * (n - 15)) : 0,           // wave 15: 4, 16: 6... (teto 12)
    healers: n >= 20 ? Math.min(4, 1 + Math.floor((n - 20) / 2)) : 0, // wave 20-21: 1, 22-23: 2... (teto 4)
  };
}

const enemyFrames = {};
function enemyFrame(T, name, blink = false) {
  const af = T.arms ? Math.floor(clock * 10) % 2 : 0;          // braços animados (chama da vela)
  const key = T.id + name + (blink ? 'b' : '') + af;
  if (enemyFrames[key]) return enemyFrames[key];
  const body = blink && T.blink ? T.blink : T.body;
  if (!body.complete || !T.legs[0].complete || !T.legs[1].complete) return null;
  const top = T.top || 0, by = top + (name === 'pass' ? 0 : 1);
  const c = document.createElement('canvas'); c.width = T.w; c.height = T.h + 1;
  const g = c.getContext('2d');
  if (T.arms) g.drawImage(T.arms.back[af], T.arms.x, by + T.arms.y);
  g.drawImage(body, 0, by);
  g.drawImage(name === 'pass' ? T.legs[0] : T.legs[1], T.legOffset.x, top + T.legOffset.y + 1);   // pernas na frente do rabo
  if (T.arms) g.drawImage(T.arms.front[af], T.arms.x, by + T.arms.y);
  return (enemyFrames[key] = c);
}

let ctx = canvas.getContext('2d');    // let: trocado temporariamente para desenhar em camadas (silhuetas atrás da casa)

// mundo fixo, maior que a tela; a câmera acompanha o jogador com zoom
const WORLD = { w: 2240, h: 1408 };    // tamanho do mundo (px de mundo)
const VIEW = { h: 760, w: 1250 };      // área mínima visível (px de mundo): define o zoom
let ZOOM = 1;
function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  // zoom em passos de 0.25: com SCALE 4 cada pixel do sprite vira um número inteiro de pixels na tela
  ZOOM = Math.max(1, Math.floor(Math.min(canvas.height / VIEW.h, canvas.width / VIEW.w) * 4) / 4);
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize);
resize();

const rand = (a, b) => a + Math.random() * (b - a);

// =====================================================================
// SFX sintetizados (Web Audio, sem arquivos) — M liga/desliga
// =====================================================================
const sfx = (() => {
  let ac = null, master = null, noiseBuf = null, muted = false, vol = 1;   // vol: ajuste do jogador (Configurações)
  const last = {};
  function init() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = 0.45 * vol;
    const comp = ac.createDynamicsCompressor();       // evita estourar com muitos sons juntos
    master.connect(comp); comp.connect(ac.destination);
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  // o navegador só libera áudio depois de uma interação
  ['mousedown', 'keydown'].forEach(ev => window.addEventListener(ev, init));
  window.addEventListener('keydown', e => { if (e.key.toLowerCase() === 'm') muted = !muted; });

  const ok = (name, gap = 0) => {           // limita repetições muito próximas
    if (!ac || muted) return false;
    const t = ac.currentTime;
    if (last[name] !== undefined && t - last[name] < gap) return false;
    last[name] = t; return true;
  };
  function env(g, t, a, peak, dur) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  }
  // ruído filtrado
  function noise({ dur, peak = 0.5, type = 'lowpass', f0 = 2000, f1 = f0, q = 0.8, attack = 0.002, delay = 0 }) {
    const t = ac.currentTime + delay;
    const src = ac.createBufferSource(); src.buffer = noiseBuf;
    src.playbackRate.value = rand(0.9, 1.1);
    const flt = ac.createBiquadFilter(); flt.type = type; flt.Q.value = q;
    flt.frequency.setValueAtTime(f0, t); flt.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
    const g = ac.createGain(); env(g, t, attack, peak, dur);
    src.connect(flt); flt.connect(g); g.connect(master);
    src.start(t, rand(0, 0.5)); src.stop(t + dur + 0.05);
  }
  // tom com glide de frequência
  function tone({ dur, peak = 0.3, wave = 'square', f0 = 440, f1 = f0, attack = 0.003, delay = 0 }) {
    const t = ac.currentTime + delay;
    const o = ac.createOscillator(); o.type = wave;
    o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    const g = ac.createGain(); env(g, t, attack, peak, dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.05);
  }

  return {
    shot() {          // estouro de ruído + "thump" grave + cauda
      if (!ok('shot')) return;
      noise({ dur: 0.09, peak: 0.9, type: 'highpass', f0: 1200, f1: 400 });
      noise({ dur: 0.35, peak: 0.7, type: 'lowpass', f0: 3000, f1: 150 });
      tone({ dur: 0.18, peak: 0.6, wave: 'sine', f0: 140, f1: 40 });
      tone({ dur: 0.06, peak: 0.15, wave: 'square', f0: 900, f1: 300, delay: 0.16 }); // "chk" da bomba
      noise({ dur: 0.05, peak: 0.25, type: 'bandpass', f0: 2500, q: 3, delay: 0.17 });
    },
    dry() {           // clique seco sem munição
      if (!ok('dry', 0.05)) return;
      noise({ dur: 0.03, peak: 0.35, type: 'bandpass', f0: 3500, q: 4 });
      tone({ dur: 0.03, peak: 0.12, wave: 'square', f0: 1800, f1: 1200 });
    },
    shell() {         // cápsula quicando
      if (!ok('shell', 0.04)) return;
      tone({ dur: 0.05, peak: 0.06, wave: 'triangle', f0: rand(2600, 3400), f1: 2000 });
    },
    reload() {        // "clack-clack" + arpejo curto
      if (!ok('reload', 0.2)) return;
      noise({ dur: 0.04, peak: 0.4, type: 'bandpass', f0: 1800, q: 3 });
      noise({ dur: 0.05, peak: 0.45, type: 'bandpass', f0: 1200, q: 3, delay: 0.09 });
      [523, 659, 784, 1047].forEach((f, i) => tone({ dur: 0.09, peak: 0.12, wave: 'square', f0: f, delay: 0.14 + i * 0.05 }));
    },
    reloadStart() {   // abre a recarga
      if (!ok('reloadStart', 0.1)) return;
      noise({ dur: 0.04, peak: 0.25, type: 'bandpass', f0: 1400, q: 3 });
    },
    shellIn() {       // cartucho entrando no tubo
      if (!ok('shellIn', 0.05)) return;
      noise({ dur: 0.035, peak: 0.4, type: 'bandpass', f0: 2200, q: 4 });
      tone({ dur: 0.05, peak: 0.12, wave: 'square', f0: 700, f1: 420, delay: 0.02 });
      noise({ dur: 0.05, peak: 0.25, type: 'lowpass', f0: 900, f1: 300, delay: 0.04 });
    },
    swing() {         // faca cortando o ar
      if (!ok('swing', 0.1)) return;
      noise({ dur: 0.16, peak: 0.45, type: 'bandpass', f0: 900, f1: 3500, q: 1.5, attack: 0.03 });
    },
    slash() {         // faca acertando
      if (!ok('slash', 0.05)) return;
      noise({ dur: 0.1, peak: 0.55, type: 'highpass', f0: 2500, f1: 900 });
      tone({ dur: 0.09, peak: 0.3, wave: 'square', f0: 240, f1: 90 });
    },
    meleeReady() {    // faca disponível de novo
      if (!ok('meleeReady', 0.5)) return;
      tone({ dur: 0.08, peak: 0.08, wave: 'triangle', f0: 1568 });
      tone({ dur: 0.12, peak: 0.08, wave: 'triangle', f0: 2093, delay: 0.06 });
    },
    waveStart() {     // começo de wave: impacto grave + tambores
      if (!ok('waveStart', 1)) return;
      noise({ dur: 0.6, peak: 0.8, type: 'lowpass', f0: 1800, f1: 60 });
      tone({ dur: 0.7, peak: 0.6, wave: 'sine', f0: 90, f1: 35 });
      tone({ dur: 0.35, peak: 0.3, wave: 'sawtooth', f0: 220, f1: 110 });
      for (let i = 0; i < 3; i++) {
        tone({ dur: 0.18, peak: 0.35, wave: 'sine', f0: 120, f1: 50, delay: 0.35 + i * 0.16 });
        noise({ dur: 0.12, peak: 0.3, type: 'lowpass', f0: 500, f1: 80, delay: 0.35 + i * 0.16 });
      }
    },
    waveClear() {     // fim de wave: fanfarra curta
      if (!ok('waveClear', 1)) return;
      [523, 659, 784, 1047, 784, 1047].forEach((f, i) =>
        tone({ dur: i < 5 ? 0.1 : 0.3, peak: 0.14, wave: 'square', f0: f, delay: i * 0.09 }));
    },
    heal() {          // curativo
      if (!ok('heal', 0.2)) return;
      [392, 523, 659, 784].forEach((f, i) => tone({ dur: 0.14, peak: 0.12, wave: 'triangle', f0: f, f1: f * 1.02, delay: i * 0.06 }));
    },
    rustle() {        // folhagem balançando
      if (!ok('rustle', 0.15)) return;
      noise({ dur: 0.25, peak: 0.08, type: 'bandpass', f0: rand(2500, 4000), q: 1, attack: 0.04 });
    },
    threat() {        // nova ameaça: rugido grave + alarme
      if (!ok('threat', 1)) return;
      tone({ dur: 1.2, peak: 0.5, wave: 'sawtooth', f0: 70, f1: 40, delay: 0.35 });
      noise({ dur: 1.0, peak: 0.5, type: 'lowpass', f0: 600, f1: 90, delay: 0.35, attack: 0.08 });
      for (let i = 0; i < 3; i++) tone({ dur: 0.22, peak: 0.18, wave: 'square', f0: 880, f1: 660, delay: 0.45 + i * 0.3 });
    },
    revolver() {      // tiro do Range
      if (!ok('revolver', 0.05)) return;
      noise({ dur: 0.08, peak: 0.45, type: 'highpass', f0: 2200, f1: 800 });
      tone({ dur: 0.1, peak: 0.2, wave: 'square', f0: 520, f1: 160 });
    },
    houseHit() {      // bala acertando a casa
      if (!ok('houseHit', 0.05)) return;
      noise({ dur: 0.08, peak: 0.35, type: 'bandpass', f0: rand(900, 1300), q: 2 });
    },
    crit() {          // crítico
      if (!ok('crit', 0.05)) return;
      tone({ dur: 0.08, peak: 0.16, wave: 'square', f0: 1400, f1: 2200 });
    },
    upgrade() {       // escolheu uma carta
      if (!ok('upgrade', 0.3)) return;
      [659, 880, 1175, 1568].forEach((f, i) => tone({ dur: 0.12, peak: 0.13, wave: 'square', f0: f, delay: i * 0.05 }));
    },
    tooth() {         // pegou um dente: plim agudo
      if (!ok('tooth', 0.03)) return;
      const f = rand(1500, 1800);
      tone({ dur: 0.07, peak: 0.16, wave: 'square', f0: f, f1: f * 1.3 });
      tone({ dur: 0.1, peak: 0.12, wave: 'triangle', f0: f * 1.5, delay: 0.05 });
    },
    talk() {          // voz do velho Bill (bipes graves, tipo resmungo)
      if (!ok('talk', 0.05)) return;
      const f = rand(95, 150);
      tone({ dur: 0.07, peak: 0.13, wave: 'square', f0: f, f1: f * rand(0.8, 1.2) });
    },
    buy() {           // compra: caixa registradora
      if (!ok('buy', 0.05)) return;
      [880, 1175, 1568].forEach((f, i) => tone({ dur: 0.09, peak: 0.18, wave: 'square', f0: f, delay: i * 0.06 }));
      noise({ dur: 0.12, peak: 0.25, type: 'highpass', f0: 4000, delay: 0.18 });
    },
    deny() {          // sem dentes
      if (!ok('deny', 0.1)) return;
      tone({ dur: 0.18, peak: 0.2, wave: 'square', f0: 160, f1: 90 });
    },
    boom() {          // explosão (dinamite, mina)
      if (!ok('boom', 0.05)) return;
      noise({ dur: 0.9, peak: 0.9, type: 'lowpass', f0: 1400, f1: 50 });
      tone({ dur: 0.55, peak: 0.6, wave: 'sine', f0: 95, f1: 32 });
    },
    freeze() {        // cubo de gelo
      if (!ok('freeze', 0.1)) return;
      noise({ dur: 0.5, peak: 0.3, type: 'highpass', f0: 3000, f1: 7000 });
      [1568, 2093, 2637].forEach((f, i) => tone({ dur: 0.18, peak: 0.1, wave: 'triangle', f0: f, delay: i * 0.05 }));
    },
    uzi() {
      if (!ok('uzi', 0.03)) return;
      noise({ dur: 0.06, peak: 0.32, type: 'bandpass', f0: 1800, q: 1 });
      tone({ dur: 0.05, peak: 0.1, wave: 'square', f0: 180, f1: 90 });
    },
    revolver() {
      if (!ok('revolver', 0.04)) return;
      noise({ dur: 0.14, peak: 0.5, type: 'lowpass', f0: 3200, f1: 300 });
      tone({ dur: 0.1, peak: 0.18, wave: 'square', f0: 230, f1: 80 });
    },
    swap() {          // troca de arma
      if (!ok('swap', 0.05)) return;
      noise({ dur: 0.05, peak: 0.3, type: 'bandpass', f0: 2500, q: 3 });
      tone({ dur: 0.05, peak: 0.1, wave: 'square', f0: 600, delay: 0.05 });
    },
    toss() {          // arremesso
      if (!ok('toss', 0.05)) return;
      noise({ dur: 0.22, peak: 0.22, type: 'bandpass', f0: 700, f1: 2200, q: 2 });
    },
    ignite() {        // pimenta
      if (!ok('ignite', 0.1)) return;
      noise({ dur: 0.6, peak: 0.4, type: 'bandpass', f0: 500, f1: 2600, q: 1 });
      tone({ dur: 0.3, peak: 0.12, wave: 'sawtooth', f0: 200, f1: 600 });
    },
    hover() {         // mouse passou sobre um botão
      if (!ok('hover', 0.04)) return;
      tone({ dur: 0.045, peak: 0.07, wave: 'square', f0: 1320, f1: 1760 });
    },
    step() {          // passo bem baixinho
      if (!ok('step', 0.06)) return;
      noise({ dur: 0.05, peak: 0.07, type: 'lowpass', f0: rand(500, 800), f1: 150 });
    },
    hit() {           // impacto no inimigo
      if (!ok('hit', 0.025)) return;
      tone({ dur: 0.07, peak: 0.22, wave: 'square', f0: rand(320, 380), f1: 120 });
      noise({ dur: 0.05, peak: 0.25, type: 'lowpass', f0: 1800, f1: 400 });
    },
    kill() {          // inimigo explode
      if (!ok('kill', 0.03)) return;
      noise({ dur: 0.3, peak: 0.6, type: 'lowpass', f0: 2200, f1: 100 });
      tone({ dur: 0.25, peak: 0.35, wave: 'sawtooth', f0: 260, f1: 50 });
      tone({ dur: 0.08, peak: 0.12, wave: 'square', f0: 880, f1: 1320, delay: 0.02 });
    },
    hurt() {          // jogador toma dano
      if (!ok('hurt', 0.1)) return;
      tone({ dur: 0.3, peak: 0.4, wave: 'square', f0: 520, f1: 90 });
      noise({ dur: 0.15, peak: 0.4, type: 'lowpass', f0: 1500, f1: 200 });
    },
    gameOver() {      // descida triste
      if (!ok('over', 1)) return;
      [392, 330, 262, 196].forEach((f, i) => tone({ dur: 0.28, peak: 0.18, wave: 'triangle', f0: f, f1: f * 0.97, delay: 0.25 + i * 0.22 }));
    },
    bite() {          // jacaré mordendo a casa (madeira rachando)
      if (!ok('bite', 0.06)) return;
      noise({ dur: 0.12, peak: 0.45, type: 'bandpass', f0: rand(500, 800), q: 2 });
      tone({ dur: 0.1, peak: 0.25, wave: 'square', f0: rand(150, 190), f1: 70 });
    },
    houseDown() {     // casa desabando
      if (!ok('houseDown', 1)) return;
      noise({ dur: 1.4, peak: 0.9, type: 'lowpass', f0: 1800, f1: 60 });
      tone({ dur: 1.0, peak: 0.6, wave: 'sawtooth', f0: 110, f1: 30 });
      for (let i = 0; i < 5; i++) noise({ dur: 0.1, peak: 0.4, type: 'bandpass', f0: rand(400, 1200), q: 2, delay: 0.1 + i * 0.15 });
    },
    select() {        // menu
      if (!ok('select', 0.1)) return;
      tone({ dur: 0.07, peak: 0.15, wave: 'square', f0: 660 });
      tone({ dur: 0.12, peak: 0.15, wave: 'square', f0: 990, delay: 0.07 });
    },
    setRain(k) {      // chiado de chuva contínuo (volume = intensidade)
      if (!ac) return;
      if (!this._rain) {
        const src = ac.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
        const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1800; f.Q.value = 0.4;
        const g = ac.createGain(); g.gain.value = 0;
        src.connect(f); f.connect(g); g.connect(master); src.start();
        this._rain = g;
      }
      this._rain.gain.setTargetAtTime(muted ? 0 : 0.08 * k, ac.currentTime, 0.3);
    },
    rodBreak() {      // para-raio quebrando: estalo elétrico + ferro caindo e quicando no telhado
      if (!ok('rodBreak', 0.3)) return;
      noise({ dur: 0.18, peak: 0.6, type: 'highpass', f0: 4000, f1: 1200 });
      tone({ dur: 0.35, peak: 0.25, wave: 'square', f0: 1400, f1: 300, delay: 0.05 });
      tone({ dur: 0.12, peak: 0.3, wave: 'triangle', f0: 880, f1: 620, delay: 0.25 });
      tone({ dur: 0.1, peak: 0.22, wave: 'triangle', f0: 760, f1: 540, delay: 0.42 });
      tone({ dur: 0.08, peak: 0.15, wave: 'triangle', f0: 700, f1: 500, delay: 0.55 });
      noise({ dur: 0.3, peak: 0.25, type: 'lowpass', f0: 900, f1: 200, delay: 0.25 });
    },
    thunder() {       // trovão: estalo + ronco grave longo
      if (!ok('thunder', 0.5)) return;
      noise({ dur: 0.25, peak: 0.8, type: 'highpass', f0: 2500, f1: 600 });
      noise({ dur: 2.2, peak: 0.9, type: 'lowpass', f0: 600, f1: 40, delay: 0.08 });
      tone({ dur: 1.4, peak: 0.4, wave: 'sine', f0: 70, f1: 28, delay: 0.1 });
    },
    get muted() { return muted; },
    set muted(v) { muted = !!v; },
    setVolume(v) { vol = v; if (master) master.gain.value = 0.45 * vol; },
  };
})();

try { const v = parseFloat(localStorage.getItem('gs_music')); if (!isNaN(v)) musicLevel = v; } catch (e) {}
let musicPreviewT = 0;                                      // ao mexer no volume, toca sem abaixar por um instante
function setMusicLevel(v) {
  musicLevel = Math.max(0, Math.min(1, Math.round(v * 10) / 10));
  musicPreviewT = 1.5;
  try { localStorage.setItem('gs_music', musicLevel); } catch (e) {}
}

const music = (() => {
  const tracks = {
    theme: new Audio('musica/gator-shooter-theme.mp3'),
    swamp: new Audio('musica/swamp-attack.mp3'),
    shop:  new Audio('musica/old-bill-shop.mp3'),     // visita do velho Bill
    story: new Audio('musica/gator-story.mp3'),       // tela da história
    morning: new Audio('musica/morning-scale.mp3'),   // horda de dia (reveza com Swamp Attack)
    moss:  new Audio('musica/midnight-moss.mp3'),     // horda de noite
    river: new Audio('musica/river-wave.mp3'),        // horda de noite (reveza com Midnight Moss)
  };
  for (const t of Object.values(tracks)) { t.loop = true; t.volume = 0; t.preload = 'auto'; }
  // modo horda: playlist do dia e da noite. Cada faixa toca até o fim e passa a vez para a outra;
  // cada dia/noite novo começa pela faixa que não tocou por último
  const cycle = { day: { list: ['swamp', 'morning'], i: 0 }, night: { list: ['moss', 'river'], i: 1 } };
  let period = null, lastRogue = null;
  for (const c of Object.values(cycle)) for (const name of c.list) {
    tracks[name].loop = false;
    tracks[name].addEventListener('ended', () => {
      if (c.list[c.i] === name && mode === 'rogue') { c.i = (c.i + 1) % c.list.length; }   // acabou: entra a outra
    });
  }
  function rogueTrack() {
    const p = nightTarget() ? 'night' : 'day';
    if (p !== period) { if (period !== null || p === 'night') cycle[p].i = (cycle[p].i + 1) % cycle[p].list.length; period = p; }
    return cycle[p].list[cycle[p].i];
  }
  let unlocked = false, lastWant = null;
  // o navegador só deixa tocar áudio depois de uma interação
  const unlock = () => { unlocked = true; };
  ['mousedown', 'keydown'].forEach(ev => window.addEventListener(ev, unlock));
  const want = () => (mode === 'menu' && story.open ? 'story' : bill.active && bill.state !== 'leave' ? 'shop' : mode === 'rogue' ? rogueTrack() : 'theme');
  return {
    restart(name) { const t = tracks[name]; if (t) { try { t.currentTime = 0; } catch (e) {} } },
    resetRogue() { cycle.day.i = 0; cycle.night.i = 1; period = null; lastRogue = null; },   // partida nova: começa com Swamp Attack
    update(dt) {
      if (!unlocked) return;
      const w = want();
      if (w !== lastWant) {                       // horda e loja começam do início (voltando da loja, a horda continua de onde parou)
        if (w === 'shop' || w === 'story') this.restart(w);                      // loja e história começam do início
        else if (mode === 'rogue') { if (w !== lastRogue) this.restart(w); lastRogue = w; }   // faixa nova da horda: do início; voltando da loja, continua
        lastWant = w;
      }
      musicPreviewT = Math.max(0, musicPreviewT - dt);
      const duck = (paused || (mode === 'rogue' && run.phase === 'cards')) && musicPreviewT <= 0;
      for (const [name, t] of Object.entries(tracks)) {
        const target = sfx.muted ? 0 : name === w ? MUSIC.volume * musicLevel * (duck ? MUSIC.ducked : 1) : 0;
        const v = t.volume + Math.sign(target - t.volume) * Math.min(Math.abs(target - t.volume), MUSIC.fade * dt);
        t.volume = Math.max(0, Math.min(1, v));
        if (t.volume > 0.001 && t.paused) t.play().catch(() => {});
        else if (t.volume <= 0.001 && !t.paused && target === 0) t.pause();
      }
    },
    tracks,
  };
})();

const keys = new Set();
window.addEventListener('keydown', e => keys.add(e.key.toLowerCase()));
window.addEventListener('keyup',   e => keys.delete(e.key.toLowerCase()));

const mouse = { x: 0, y: 0, down: false };
window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
canvas.addEventListener('mousedown', e => {
  if (e.button === 0) { mouse.down = true; mouse.pressed = true; }
  if (e.button === 2) mouse.rightPressed = true;
});
window.addEventListener('mouseup',   e => { if (e.button === 0) mouse.down = false; });
window.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('blur', () => {
  keys.clear(); mouse.down = false;
  if (typeof mode !== 'undefined' && mode !== 'menu' && !gameOver) setPaused(true);   // pausa ao sair da janela
});

// =====================================================================
// Mapa: grama com clareiras/trilhas de areia (gerado com seed fixa)
// =====================================================================
const map = { canvas: document.createElement('canvas'), ready: false };

function buildMap() {
  // mundo de tamanho fixo (a câmera mostra só um pedaço)
  WORLD_W = WORLD.w; WORLD_H = WORLD.h;
  MAP_W = Math.ceil(WORLD_W / TILE); MAP_H = Math.ceil(WORLD_H / TILE);
  if (!map.ready) { player.x = WORLD_W / 2; player.y = WORLD_H / 2; } // nasce no centro
  house.x = Math.round(WORLD_W / 2); house.y = Math.round(WORLD_H / 2);

  // PRNG com seed para o mapa ser sempre o mesmo
  let seed = 1337;
  const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;

  // terra só num círculo no meio, desenhado pixel a pixel (resolução nativa: 16 px por tile)
  const c = map.canvas; c.width = MAP_W * T; c.height = MAP_H * T;
  const m = c.getContext('2d');
  const ccx = WORLD_W / 2 / SCALE, ccy = WORLD_H / 2 / SCALE;            // centro do mundo
  const R = SAND_R / SCALE;
  const edge = (px, py) => {                                              // >0 fora (grama), <0 dentro (terra)
    const a = Math.atan2(py - ccy, px - ccx);
    const wob = Math.sin(a * 5 + 1.3) * 1.3 + Math.sin(a * 9 + 0.4) * 0.8 + Math.sin(a * 17) * 0.5;
    return Math.hypot(px - ccx, py - ccy) - (R + wob);
  };

  // tiles (para saber onde pode nascer tufo): terra se o centro do tile está perto do círculo
  map.tiles = [];
  for (let y = 0; y < MAP_H; y++)
    for (let x = 0; x < MAP_W; x++) map.tiles.push(edge(x * T + T / 2, y * T + T / 2) < T * 0.8 ? 1 : 0);
  const at = (x, y) => (x < 0 || y < 0 || x >= MAP_W || y >= MAP_H) ? -1 : map.tiles[y * MAP_W + x];

  // camadas completas de grama e de terra, com rotação aleatória para quebrar repetição
  const layer = set => {
    const L = document.createElement('canvas'); L.width = c.width; L.height = c.height;
    const g = L.getContext('2d');
    for (let y = 0; y < MAP_H; y++)
      for (let x = 0; x < MAP_W; x++) {
        g.save(); g.translate(x * T + T / 2, y * T + T / 2);
        g.rotate(Math.floor(rnd() * 4) * Math.PI / 2);
        g.drawImage(set, 4, 4, T, T, -T / 2, -T / 2, T, T);
        g.restore();
      }
    return g.getImageData(0, 0, L.width, L.height).data;
  };
  const grassD = layer(grassSet), sandD = layer(sandSet);

  // cores da franja da grama (linha de borda do tileset), para a borda serrilhada
  const fc = document.createElement('canvas'); fc.width = 24; fc.height = 24;
  const fg = fc.getContext('2d'); fg.drawImage(grassSet, 0, 0);
  const fd = fg.getImageData(4, 2, 16, 1).data, fringe = [];
  for (let k = 0; k < 16; k++) fringe.push([fd[k * 4], fd[k * 4 + 1], fd[k * 4 + 2]]);

  // composição: dentro = terra; faixa de 2 px na borda = franja da grama (linha cheia + linha serrilhada)
  const out = m.createImageData(c.width, c.height), o = out.data;
  for (let py = 0; py < c.height; py++) {
    for (let px = 0; px < c.width; px++) {
      const i = (py * c.width + px) * 4, e = edge(px + 0.5, py + 0.5);
      let src = grassD, col = null;
      if (e < -2) src = sandD;
      else if (e < -1) { if (rnd() < 0.5) src = sandD; else col = fringe[(px * 7 + py * 3) % 16]; }
      else if (e < 0) col = fringe[(px * 5 + py * 11) % 16];
      if (col) { o[i] = col[0]; o[i + 1] = col[1]; o[i + 2] = col[2]; }
      else { o[i] = src[i]; o[i + 1] = src[i + 1]; o[i + 2] = src[i + 2]; }
      o[i + 3] = 255;
    }
  }
  m.putImageData(out, 0, 0);

  // árvores: um anel denso em volta da tela, como uma clareira no meio da mata
  trees.length = 0;
  const addTree = (x, baseY, side) => trees.push({ x, baseY, side, phase: rnd() * 6.28, sway: 0, vel: 0,
    flip: rnd() < 0.5, leafT: rnd() * 8, cool: 0 });
  const jit = v => (rnd() - 0.5) * v;
  for (let x = -30; x <= WORLD_W + 30; x += TREE.spacing) {
    addTree(x + jit(30), 70 + jit(40), 'top');                          // topo: tronco e copa aparecendo
    addTree(x + TREE.spacing / 2 + jit(30), WORLD_H + 95 + jit(40), 'bottom');   // embaixo: só a copa
    if (rnd() < TREE.innerChance) addTree(x + jit(40), 125 + jit(25), 'top');
  }
  for (let y = 150; y <= WORLD_H + 40; y += TREE.spacing) {
    addTree(-14 + jit(24), y + jit(30), 'left');
    addTree(WORLD_W + 14 + jit(24), y + TREE.spacing / 2 + jit(30), 'right');
    if (rnd() < TREE.innerChance) addTree(28 + jit(16), y + jit(40), 'left');
    if (rnd() < TREE.innerChance) addTree(WORLD_W - 28 + jit(16), y + jit(40), 'right');
  }
  // mata espalhada: fica mais densa quanto mais longe da clareira
  for (let y = 120; y < WORLD_H - 60; y += 150) {
    for (let x = 90; x < WORLD_W - 60; x += 150) {
      const tx = x + jit(110), ty = y + jit(110);
      const dx = (tx - WORLD_W / 2) / (WORLD_W / 2), dy = (ty - WORLD_H / 2) / (WORLD_H / 2);
      const r = Math.hypot(dx, dy), d = Math.hypot(tx - WORLD_W / 2, ty - WORLD_H / 2);
      if (d < SAND_R + 150 || r < 0.42) continue;
      if (rnd() < Math.min(0.85, 0.15 + (r - 0.42) * 1.8)) addTree(tx, ty, 'inner');
    }
  }
  leaves.length = 0;
  buildLightCache();
  // vagalumes: vagando perto da mata (fora da clareira)
  fireflies.length = 0;
  for (let i = 0; i < LIGHT.fireflies; i++) {
    const a = rnd() * Math.PI * 2;
    const rr = 0.3 + rnd() * 0.16;
    fireflies.push({ bx: WORLD_W / 2 + Math.cos(a) * WORLD_W * rr, by: WORLD_H / 2 + Math.sin(a) * WORLD_H * rr,
      ax: 30 + rnd() * 50, ay: 20 + rnd() * 40, sx: 0.15 + rnd() * 0.25, sy: 0.12 + rnd() * 0.22,
      ph: rnd() * 6.28, blink: 0.6 + rnd() * 0.9 });
  }
  for (let i = 0; i < NIGHT.fireflies; i++) {          // só à noite: muitos, inclusive perto da clareira
    const a = rnd() * Math.PI * 2, rr = 0.2 + rnd() * 0.3;
    fireflies.push({ bx: WORLD_W / 2 + Math.cos(a) * WORLD_W * rr, by: WORLD_H / 2 + Math.sin(a) * WORLD_H * rr,
      ax: 40 + rnd() * 70, ay: 30 + rnd() * 50, sx: 0.15 + rnd() * 0.3, sy: 0.12 + rnd() * 0.25,
      ph: rnd() * 6.28, blink: 0.7 + rnd() * 1.1, night: true });
  }

  // tufos de grama: em moitas de 1 a 4 por tile, até a franja da terra, fora da casa e dos troncos
  tufts.length = 0;
  const HR = houseRect();
  const addTuft = (tx, ty, big) => {
    if (tx > HR.l - 40 && tx < HR.r + 40 && ty > HR.t - 70 && ty < HR.b + 30) return;
    if (trees.some(tr => Math.abs(tr.x - tx) < 50 && ty < tr.baseY + 24 && ty > tr.baseY - 40)) return;
    tufts.push({ x: tx, y: ty, big, flip: rnd() < 0.5, phase: rnd() * Math.PI * 2, bend: 0, vel: 0, touched: false });
  };
  for (let y = 0; y < MAP_H; y++) {
    for (let x = 0; x < MAP_W; x++) {
      const cx = (x + 0.5) * TILE, cy = (y + 0.5) * TILE;
      const e = edge(cx / SCALE, cy / SCALE) * SCALE;                     // distância até a borda da terra (px de mundo)
      if (e < -70 || e > -10 && e < 18) continue;                         // nem no meio da terra, nem em cima da franja
      if (e < 0) {                                                        // terra perto da borda: tufinhos ralos
        if (rnd() < TUFT.sandChance) addTuft(cx + (rnd() - 0.5) * TILE, cy + (rnd() - 0.5) * TILE, false);
        continue;
      }
      if (rnd() > TUFT.density) continue;
      const n = 1 + (rnd() < TUFT.clump ? 1 : 0) + (rnd() < TUFT.clump * 0.5 ? 1 : 0) + (rnd() < TUFT.clump * 0.2 ? 1 : 0);
      const bx = (x + 0.2 + rnd() * 0.6) * TILE, by = (y + 0.35 + rnd() * 0.55) * TILE;
      for (let k = 0; k < n; k++)
        addTuft(bx + (k ? (rnd() - 0.5) * 46 : 0), by + (k ? (rnd() - 0.5) * 24 : 0), rnd() < TUFT.bigChance);
    }
  }
  tufts.sort((a, b) => a.y - b.y);

  // borda escura do mundo
  m.strokeStyle = 'rgba(0,0,0,.45)'; m.lineWidth = 2;
  m.strokeRect(1, 1, c.width - 2, c.height - 2);
  map.ready = true;
}

function houseRect() {
  const w = HOUSE_W * HOUSE_SCALE, h = HOUSE_H * HOUSE_SCALE;
  const left = house.x - w / 2, top = house.y - h / 2;
  return { l: left + 5 * HOUSE_SCALE, r: left + w - 3 * HOUSE_SCALE, t: top + HOUSE_SOLID_TOP * HOUSE_SCALE, b: top + h };
}
// empurra um corpo (centro x,y; meia-largura hw, meia-altura hh) para fora da casa
function pushOutOfHouse(o, hw, hh) {
  if (!house.active && !house.decor) return false;   // decorativa também é sólida
  const R = houseRect();
  const l = R.l - hw, r = R.r + hw, t = R.t - hh, b = R.b + hh;
  if (o.x <= l || o.x >= r || o.y <= t || o.y >= b) return false;
  const pen = [o.x - l, r - o.x, o.y - t, b - o.y];
  const m = Math.min(...pen);
  if (m === pen[0]) o.x = l; else if (m === pen[1]) o.x = r; else if (m === pen[2]) o.y = t; else o.y = b;
  return true;
}

const whiteCache = new Map();
// silhueta colorida (para mostrar inimigos escondidos atrás da casa)
const tintCache = new Map();
function tintOf(image, color) {
  const key = color; let m = tintCache.get(image);
  if (!m) tintCache.set(image, m = {});
  if (m[key]) return m[key];
  const c = document.createElement('canvas'); c.width = image.width; c.height = image.height;
  const g = c.getContext('2d'); g.drawImage(image, 0, 0);
  g.globalCompositeOperation = 'source-in'; g.fillStyle = color; g.fillRect(0, 0, c.width, c.height);
  return (m[key] = c);
}
function whiteOf(image) {
  if (whiteCache.has(image)) return whiteCache.get(image);
  const c = document.createElement('canvas');
  c.width = image.width; c.height = image.height;
  const g = c.getContext('2d');
  g.drawImage(image, 0, 0);
  g.globalCompositeOperation = 'source-in';
  g.fillStyle = '#ffffff';
  g.fillRect(0, 0, c.width, c.height);
  whiteCache.set(image, c);
  return c;
}

// câmera: segue o jogador (com um leve avanço na direção da mira), presa nas bordas do mundo
function updateCamera(dt) {
  const vw = viewW(), vh = viewH();
  let tx = house.x, ty = house.y;                                   // menu: mostra a clareira
  if (mode !== 'menu') {
    tx = player.x + (mouse.x - canvas.width / 2) / ZOOM * CAM.lead;

  }
  if (cut.on && bill.active) { tx = (bill.x * 2 + player.x) / 3; ty = (bill.y - 60) * 0.7 + player.y * 0.3; }
  const clampC = (c, v, W) => v >= W ? W / 2 : Math.max(v / 2, Math.min(W - v / 2, c));
  tx = clampC(tx, vw, WORLD_W); ty = clampC(ty, vh, WORLD_H);
  if (!cam.init) { cam.cx = tx; cam.cy = ty; cam.init = true; }
  const k = 1 - Math.exp(-CAM.follow * dt);
  cam.cx += (tx - cam.cx) * k; cam.cy += (ty - cam.cy) * k;
  cam.cx = clampC(cam.cx, vw, WORLD_W); cam.cy = clampC(cam.cy, vh, WORLD_H);
  cam.x = cam.cx - vw / 2; cam.y = cam.cy - vh / 2;
}

// posição/orientação da arma (já com recuo) — usada para desenhar e para achar o cano
function gunTransform() {
  const a = player.aim, h = hand();
  const flip = Math.cos(a) < 0 ? -1 : 1;
  const r = (GUN_RADIUS - player.kick) * SCALE;
  return { x: h.x + Math.cos(a) * r, y: h.y + Math.sin(a) * r, rot: a - player.kickRot * flip, flip };
}
function muzzlePos() {
  const g = gunTransform();
  const G = gunSpec();
  const lx = (G.muzzle.x - G.grip.x) * SCALE, ly = (G.muzzle.y - G.grip.y) * SCALE * g.flip;
  const c = Math.cos(g.rot), s = Math.sin(g.rot);
  return { x: g.x + lx * c - ly * s, y: g.y + lx * s + ly * c };
}

function sparkle(x, y) {

function rollDrop(x, y) {
  let r = Math.random();
  for (const d of DROP_TABLE) {
    if (r < d.chance) {
      const kinds = ['ammo'].concat(has9mm() ? ['ammo9'] : []);       // 9 mm só cai se tiver uzi ou revólveres
      const kind = kinds[Math.floor(Math.random() * kinds.length)];
      pickups.push({ kind, x, y, amount: d.amount * AMMO_KINDS[kind].mult, scale: d.scale, big: d === DROP_TABLE[0], t: rand(0, 6), age: 0,
        shine: 0, nextShine: rand(...BOX_SHINE_EVERY), pop: 1, life: DROP_LIFE });
      return;
    }
    r -= d.chance;
  }
}

function canCollect(b) {
  if (gameOver) return false;
  if (b.kind === 'heal') return house.active && house.hp < houseMax();

}

function collectPickup(b) {
  if (b.kind === 'heal') return collectHeal(b);
  const K = AMMO_KINDS[b.kind];
  const gained = Math.min(b.amount, K.max() - player[K.res]);
  player[K.res] += gained;
  reservePop = 1;
  sfx.reload();
  const cy = pickupCenterY(b);
  for (let i = 0; i < 16; i++) {   // explosão de faíscas
    const a = (i / 16) * Math.PI * 2, sp = rand(150, 320);

  particles.push({ x: b.x, y: cy - 30, vx: 0, vy: -60, life: 0.9, age: 0, size: 0, color: 'text', text: `+${gained}`, drag: 1.5 });
  sparkle(b.x + 20, cy - 20);
}

function updatePickups(dt) {
  for (let i = pickups.length - 1; i >= 0; i--) {
    const b = pickups[i];
    b.t += dt; b.age += dt;
    b.pop *= Math.exp(-7 * dt);
    if (b.shine >= 0) {
      b.shine += dt / BOX_SHINE_TIME;
      if (b.shine >= 1) { b.shine = -1; b.nextShine = rand(...BOX_SHINE_EVERY); }
    } else if ((b.nextShine -= dt) <= 0) {
      b.shine = 0;
      sparkle(b.x + rand(-BOX_W, BOX_W) * b.scale * 0.4, pickupCenterY(b) + rand(-BOX_H, BOX_H) * b.scale * 0.3);
    }
    const near = Math.hypot(player.x - b.x, player.y - b.y) < BOX_RADIUS + b.scale * 4;
    if (near && canCollect(b)) { collectPickup(b); pickups.splice(i, 1); continue; }
    const healUseless = b.kind === 'heal' && house.hp >= houseMax() && b.pop < 0.2;   // casa 100%: a cura some
    if (b.age > b.life || healUseless) {

function drawPickup(b) {
  const spr = b.kind === 'heal' ? medkitImg : AMMO_BOX_IMGS[b.kind] || boxImg;
  if (!spr.complete) return;
  // pisca nos últimos 3 segundos
  const left = b.life - b.age;
  if (left < 2 && Math.floor(left * (left < 0.8 ? 16 : 8)) % 2 === 0) return;
  const SW = spr.width, SH = spr.height;
  const w = SW * b.scale, h = SH * b.scale;
  const lift = pickupFloat(b) - b.pop * 30;

  // sombra no chão: menor quando a caixa sobe

  ctx.fillStyle = 'rgba(0,0,0,.25)';

    pickupCtx.fillStyle = 'rgba(255,255,255,.85)';
    pickupCtx.beginPath();
    pickupCtx.moveTo(sx, 0); pickupCtx.lineTo(sx + 3, 0); pickupCtx.lineTo(sx + 3 - SH, SH); pickupCtx.lineTo(sx - SH, SH);
    pickupCtx.fill();

  ctx.textAlign = 'center';
  const label = b.kind === 'heal' ? `+${Math.round(ROGUE.rewardHeal * 100)}% CASA` : `+${b.amount}`;
  const ly = Math.round(cy - h / 2 - 6);
  ctx.fillStyle = '#000'; ctx.fillText(label, b.x + 1, ly + 1);
  ctx.fillStyle = b.kind === 'heal' ? '#7bd04a' : b.big ? '#ffe08a' : '#f4f1de';
  ctx.fillText(label, b.x, ly);
  ctx.textAlign = 'left';

function impact(x, y, ang, strong) {

function hitEnemy(e, b, ang, dmg = PELLET_DAMAGE) {
  const crit = Math.random() < critChance();
  if (crit) dmg *= CRIT_MULT;
  dmg = shieldAbsorb(e, dmg);
  const dealt = Math.min(dmg, e.hp);
  e.hp -= dmg;
  // vampirismo: parte do dano vira vida da casa
  if (house.active && vampirism() > 0 && house.hp > 0) {
    house.hp = Math.min(houseMax(), house.hp + dealt * vampirism());
    house.heal = Math.max(house.heal || 0, 0.25);
  }
  showDamage(e, dmg, crit);
  if (crit) {
    for (let i = 0; i < 5; i++)
      particles.push({ x: b.x, y: b.y, vx: rand(-200, 200), vy: rand(-200, 200), life: 0.25, age: 0, size: 4, color: '#ffd166', drag: 8 });
    sfx.crit();
  }
  if (e.hp > 0) sfx.hit();
  e.flash = 0.09;               // fica branco
  e.jiggle = 1;                 // tremidinha
  e.hpShow = 2;                 // mostra a barra de vida por um tempo
  if (!e.homeRel) { e.x += Math.cos(ang) * 6 * e.T.knockMul; e.y += Math.sin(ang) * 6 * e.T.knockMul; }  // leve empurrão do impacto
  cam.trauma = Math.min(1, cam.trauma + 0.015);

    const a = ang + rand(-0.7, 0.7), sp = rand(120, 320);
    particles.push({ x: b.x, y: b.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: rand(0.2, 0.4), age: 0, size: rand(3, 5), color: Math.random() < .6 ? '#ac3232' : '#ffffff', drag: 7 });
  }
  if (e.hp <= 0) killEnemy(e);
}

// escudo verde do healer: absorve o dano antes da vida
function shieldAbsorb(e, dmg) {
  if (!(e.shieldT > 0) || !(e.shield > 0)) return dmg;
  const a = Math.min(e.shield, dmg);
  e.shield -= a; e.shieldHit = 1;
  if (e.shield <= 0.01) {                          // escudo quebrou
    e.shieldT = 0;
    for (let i = 0; i < 10; i++) { const an = rand(0, Math.PI * 2); particles.push({ x: e.x + Math.cos(an) * 30, y: e.y + Math.sin(an) * 30 - 10, vx: Math.cos(an) * 140, vy: Math.sin(an) * 140 - 40, life: 0.4, age: 0, size: rand(3, 5), color: '#9dff8a', drag: 4 }); }
  }
  return dmg - a;
}
function killEnemy(e) {
  if (e.scare) { e.hp = e.maxHp; return; }
  e.alive = false;
  if (e.hat) { const hk = e.hat; e.hat = null; launchHat(hk, e.x, e.y + e.T.h * e.T.sc / 2, e.T.h * e.T.sc * 0.95, rand(-140, 140), rand(-60, 60), rand(420, 520)); }
  if (e.T.healer && mode !== 'test') healerLastBreath(e);
  sfx.kill();
  e.respawn = ENEMY_RESPAWN;
  if (mode === 'rogue') run.kills++;
  rollDrop(e.x, e.y + e.T.h * e.T.sc / 2 - 10);
  dropTeeth(e);
  cam.trauma = Math.min(1, cam.trauma + (mode === 'rogue' ? 0.05 : 0.2));
  for (let i = 0; i < 28; i++) {
    const a = rand(0, Math.PI * 2), sp = rand(100, 480);
    particles.push({ x: e.x + rand(-15, 15), y: e.y + rand(-20, 20), vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: rand(0.3, 0.7), age: 0, size: rand(4, 8), color: Math.random() < .7 ? '#ac3232' : '#ffffff', drag: 5 });
  }
  particles.push({ x: e.x, y: e.y, vx: 0, vy: 0, life: 0.35, age: 0, size: 12, grow: 300, color: 'ring', drag: 0 });
}

// ---------- espantalho do treino ----------
function updateScare(e, dt) {
  e.hp = e.maxHp; e.frozenT = Math.max(0, (e.frozenT || 0) - dt);
  // levou dano (qualquer fonte reinicia o jiggle): balança para longe do jogador
  if (e.jiggle > (e.pj || 0) + 0.05) {
    const dir = Math.sign(e.x - player.x) || 1;
    e.rotV += dir * SCARE.push * (0.7 + Math.random() * 0.6);
    if (e.hat) {                                   // primeiro tiro: o chapéu voa longe
      const hk = e.hat; e.hat = null;
      launchHat(hk, e.x + (SCARE.headX - SCARE.baseX) * e.T.sc, e.y + e.T.h * e.T.sc / 2, e.T.h * e.T.sc - 6,
        dir * rand(280, 400), rand(-90, 90), rand(560, 680), dir);
      sfx.swing();
    }
  }
  e.pj = e.jiggle;
  // mola: volta para o meio, balançando cada vez menos
  e.rotV += (-SCARE.spring * e.rot - SCARE.damp * e.rotV) * dt;
  e.rot = Math.max(-SCARE.max, Math.min(SCARE.max, e.rot + e.rotV * dt));
  e.hatPop *= Math.exp(-6 * dt);
}
function drawScare(e, ghost) {
  if (ghost) return;
  const T = e.T, S = T.sc, feet = e.y + T.h * S / 2;
  ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.beginPath(); ctx.ellipse(e.x, feet - 2, 26, 6, 0, 0, Math.PI * 2); ctx.fill();
  if (!SCARE_IMG.complete) return;
  ctx.save(); ctx.imageSmoothingEnabled = false;
  ctx.translate(Math.round(e.x), Math.round(feet)); ctx.rotate(e.rot);          // pivô no pé do poste
  const sq = 1 + e.jiggle * 0.06; ctx.scale(sq, 1 / sq);
  const ox = -SCARE.baseX * S, oy = -T.h * S;
  ctx.drawImage(e.flash > 0 ? whiteOf(SCARE_IMG) : SCARE_IMG, ox, oy, T.w * S, T.h * S);
  if (e.frozenT > 0) { ctx.globalAlpha = Math.min(1, e.frozenT * 2) * 0.6; ctx.drawImage(tintOf(SCARE_IMG, '#bfefff'), ox, oy, T.w * S, T.h * S); ctx.globalAlpha = 1; }
  if (e.hat && e.hat.img.complete) {
    const HI = e.hat.img, k = 1 + e.hatPop * 0.5, hw = HI.width * S * k, hh = HI.height * S * k;
    const hx = ox + SCARE.headX * S, hy = oy + (SCARE.headTop + 1) * S;
    ctx.drawImage(e.flash > 0 ? whiteOf(HI) : HI, Math.round(hx - e.hat.cx * S * k), Math.round(hy - hh), hw, hh);
  }
  ctx.restore();
  if (e.burnT > 0) {                               // pegando fogo (pimenta)
    const fi = fireImgs[Math.floor((clock + e.x * 0.01) * 10) % 2];
    if (fi.complete) { const fw = 16 * S; ctx.globalAlpha = Math.min(1, e.burnT * 2); ctx.drawImage(fi, Math.round(e.x - fw / 2), Math.round(feet - fw - 8 * S), fw, fw); ctx.globalAlpha = 1; }
  }
}
// ---------- chapéus ----------
// topo da cabeça de um sprite (para assentar o chapéu): primeira linha com pixel e o meio dela
const headCache = new Map();
function headOf(im) {
  if (headCache.has(im)) return headCache.get(im);
  if (!im.complete || !im.width) return null;
  const c = document.createElement('canvas'); c.width = im.width; c.height = im.height;
  const g = c.getContext('2d'); g.drawImage(im, 0, 0);
  const d = g.getImageData(0, 0, c.width, c.height).data;
  let top = -1, x0 = 1e9, x1 = -1;
  for (let y = 0; y < c.height && top < 0; y++) for (let x = 0; x < c.width; x++) if (d[(y * c.width + x) * 4 + 3] > 0) { top = y; break; }
  if (top < 0) return null;
  for (let y = top; y < Math.min(c.height, top + 3); y++) for (let x = 0; x < c.width; x++)
    if (d[(y * c.width + x) * 4 + 3] > 0) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); }
  const r = { x: (x0 + x1 + 1) / 2, top };
  headCache.set(im, r); return r;
}
// chapéu na cabeça, no espaço do sprite já transformado (ox, oy = canto do quadro; by = deslocamento do corpo no quadro)
function drawHatOn(hat, body, ox, oy, by, S, white) {
  const hd = headOf(body), HI = hat.img; if (!hd || !HI.complete) return;
  const hw = HI.width * S, hh = HI.height * S;
  ctx.drawImage(white ? whiteOf(HI) : HI, Math.round(ox + (hd.x - hat.cx) * S), Math.round(oy + (hd.top + by + 2) * S - hh), hw, hh);
}
function launchHat(kind, x, y, z, vx, vy, vz, dir = Math.sign(vx) || 1) {
  hats.push({ kind, x, y, z, vx, vy, vz, rot: 0, vr: dir * rand(9, 15), age: 0, ground: false, bounced: false });
}
function updateHats(dt) {
  for (let i = hats.length - 1; i >= 0; i--) {
    const h = hats[i];
    if (!h.ground) {
      h.x += h.vx * dt; h.y += h.vy * dt; h.z += h.vz * dt; h.vz -= HAT.gravity * dt; h.rot += h.vr * dt;
      h.x = Math.max(20, Math.min(WORLD_W - 20, h.x)); h.y = Math.max(20, Math.min(WORLD_H - 20, h.y));
      if (h.z <= 0) {
        h.z = 0;
        if (!h.bounced && h.vz < -250) { h.bounced = true; h.vz = -h.vz * 0.3; h.vx *= 0.45; h.vy *= 0.45; h.vr *= 0.5; }
        else { h.ground = true; h.rot = Math.atan2(Math.sin(h.rot), Math.cos(h.rot)); }
      }
    } else {
      h.rot *= Math.exp(-14 * dt);                       // assenta reto no chão
      if ((h.age += dt) > HAT.life) hats.splice(i, 1);
    }
  }
}
const playerFeet = () => ({ x: player.x, y: player.y + player.h / 2 });
function nearHat() {
  const f = playerFeet();
  let best = null, bd = HAT.pick;
  for (const h of hats) if (h.ground) { const d = Math.hypot(h.x - f.x, h.y - f.y); if (d < bd) { bd = d; best = h; } }
  return best;
}
function pickHat(h) {
  hats.splice(hats.indexOf(h), 1);
  if (player.hat) launchHat(player.hat, player.x, player.y + player.h / 2, player.h * 0.9, -player.facing * rand(120, 180), rand(-40, 40), rand(380, 460));   // só um por vez: o antigo cai
  player.hat = h.kind; player.hatPop = 1;
  sfx.upgrade();
  for (let i = 0; i < 14; i++) { const a = rand(0, Math.PI * 2), sp = rand(80, 220);
    particles.push({ x: player.x, y: player.y - player.h * 0.45, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60, life: rand(0.3, 0.6), age: 0, size: rand(3, 6), color: Math.random() < 0.5 ? '#ffc825' : '#ff5000', drag: 5 }); }
}
function drawHat(h) {
  const HI = h.kind.img; if (!HI.complete) return;
  const S = SCALE, w = HI.width * S, hh = HI.height * S;
  const left = HAT.life - h.age;
  if (h.ground && left < 2 && Math.floor(left * (left < 0.8 ? 16 : 8)) % 2 === 0) return;   // pisca antes de sumir, como os itens
  const fade = 1;
  ctx.globalAlpha = 0.28 * fade; ctx.fillStyle = '#000';
  const sh = Math.max(0.4, 1 - h.z / 300); ctx.beginPath(); ctx.ellipse(h.x, h.y, 22 * sh, 5 * sh, 0, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = fade;
  ctx.save(); ctx.imageSmoothingEnabled = false;
  ctx.translate(Math.round(h.x), Math.round(h.y - h.z - hh / 2)); ctx.rotate(h.rot);
  const near = h.ground && nearHat() === h && !gameOver;
  if (near) {                                         // dá para pegar: contorno branco pulsando
    const wh = tintOf(HI, '#ffffff'), o = 2 + Math.round(Math.sin(clock * 8) + 1);
    for (const [dx, dy] of [[o, 0], [-o, 0], [0, o], [0, -o]]) ctx.drawImage(wh, -w / 2 + dx, -hh / 2 + dy, w, hh);
  }
  ctx.drawImage(HI, -w / 2, -hh / 2, w, hh);
  ctx.restore();
  ctx.globalAlpha = 1;
  if (near) drawMouseRight(h.x, h.y - hh - 34 + Math.sin(clock * 5) * 3);
}
// ícone do mouse com o botão direito aceso (dica de "pegar")
function drawMouseRight(cx, cy) {
  const s = 3, x = Math.round(cx - 4.5 * s), y = Math.round(cy - 6 * s);
  const M = ['..#####..', '.#..#yy#.', '#...#yyy#', '#...#yyy#', '#########', '#.......#', '#.......#', '#.......#', '#.......#', '.#.....#.', '..#####..'];
  M.forEach((row, r) => [...row].forEach((ch, c) => {
    if (ch === '.') { if (r > 0 && r < 10 && c > 0 && c < 8) { ctx.fillStyle = '#f4f1de'; ctx.fillRect(x + c * s, y + r * s, s, s); } return; }
    ctx.fillStyle = ch === 'y' ? '#ffc825' : '#140804'; ctx.fillRect(x + c * s, y + r * s, s, s);
  }));
}

// nasce fora da tela, numa borda aleatória, e caminha até o jogador
function spawnEdgeEnemy(cfg, type = 'basic') {
  // nasce fora da tela, numa borda aleatória, e atravessa a mata até a clareira
  const m = 50, side = Math.floor(Math.random() * 4);
  let x, y;
  if (side === 0)      { x = rand(0, WORLD_W); y = -m; }
  else if (side === 1) { x = WORLD_W + m; y = rand(0, WORLD_H); }
  else if (side === 2) { x = rand(0, WORLD_W); y = WORLD_H + m; }
  else                 { x = -m; y = rand(0, WORLD_H); }
  const T = ENEMY_TYPES[type];
  const grow = type === 'basic' ? enemySpeedMul() : type === 'rusher' ? 1 + GROW.rusherSpeed * growSteps('rusher') : 1;   // básico e rusher aceleram
  const e = makeEnemy(x, y, Math.round((T.hp || ROGUE.enemyHp) * (type === 'tank' ? tankHpMul() : 1)), (T.speed || ROGUE.enemySpeed) * grow, null, type);
  e.hat = type === 'basic' && Math.random() < HAT.chance ? randomHat() : null;   // só os básicos usam chapéu
  if (T.ranged) {
    const r = Math.random();
    e.weapon = r < RANGE.shotgunChance ? 'shotgun' : r < RANGE.shotgunChance + RANGE.dualChance ? 'dual' : 'revolver';
  }
  if (run.event) applyEvent(e);
  enemies.push(e);
}

// Healer: nunca se aproxima da casa. Anda pelo anel em volta da clareira, puxando para o lado onde há
// jacarés machucados, e a cada pulso cura todos os machucados num raio grande em volta dele
const HEALER = { every: 0.9, radius: 400, amount: 18, pct: 0.06, rx: 520, ry: 350, behind: 110,   // behind: distância atrás do tank que ele usa de escudo
  shield: 0.25, shieldTime: 4, deathHeal: 0.3 };   // escudo: 25% da vida máx. por 4 s; ao morrer cura 30% de quem está perto   // anel onde ele anda (px a partir do centro da casa)

  particles.push({ x: mx, y: my, vx: rand(-20, 20), vy: -25, life: 0.4, age: 0, size: shotgun ? 8 : 5, grow: 14, color: 'smoke', drag: 3 });
  // cápsula ejetada (cai e quica): latão pequeno no revólver, cartucho vermelho na escopeta
  const side = Math.cos(a) < 0 ? 1 : -1;
  particles.push({ x: h.x, y: h.y - 6, vx: -Math.cos(a) * rand(50, 110) + side * rand(10, 40), vy: rand(-280, -200),
    life: 1.2, age: 0, size: 0, color: shotgun ? 'shell' : 'cap', gravity: 1100, floor: e.y + e.T.h * e.T.sc / 2 - 6,
    rot: 0, vr: rand(-20, 20), drag: 0.5 });
  shotgun ? sfx.shot() : sfx.revolver();
}

function updateEnemyBullets(dt) {
  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const b = enemyBullets[i];
    b.age += dt; b.px = b.x; b.py = b.y; b.x += b.vx * dt; b.y += b.vy * dt;
    const R = houseRect();
    const br = enemyBulletSize(b) * 6;                 // raio da bala redonda
    if (ally.active && Math.abs(b.x - ally.x) < PLAYER_HITBOX.w * SCALE / 2 + br && Math.abs(b.y - ally.y) < PLAYER_HITBOX.h * SCALE / 2 + br) {
      damageAlly(b.dmg || RANGE.damage); enemyBullets.splice(i, 1); continue;   // tiro do range acerta o Antony no caminho
    }
    const fh = fenceHitPoint(b.x, b.y, br * 0.5);
    if (fh) { damageFence(fh, b.dmg || RANGE.damage, b.x, b.y); enemyBullets.splice(i, 1); continue; }   // a cerca segura o tiro
    if (house.active && b.x > R.l - br && b.x < R.r + br && b.y > R.t - 30 - br && b.y < R.b + br) { hitHouseRanged(b); enemyBullets.splice(i, 1); continue; }
    if (b.age > 7 || b.x < -20 || b.y < -20 || b.x > WORLD_W + 20 || b.y > WORLD_H + 20) enemyBullets.splice(i, 1);
  }
}

function hitHouseRanged(b) {
  if (gameOver) return;
  house.hp = Math.max(0, house.hp - (b.dmg || RANGE.damage) * houseDefMul());
  showHouseDamage(b.x, b.y - 10, (b.dmg || RANGE.damage) * houseDefMul());
  house.flash = 0.06; house.shake = Math.max(house.shake, 0.6); house.pop = 1;
  sfx.houseHit();
  const a = Math.atan2(b.vy, b.vx);
  for (let i = 0; i < 5; i++) {
    const pa = a + Math.PI + rand(-0.8, 0.8), sp = rand(80, 220);
    particles.push({ x: b.x, y: b.y, vx: Math.cos(pa) * sp, vy: Math.sin(pa) * sp, life: rand(0.2, 0.4), age: 0,
      size: rand(3, 5), color: Math.random() < .5 ? '#7a3b2e' : '#ffe08a', drag: 6 });
  }
  if (house.hp <= 0) destroyHouse();
}

// tamanho da bala do range (escala do sprite 16x16): revólver maior, chumbo da escopeta menor
const enemyBulletSize = b => (b.scale || RANGE.bulletScale) >= RANGE.bulletScale ? RANGE.bulletSize[0] : RANGE.bulletSize[1];
function drawEnemyBullets() { for (const b of enemyBullets) drawEnemyBullet(b); }
function drawEnemyBullet(b) {
  const im = RANGE_BULLET_IMG;
  if (im.complete) {
    const s = enemyBulletSize(b), r = 8 * s, pulse = 0.5 + 0.5 * Math.sin(clock * 12 + (b.seed || 0));
    // brilho vermelho em volta (aditivo), pulsando de leve
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(b.x, b.y, r * 0.4, b.x, b.y, r * (1.9 + 0.25 * pulse));
    g.addColorStop(0, `rgba(255,70,70,${0.5 + 0.15 * pulse})`); g.addColorStop(0.5, 'rgba(255,40,40,.18)'); g.addColorStop(1, 'rgba(255,40,40,0)');
    ctx.fillStyle = g; ctx.fillRect(b.x - r * 2.2, b.y - r * 2.2, r * 4.4, r * 4.4);
    ctx.restore();
    ctx.save(); ctx.translate(Math.round(b.x), Math.round(b.y)); ctx.rotate((b.seed || 0) + b.age * RANGE.bulletSpin);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(im, -r, -r, 16 * s, 16 * s);
    ctx.restore();
    return;
  }
  ctx.lineCap = 'round';
  {
    const s = b.scale || RANGE.bulletScale, a = Math.atan2(b.vy, b.vx);
    ctx.strokeStyle = 'rgba(255,255,255,.35)';
    ctx.lineWidth = s * 0.6;
    ctx.beginPath();
    ctx.moveTo(b.x - (b.x - (b.px ?? b.x)) * 2.5, b.y - (b.y - (b.py ?? b.y)) * 2.5);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
    ctx.save();
    ctx.translate(b.x, b.y); ctx.rotate(a);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(-1.5 * s, -0.5 * s, 3 * s, s);
    ctx.restore();
  }
}

function damageHouse(e) {
  if (gameOver) return;
  const dmg = biteOf(e);                            // básico 5, tank 20 (lua cheia: rusher 3)
  house.hp = Math.max(0, house.hp - dmg * houseDefMul());   // cabana reforçada absorve parte
  { const R = houseRect(); showHouseDamage(Math.max(R.l, Math.min(R.r, e.x)), Math.max(R.t, Math.min(R.b, e.y)) - 20, dmg * houseDefMul()); }
  house.flash = 0.08;
  house.shake = dmg > BITE_DAMAGE ? 2 : 1;          // mordida do tank sacode mais a casa
  house.pop = 1;
  e.lunge = 1;
  sfx.bite();
  cam.trauma = Math.min(1, cam.trauma + (dmg > BITE_DAMAGE ? 0.3 : 0.12));
  const R = houseRect();
  const px = Math.max(R.l, Math.min(R.r, e.x)), py = Math.max(R.t, Math.min(R.b, e.y));
  for (let i = 0; i < 6; i++) {    // lascas de madeira/tijolo
    const a = Math.atan2(e.y - py, e.x - px) + rand(-0.9, 0.9), sp = rand(80, 260);
    particles.push({ x: px, y: py, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(0.25, 0.5), age: 0,
      size: rand(3, 6), color: Math.random() < .5 ? '#7a3b2e' : '#4a2a20', drag: 5 });
  }
  if (e.hot) houseFire(px, py);        // dia quente: a mordida põe fogo na casa
  if (house.hp <= 0) destroyHouse();
}

function destroyHouse() {
  gameOver = true; mouse.down = false; sfx.setRain(0);
  sfx.houseDown();
  cam.trauma = 1;
  const R = houseRect();
  for (let i = 0; i < 60; i++) {
    const x = rand(R.l, R.r), y = rand(R.t - 30, R.b), a = rand(0, Math.PI * 2), sp = rand(80, 520);
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 120, life: rand(0.5, 1.2), age: 0,
      size: rand(4, 10), color: ['#7a3b2e', '#4a2a20', '#2f2f3a', '#9c5a3c'][i % 4], drag: 3 });
  }
  for (let i = 0; i < 10; i++)
    particles.push({ x: rand(R.l, R.r), y: rand(R.t, R.b), vx: rand(-30, 30), vy: rand(-60, -20), life: rand(0.8, 1.6), age: 0,
      size: rand(12, 22), grow: 30, color: 'smoke', drag: 1 });
}

function hurtPlayer(src) {
  if (player.invuln > 0 || gameOver) return;
  player.hp--;
  sfx.hurt();
  player.invuln = INVULN_TIME;
  player.hurt = 1;
  heartPop = 1;
  cam.trauma = Math.min(1, cam.trauma + 0.7);
  // empurra para longe de quem encostou
  const a = Math.atan2(player.y - src.y, player.x - src.x);
  player.vx = Math.cos(a) * CONTACT_KNOCKBACK;
  player.vy = Math.sin(a) * CONTACT_KNOCKBACK;
  for (let i = 0; i < 10; i++) {
    const pa = rand(0, Math.PI * 2), sp = rand(100, 300);
    particles.push({ x: player.x, y: player.y, vx: Math.cos(pa) * sp, vy: Math.sin(pa) * sp,
      life: rand(0.2, 0.4), age: 0, size: rand(3, 5), color: Math.random() < .5 ? '#ffffff' : '#e63946', drag: 6 });
  }
  if (player.hp <= 0) { gameOver = true; mouse.down = false; sfx.setRain(0); sfx.gameOver(); }
}

  if (m === 'test') {

  mines.length = 0; throwables.length = 0; ally.active = false;

  const S = Math.min(W / 112, H / 64), fw = 112 * S, fh = 64 * S;

    const y0 = barTop + barH / 2 - (lines.length - 1) * lh / 2;

  if (k === 'enter' && !paused && bill.active && bill.state === 'idle') {        // dispensa o Bill e segue o jogo

// =====================================================================
// Recarga: 1 cartucho por RELOAD_SHELL. Um toque no R recarrega até encher (ou acabar a reserva).
// =====================================================================
function canReload() {
  if (gameOver) return false;
  if (player.weapon !== 'shotgun') return player.mags[player.weapon] < magOf(player.weapon) && player[altRes(player.weapon)] > 0;
  return player.ammo < ammoMax() && player.reserve > 0;
}
function startReload() {
  if (player.reloading || !canReload()) {
    const noRes = player.weapon === 'shotgun' ? player.reserve === 0 && player.ammo < ammoMax() : player[altRes(player.weapon)] === 0;
    if (!canReload() && noRes) emptyFlash = 1;
    return;
  }
  player.reloading = true;
  player.reloadT = 0;
  sfx.reloadStart();
}
// recarga automática (Configurações): pente vazio e com reserva -> recarrega sozinho.
// Atirar interrompe (como na recarga manual); R continua funcionando com balas no pente.
function autoReload() {
  if (!settings.autoReload || player.reloading || gameOver || cut.on || shop.open || paused || player.meleeT >= 0) return;
  const id = player.weapon;
  const empty = id === 'shotgun' ? player.ammo === 0 && player.reserve > 0 : player.mags[id] === 0 && player[altRes(id)] > 0;
  if (empty) startReload();
}
function updateReload(dt) {
  if (!player.reloading) return;
  player.reloadT += dt;
  if (player.weapon !== 'shotgun') {                  // pente inteiro de uma vez
    if (player.reloadT >= altReloadTime()) {
      const id = player.weapon, take = Math.min(magOf(id) - player.mags[id], player[altRes(id)]);   // tira da reserva da arma
      player.mags[id] += take; player[altRes(id)] -= take;
      player.reloading = false; player.reloadT = 0; sfx.shellIn(); reservePop = 1;
    }
    return;
  }
  if (player.reloadT >= reloadShell() - 1e-6) {
    player.ammo++;
    player.reserve--;
    ammoPop[player.ammo - 1] = 1;
    sfx.shellIn();
    // cartucho entrando: faísca dourada na arma
    const h = hand();
    for (let i = 0; i < 3; i++)
      particles.push({ x: h.x + player.facing * 14, y: h.y - 10, vx: rand(-60, 60), vy: rand(-140, -60), life: 0.25, age: 0,
        size: 3, color: '#ffe08a', drag: 5 });
    player.reloadT = Math.max(0, player.reloadT - reloadShell());   // mantém o resto do tempo
    // continua sozinho até encher a escopeta ou acabar a reserva
    if (!canReload()) { player.reloading = false; player.reloadT = 0; }
  }
}

function banner(text, sub, color = '#f4f1de', dur = 2.4, big = false) { run.banner = { text, sub, color, t: 0, dur, big }; }

function startWave() {
  run.wave++;
  run.cfg = waveConfig(run.wave);
  run.toSpawn = run.cfg.count;
  run.tanksLeft = Math.min(run.cfg.tanks, run.cfg.count);
  run.rangesLeft = Math.min(run.cfg.ranges, run.cfg.count - run.tanksLeft);
  run.rushersLeft = Math.min(run.cfg.rushers, run.cfg.count - run.tanksLeft - run.rangesLeft);
  run.healersLeft = Math.min(run.cfg.healers, run.cfg.count - run.tanksLeft - run.rangesLeft - run.rushersLeft);
  run.spawnTimer = 0.3;
  run.phase = 'fight';
  const novo = NEW_ENEMY_AT[run.wave];
  const turn = isNightWave(run.wave) !== isNightWave(run.wave - 1) ? (isNightWave(run.wave) ? '   ·   A NOITE CAIU' : '   ·   AMANHECEU') : '';
  const rainNow = rainRoll();
  run.event = eventRoll();
  const faster = run.wave > 1 && (run.wave - 1) % 5 === 0 && run.wave <= 26 ? '   ·   JACARÉS MAIS RÁPIDOS' : '';
  if (run.event) {                                     // evento: só o tipo dele, quantidade ajustada
    const EV = EVENTS[run.event];
    run.toSpawn = Math.max(4, Math.round(run.cfg.count * EV.count));
    run.tanksLeft = run.rangesLeft = run.rushersLeft = run.healersLeft = 0;
    banner(EV.name, `wave ${run.wave}   ·   ${EV.sub}${rainNow ? '   ·   COMEÇOU A CHOVER' : ''}`, EV.color, 3.8, true);
    sfx.threat();
  } else {
    banner(`WAVE ${run.wave}`, `${run.cfg.count} jacarés${turn}${faster}${rainNow ? '   ·   COMEÇOU A CHOVER' : ''}`, isNightWave(run.wave) ? '#9db4ff' : '#e9c46a', novo ? 3.6 : 2.0, true);
    if (novo) { run.banner.threat = ENEMY_TYPES[novo]; sfx.threat(); }
  }
  sfx.waveStart();
  plantMines();
  spawnAntony();
}

function finishWave() {
  run.event = null;                    // o evento dura só 1 wave
  if (weather.on && --weather.left <= 0) { weather.on = false; weather.cool = RAIN.cooldown; }   // a chuva passa
  run.phase = 'cards';                 // jogo congela até escolher um upgrade
  run.phaseT = ROGUE.breakTime;
  openCards();
  const full = house.hp >= houseMax();
  vacuumTeeth();
  banner(`WAVE ${run.wave} COMPLETA`, full ? '+ munição' : '+ munição   + curativo da casa', '#7bd04a', 2.2);
  sfx.waveClear();
  // recompensas na frente da porta
  const R = houseRect(), y = Math.min(WORLD_H - 40, R.b + 70);
  spawnReward('ammo', house.x - 60, y);
  if (!full) spawnReward('heal', house.x + 60, y);
  if (has9mm()) spawnReward('ammo9', house.x - 175, y);                    // 9 mm (uzi e revólveres), se tiver uma delas
}

function startShopVisit() {
  run.phase = 'shop';
  run.phaseT = BILL.shopTime;
  billArrive();
}
function endShopVisit() {
  billLeave();
  run.phase = 'break';
  run.phaseT = ROGUE.breakTime + 1;
}
function updateWaves(dt) {
  if (run.banner && (run.banner.t += dt) > run.banner.dur) run.banner = null;
  if (gameOver || intro.on) return;                    // a horda só começa depois da abertura
  run.time += dt;
  if (run.phase === 'shop') {                 // visita do velho Bill: o tempo só corre com a loja fechada
    if (!cut.on && bill.state === 'idle' && (run.phaseT -= dt) <= 0) endShopVisit();
    return;
  }
  if (run.phase === 'break') {
    if ((run.phaseT -= dt) <= 0) startWave();
    return;
  }
  // fight: vai soltando os jacarés da wave
  if (run.toSpawn > 0 && (run.spawnTimer -= dt) <= 0) {
    const alive = enemies.filter(e => e.alive).length;
    const n = Math.min(run.cfg.group, run.toSpawn, ROGUE.maxEnemies - alive);
    for (let i = 0; i < n; i++) {
      // inimigos especiais saem misturados no meio dos básicos
      const special = run.tanksLeft + run.rangesLeft + run.rushersLeft + run.healersLeft;
      let type = 'basic';
      if (run.event) type = EVENTS[run.event].type();
      else if (special > 0 && Math.random() < special / (run.toSpawn - i)) {
        const r2 = Math.random() * special;
        const a1 = run.tanksLeft, a2 = a1 + run.rangesLeft, a3 = a2 + run.rushersLeft;
        type = r2 < a1 ? 'tank' : r2 < a2 ? 'range' : r2 < a3 ? 'rusher' : 'healer';
        if (type === 'tank') run.tanksLeft--; else if (type === 'range') run.rangesLeft--; else if (type === 'rusher') run.rushersLeft--; else run.healersLeft--;
      }
      spawnEdgeEnemy(run.cfg, type);
    }
    run.toSpawn -= n;
    run.spawnTimer = run.cfg.interval;
  }
  if (run.toSpawn === 0 && !enemies.some(e => e.alive)) finishWave();
}

// =====================================================================
// Dentes: a moeda do jogo. Caem dos jacarés no modo horda (os mais fortes soltam mais)
// =====================================================================
const TEETH = {
  drop: { basic: [0.25, 1, 1], tank: [1, 2, 3], range: [0.8, 1, 2], rusher: [0.25, 1, 1], healer: [0.9, 1, 2] },   // [chance, mín. e máx. de dentes]   // [chance, valor mínimo, valor máximo]: cada 5 vira um dente grande
  vacuum: 900,       // velocidade com que os dentes voam até o jogador no fim da wave
  magnet: 140,       // distância em que o dente voa até o jogador
  scale: 3,
};
const teeth = [];
let toothPop = 0;
// tipo do dente: quanto mais longe na partida, mais chance de dentes valiosos (5, prata 10, ouro 25)
function toothChances(w) {
  const p25 = Math.max(0, Math.min(0.03, (w - 15) * 0.005));   // ouro: a partir da wave 16, até 3%
  const p10 = Math.max(0, Math.min(0.08, (w - 8) * 0.01));     // prata: a partir da wave 9, até 8%
  const p5 = Math.min(0.2, 0.06 + w * 0.008);                  // grande: 7% na wave 1, até 20%
  return [[25, p25], [10, p10], [5, p5], [1, Math.max(0, 1 - p25 - p10 - p5)]];
}
function rollToothValue() {
  let r = Math.random();
  for (const [v, ch] of toothChances(run.wave)) { if (r < ch) return v; r -= ch; }
  return 1;
}
function dropTeeth(e) {
  if (mode !== 'rogue') return;
  const [chance, lo, hi] = TEETH.drop[e.T.id] || [0, 0, 0];
  // com mais jacarés por wave, cada um tem menos chance de soltar dente (a renda cresce devagar)
  if (Math.random() > Math.min(1, chance / (1 + 0.06 * Math.max(0, run.wave - 1)) + teethBonus())) return;
  const n = lo + Math.floor(Math.random() * (hi - lo + 1));
  for (let i = 0; i < n; i++)
    teeth.push({ x: e.x, y: e.y + e.T.h * e.T.sc / 2 - 6, z: 20, vx: rand(-110, 110), vy: rand(-50, 50), vz: rand(220, 320),
      age: 0, flip: Math.random() < 0.5, spin: rand(0, 6), fly: false, value: rollToothValue() });
}
// fim da wave: todos os dentes que sobraram no chão voam até o jogador (nenhum se perde)
function vacuumTeeth() {
  for (const t of teeth) { t.fly = true; t.vacuum = true; }
  if (teeth.length) sfx.select();
}
const magnetRange = () => TEETH.magnet * (1 + 0.6 * shop.lv.magnet);
function updateTeeth(dt) {
  toothPop *= Math.exp(-6 * dt);
  for (let i = teeth.length - 1; i >= 0; i--) {
    const t = teeth[i];
    t.age += dt;
    const dx = player.x - t.x, dy = player.y + 20 - t.y, dist = Math.hypot(dx, dy);
    if (!t.fly && t.age > 0.45 && dist < magnetRange() && player.hp > 0) t.fly = true;
    if (t.fly) {                                    // ímã: acelera até o jogador
      const sp = t.vacuum ? TEETH.vacuum + t.age * 120 : 260 + t.age * 60 + (magnetRange() - Math.min(dist, magnetRange())) * 4;
      t.x += dx / (dist || 1) * sp * dt; t.y += dy / (dist || 1) * sp * dt; t.z *= Math.exp(-8 * dt);
      if (dist < 26) {
        run.teeth += t.value; toothPop = 1; sfx.tooth();
        if (t.value > 1) particles.push({ x: t.x, y: t.y - 40, vx: 0, vy: -60, life: 0.8, age: 0, size: 0, color: 'text', text: `+${t.value}`, tint: TOOTH_TINT[t.value], drag: 1.5 });
        particles.push({ x: t.x, y: t.y - 10, vx: 0, vy: 0, life: 0.25, age: 0, size: 6, grow: 120, color: 'ring', drag: 0 });
        teeth.splice(i, 1);
      }
      continue;
    }
    // pulinho ao cair do jacaré, quica uma vez
    t.vz -= 900 * dt; t.z += t.vz * dt;
    if (t.z <= 0) { t.z = 0; t.vz = Math.abs(t.vz) > 80 ? -t.vz * 0.35 : 0; t.vx *= 0.5; t.vy *= 0.5; }
    const k = Math.exp(-(t.z > 0 ? 0.5 : 6) * dt);
    t.vx *= k; t.vy *= k;
    t.x += t.vx * dt; t.y += t.vy * dt;               // fica no chão até ser pego (não some mais)
  }
}
const TOOTH_GLOW = { 5: '255,240,200', 10: '210,225,255', 25: '255,210,80' };
const TOOTH_TINT = { 5: '#fff6d8', 10: '#dfe8ff', 25: '#ffd166' };
function drawTooth(t) {
  const im2 = toothCoinImgs[t.value];
  if (!im2.complete) return;
  const S = TEETH.scale, w = im2.width * S, h = im2.height * S, bob = t.z > 0 ? 0 : Math.sin(clock * 3 + t.spin) * 2;
  ctx.fillStyle = 'rgba(0,0,0,.25)';
  ctx.beginPath(); ctx.ellipse(t.x, t.y, 9, 3, 0, 0, Math.PI * 2); ctx.fill();
  ctx.save();
  ctx.translate(Math.round(t.x), Math.round(t.y - t.z - h / 2 - 2 + bob));
  if (t.flip) ctx.scale(-1, 1);
  if (t.value > 1 && !t.fly) {                       // dentes valiosos brilham (prata e ouro mais forte)
    const gl = TOOTH_GLOW[t.value];
    ctx.fillStyle = `rgba(${gl},${(t.value >= 10 ? 0.3 : 0.18) + Math.sin(clock * 5 + t.spin) * 0.08})`;
    ctx.beginPath(); ctx.arc(0, 0, w * (t.value >= 10 ? 1.2 : 0.9), 0, Math.PI * 2); ctx.fill();
  }
  ctx.drawImage(im2, -w / 2, -h / 2, w, h);
  ctx.restore();
}
// contador de dentes (canto inferior esquerdo, acima da barra da casa)
function drawTeethHud() {
  if (mode !== 'rogue' && !(mode === 'test' && (run.teeth > 0 || bill.active))) return;
  const S = 3, x = 14, y = canvas.height - (house.active ? 98 : 64), pop = 1 + toothPop * 0.35;
  if (toothImg.complete) {
    ctx.save(); ctx.translate(x + 24, y + 24); ctx.scale(pop, pop);
    ctx.drawImage(toothImg, -24, -24, 16 * S, 16 * S); ctx.restore();
  }
  ctx.font = 'bold 22px monospace';
  const txt = `${run.teeth}`;
  ctx.fillStyle = '#000'; ctx.fillText(txt, x + 56, y + 34);
  ctx.fillStyle = toothPop > 0.05 ? '#fff6d8' : '#f4f1de'; ctx.fillText(txt, x + 54, y + 32);
}

function billSay(text, dur = 3.5) { bill.talk = { text, shown: 0, t: 0, dur, blip: 0 }; }
// ponto onde ele para: carrinho encostado do lado direito da casa
const billSpotX = () => house.x + HOUSE_W * HOUSE_SCALE / 2 + BILL.spot.gap + CART.w * CART.sc + CART.gap * CART.sc + BILL.w * BILL.sc / 2;
function billArrive() {
  Object.assign(bill, { active: true, state: 'arrive', x: WORLD_W + 160, y: house.y + BILL.spot.dy, dir: -1, walk: 0, talk: null, laugh: 0 });
  bill.firstMeet = !billMet();
  shop.visit++; shop.bought = {};                     // nova visita: estoque renovado
  if (bill.firstMeet) { cut.on = true; cut.waitClick = false; }           // primeira vez: cutscene
  else banner('O VELHO BILL CHEGOU', 'chegue perto do carrinho e aperte E', '#c39bd3', 2.6);
  shop.open = false;
}
function billLeave() {
  if (!bill.active || bill.state === 'leave') return;
  bill.state = 'leave'; shop.open = false;
  // dá meia-volta (o carrinho passa para a frente dele) numa nuvem de poeira e sai pela direita
  const before = cartPos(); bill.dir = 1; const after = cartPos();
  for (const c of [before, after]) for (let i = 0; i < 10; i++)
    particles.push({ x: c.x + rand(-90, 90), y: c.y - rand(0, 60), vx: rand(-60, 60), vy: rand(-60, -10), life: rand(0.4, 0.7), age: 0, size: rand(6, 11), grow: 20, color: 'dust', drag: 3 });
  billSay(pick(BILL_BYE), 2.5);
}
// carrinho na frente dele (no sentido em que anda)
const cartPos = () => ({ x: bill.x + bill.dir * (BILL.w * BILL.sc / 2 + CART.gap * CART.sc + CART.w * CART.sc / 2), y: bill.y });
const nearCart = () => { const c = cartPos(); return bill.active && bill.state === 'idle' && Math.hypot(player.x - c.x, player.y - (c.y - 40)) < BILL.shopRange; };

// cercas na vaga/caminho do Bill abaixam enquanto ele está na área (no intervalo entre waves) e voltam quando ele vai embora
function updateFenceGates(dt) {
  const BZ = bill.active ? billZone() : null;
  for (const f of fences) {
    const g = !!BZ && cellHits(f.cx, f.cy, BZ, 0);
    if (f.gate && !g) for (let i = 0; i < 6; i++) particles.push({ x: f.x + rand(-24, 24), y: f.base + rand(-6, 4), vx: rand(-60, 60), vy: rand(-60, -10), life: rand(0.3, 0.5), age: 0, size: rand(5, 9), grow: 14, color: 'dust', drag: 3 });
    f.gate = g; f.gateK = Math.max(0, Math.min(1, (f.gateK || 0) + (g ? 1 : -1) * dt * 4));
  }
}
function updateBill(dt) {
  updateFenceGates(dt);
  cut.bars += ((cut.on ? 1 : 0) - cut.bars) * Math.min(1, dt * 6);
  if (!bill.active) return;
  const moving = bill.state === 'arrive' || bill.state === 'leave';
  if (bill.state === 'arrive') {
    const tx = billSpotX();
    const step = Math.min(BILL.runSpeed * dt, bill.x - tx);
    bill.x -= step; bill.walk += step;
    if (bill.x <= tx + 0.5) {
      bill.state = 'idle';
      if (bill.firstMeet) { billSay(BILL_FIRST_LINE, Infinity); cut.waitClick = true; }
      else billSay(pick(BILL_HELLO));
    }
  } else if (bill.state === 'leave') {
    bill.x += BILL.leaveSpeed * dt; bill.walk += BILL.leaveSpeed * dt;
    if (bill.x > WORLD_W + 260) { bill.active = false; bill.talk = null; }
  }
  if (moving && (bill.dustT -= dt) <= 0) {                  // poeira dos pés e das rodas
    bill.dustT = 0.07;
    const c = cartPos();
    for (const px of [bill.x - bill.dir * 12, c.x - 60, c.x + 60])
      particles.push({ x: px + rand(-6, 6), y: bill.y + rand(-2, 2), vx: -bill.dir * rand(20, 60), vy: rand(-25, -5),
        life: rand(0.3, 0.45), age: 0, size: rand(4, 7), grow: 14, color: 'dust', drag: 3 });
  }

  // fala com efeito de máquina de escrever
  const tk = bill.talk;
  if (tk) {
    const before = Math.floor(tk.shown);
    tk.shown = Math.min(tk.text.length, tk.shown + BILL.textSpeed * dt);
    if (Math.floor(tk.shown) > before && Math.floor(tk.shown) % 2 === 0 && tk.text[Math.floor(tk.shown) - 1] !== ' ') sfx.talk();
    const typed = tk.text.slice(0, Math.floor(tk.shown));
    const li = tk.text.lastIndexOf('hehe');            // risada: pula enquanto digita o "hehehe" e logo depois
    const laughing = li >= 0 && typed.length > li && (tk.shown < tk.text.length || tk.t < 0.8);
    bill.laugh = laughing ? 1 : bill.laugh * Math.exp(-4 * dt);
    if (tk.shown >= tk.text.length && (tk.t += dt) > tk.dur) bill.talk = null;
  } else bill.laugh *= Math.exp(-4 * dt);
}
