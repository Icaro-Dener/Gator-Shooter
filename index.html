// Abertura do modo horda: o jacaré sai de dentro da casa e reclama dos vizinhos
// =====================================================================
const INTRO = { line: 'os vizinhos não me dão um dia de folga', walkSpeed: 0.42, wait: 0.5, textSpeed: 30 };
const intro = { on: false, state: '', t: 0, talk: null };
function startIntro() {
  Object.assign(intro, { on: true, state: 'inside', t: 0, talk: null });
  cut.on = true; cut.waitClick = false;
  player.y = houseRect().b - 40;                         // começa atrás da parede da frente (escondido pela casa)
  intro.targetY = houseRect().b + player.h / 2 + 24;     // para na frente da porta
}
function updateIntro(dt) {
  if (!intro.on) return;
  intro.t += dt;
  if (intro.state === 'inside' && intro.t > INTRO.wait) { intro.state = 'walk'; sfx.select(); }
  else if (intro.state === 'walk' && player.y >= intro.targetY) {
    player.y = intro.targetY; intro.state = 'talk'; intro.t = 0;
    intro.talk = { text: INTRO.line, shown: 0 };
    cut.waitClick = true;
  } else if (intro.state === 'talk') {
    const tk = intro.talk, before = Math.floor(tk.shown);
    tk.shown = Math.min(tk.text.length, tk.shown + INTRO.textSpeed * dt);
    if (Math.floor(tk.shown) > before && Math.floor(tk.shown) % 2 === 0 && tk.text[Math.floor(tk.shown) - 1] !== ' ') sfx.hover();
  }
}
// clique / E: pula a caminhada, completa o texto ou termina a abertura
function introAdvance() {
  if (intro.state !== 'talk') {
    player.y = intro.targetY; intro.state = 'talk'; intro.t = 0;
    intro.talk = { text: INTRO.line, shown: INTRO.line.length }; cut.waitClick = true;
    return;
  }
  if (intro.talk.shown < intro.talk.text.length) { intro.talk.shown = intro.talk.text.length; return; }
  intro.on = false; cut.on = false; cut.waitClick = false; intro.talk = null;
  banner('DEFENDA SUA CASA', 'os jacarés vão atrás dela — não deixe ela cair!', '#e9c46a', 3.4, true);
  run.banner.intro = true;
  tips.t = 0;
  sfx.select();
}
function drawIntro() {
  if (!intro.on) return;
  const W = canvas.width, H = canvas.height, tk = intro.talk;
  if (tk && tk.shown > 0) {
    const head = toScreen(player.x, player.y - player.h / 2 - 16);
    ctx.font = 'bold 16px monospace';
    const lines = wrapLines(tk.text, Math.min(380, W - 60));
    const lh = 20, pad = 12, bw = Math.max(...lines.map(l => ctx.measureText(l).width)) + pad * 2, bh = lines.length * lh + pad * 2 - 4;
    const bx = Math.max(10, Math.min(W - bw - 10, head.x - bw / 2)), by = Math.max(cut.bars * H * 0.09 + 30, head.y - bh - 14);
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(bx + 4, by + 5, bw, bh);
    ctx.fillStyle = '#fff6e0'; ctx.fillRect(bx, by, bw, bh);
    ctx.strokeStyle = '#1b1410'; ctx.lineWidth = 3; ctx.strokeRect(bx, by, bw, bh);
    const tx = Math.max(bx + 14, Math.min(bx + bw - 14, head.x));
    ctx.fillStyle = '#fff6e0'; ctx.beginPath(); ctx.moveTo(tx - 9, by + bh - 2); ctx.lineTo(tx + 9, by + bh - 2); ctx.lineTo(tx, by + bh + 12); ctx.fill();
    ctx.strokeStyle = '#1b1410'; ctx.beginPath(); ctx.moveTo(tx - 9, by + bh + 1); ctx.lineTo(tx, by + bh + 12); ctx.lineTo(tx + 9, by + bh + 1); ctx.stroke();
    ctx.font = 'bold 16px monospace'; ctx.fillStyle = '#2a1d16';
    let left = Math.floor(tk.shown);
    lines.forEach((l, i) => { const part = l.slice(0, Math.max(0, left)); left -= l.length + 1; ctx.fillText(part, bx + pad, by + pad + 13 + i * lh); });
    if (tk.shown >= tk.text.length && Math.floor(clock * 3) % 2) {
      ctx.beginPath(); ctx.moveTo(bx + bw - 18, by + bh - 12); ctx.lineTo(bx + bw - 8, by + bh - 12); ctx.lineTo(bx + bw - 13, by + bh - 6); ctx.fill();
    }
  }
  ctx.font = 'bold 13px monospace'; ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(244,241,222,.8)';
  ctx.fillText(intro.state === 'talk' ? 'clique ou aperte E para continuar' : 'clique ou aperte E para pular', W / 2, H - H * 0.09 * cut.bars / 2 + 5);
  ctx.textAlign = 'left';
}

// avança a cutscene (clique, E, Enter ou espaço)
function cutAdvance() {
  if (intro.on) return introAdvance();
  if (!cut.on || !cut.waitClick || !bill.talk) return;
  if (bill.talk.shown < bill.talk.text.length) { bill.talk.shown = bill.talk.text.length; return; }
  cut.on = false; cut.waitClick = false; bill.talk.dur = 1.2; bill.talk.t = 0;
  setBillMet(true);
  banner('LOJA DO VELHO BILL', 'chegue perto do carrinho e aperte E', '#c39bd3', 2.8);
  sfx.select();
}

// desenho: corpo + pernas (como os jacarés), carrinho na frente e a mão segurando o carrinho
const billFrames = {};
function billFrame(name) {
  if (billFrames[name]) return billFrames[name];
  if (!billBodyImg.complete || !billLegImgs[0].complete || !billLegImgs[1].complete) return null;
  const c = document.createElement('canvas'); c.width = BILL.w; c.height = BILL.h + 1;
  const g = c.getContext('2d');
  g.drawImage(billBodyImg, 0, name === 'pass' ? 0 : 1);
  g.drawImage(name === 'pass' ? billLegImgs[0] : billLegImgs[1], BILL.legOffset.x, BILL.legOffset.y + 1);   // pernas na frente do rabo
  return (billFrames[name] = c);
}
// pixel do sprite (olhando para a esquerda) -> mundo
function billPoint(px, py) {
  const S = BILL.sc, w = BILL.w * S, h = (BILL.h + 1) * S;
  const lx = -w / 2 + px * S;
  return { x: bill.x + (bill.dir === 1 ? -lx : lx), y: bill.y - h + py * S + billBob() };
}
const billBob = () => -Math.abs(Math.sin(clock * 22)) * 4 * bill.laugh;     // pulinhos da risada
function drawBill() {
  const moving = bill.state === 'arrive' || bill.state === 'leave';
  const name = moving ? (Math.floor(bill.walk / BILL.stepLen) % 2 ? 'pass' : 'step') : 'stand';
  const fr = billFrame(name === 'stand' ? 'step' : name);
  const S = BILL.sc, w = BILL.w * S, h = (BILL.h + 1) * S, c = cartPos(), cw = CART.w * CART.sc, ch = CART.h * CART.sc;
  // sombras
  ctx.fillStyle = 'rgba(0,0,0,.28)';
  ctx.beginPath(); ctx.ellipse(bill.x, bill.y - 2, w * 0.33, 6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(c.x, c.y - 2, cw * 0.45, 8, 0, 0, Math.PI * 2); ctx.fill();
  // Bill (inclina para a frente correndo)
  if (fr) {
    ctx.save();
    ctx.translate(Math.round(bill.x), Math.round(bill.y + billBob()));
    ctx.rotate(moving ? bill.dir * 0.08 : 0);
    ctx.scale(bill.dir === 1 ? -1 : 1, 1);
    ctx.drawImage(fr, -w / 2, -h, w, h);
    ctx.restore();
  }
  // carrinho (rodas giram andando)
  const cf = cartImgs[moving ? Math.floor(bill.walk / 18) % 2 : 0];
  if (cf.complete) {
    if (!cut.on && !shop.open && nearCart()) {        // perto: contorno branco pulsando (dá para abrir a loja)
      const wcf = tintOf(cf, '#ffffff'), o = 4, cx0 = Math.round(c.x - cw / 2), cy0 = Math.round(c.y - ch + 2 * CART.sc);
      ctx.globalAlpha = 0.75 + 0.25 * Math.sin(clock * 6);
      for (const [dx, dy] of [[-o, 0], [o, 0], [0, -o], [0, o]]) ctx.drawImage(wcf, cx0 + dx, cy0 + dy, cw, ch);
      ctx.globalAlpha = 1;
    }
    ctx.drawImage(cf, Math.round(c.x - cw / 2), Math.round(c.y - ch + 2 * CART.sc), cw, ch);
  }
  // gancho enganchado no alto da lateral do carrinho (por cima dele)
  if (billHookImg.complete) {
    ctx.save();
    ctx.translate(Math.round(bill.x), Math.round(bill.y + billBob()));
    ctx.scale(bill.dir === 1 ? -1 : 1, 1);
    ctx.drawImage(billHookImg, -w / 2 - 7 * S, -h + 2 * S, billHookImg.width * S, billHookImg.height * S);
    ctx.restore();
  }
  // mão segurando a lateral do carrinho
  if (billHandImg.complete) {
    const hx = c.x - bill.dir * (cw / 2 - 0.5 * S), hy = bill.y - 9.5 * S + billBob() * 0.5;
    ctx.drawImage(billHandImg, Math.round(hx - billHandImg.width * S / 2), Math.round(hy - billHandImg.height * S / 2), billHandImg.width * S, billHandImg.height * S);
  }
}

// balão de fala, "[E] LOJA" e faixas pretas da cutscene (coordenadas de tela)
const toScreen = (x, y) => ({ x: (x - cam.x - cam.sx) * ZOOM, y: (y - cam.y - cam.sy) * ZOOM });
function wrapLines(text, maxW) {
  const words = text.split(' '), lines = []; let line = '';
  for (const w of words) { const t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; }
  if (line) lines.push(line);
  return lines;
}
function drawBillOverlay() {
  const W = canvas.width, H = canvas.height;
  if (cut.bars > 0.01) {                                      // faixas de cinema
    const bh = Math.round(H * 0.09 * cut.bars);
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, bh); ctx.fillRect(0, H - bh, W, bh);
  }
  if (!bill.active) return;
  const head = toScreen(bill.x, bill.y - (BILL.h + 1) * BILL.sc - 14);
  // balão
  const tk = bill.talk;
  if (tk && tk.shown > 0) {
    ctx.font = 'bold 16px monospace';
    const lines = wrapLines(tk.text, Math.min(380, W - 60));
    // mede com o texto inteiro (o balão não muda de tamanho enquanto digita)
    const lh = 20, pad = 12, bw = Math.max(...lines.map(l => ctx.measureText(l).width)) + pad * 2, bh = lines.length * lh + pad * 2 - 4;
    const bx = Math.max(10, Math.min(W - bw - 10, head.x - bw / 2)), by = Math.max(cut.bars * H * 0.09 + 30, head.y - bh - 14);
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(bx + 4, by + 5, bw, bh);
    ctx.fillStyle = '#fff6e0'; ctx.fillRect(bx, by, bw, bh);
    ctx.strokeStyle = '#1b1410'; ctx.lineWidth = 3; ctx.strokeRect(bx, by, bw, bh);
    const tx = Math.max(bx + 14, Math.min(bx + bw - 14, head.x));      // rabinho apontando para o Bill
    ctx.fillStyle = '#fff6e0'; ctx.beginPath(); ctx.moveTo(tx - 9, by + bh - 2); ctx.lineTo(tx + 9, by + bh - 2); ctx.lineTo(tx, by + bh + 12); ctx.fill();
    ctx.strokeStyle = '#1b1410'; ctx.beginPath(); ctx.moveTo(tx - 9, by + bh + 1); ctx.lineTo(tx, by + bh + 12); ctx.lineTo(tx + 9, by + bh + 1); ctx.stroke();
    // nome
    ctx.font = 'bold 12px monospace';
    ctx.fillStyle = '#000'; ctx.fillText('VELHO BILL', bx + 1, by - 5);
    ctx.fillStyle = '#c39bd3'; ctx.fillText('VELHO BILL', bx, by - 6);
    // texto digitando
    ctx.font = 'bold 16px monospace';
    let left = Math.floor(tk.shown);
    ctx.fillStyle = '#2a1d16';
    lines.forEach((l, i) => { const part = l.slice(0, Math.max(0, left)); left -= l.length + 1; ctx.fillText(part, bx + pad, by + pad + 13 + i * lh); });
    if (cut.on && cut.waitClick && tk.shown >= tk.text.length && Math.floor(clock * 3) % 2) {
      ctx.fillStyle = '#2a1d16'; ctx.beginPath();
      ctx.moveTo(bx + bw - 18, by + bh - 12); ctx.lineTo(bx + bw - 8, by + bh - 12); ctx.lineTo(bx + bw - 13, by + bh - 6); ctx.fill();
    }
  }
  if (cut.on && cut.waitClick) {
    ctx.font = 'bold 13px monospace'; ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(244,241,222,.8)'; ctx.fillText('clique ou aperte E para continuar', W / 2, H - H * 0.09 * cut.bars / 2 + 5);
    ctx.textAlign = 'left';
  }
  // prompt da loja
  if (!cut.on && !shop.open && nearCart()) {
    const c = cartPos(), q = toScreen(c.x, c.y - CART.h * CART.sc - 10);
    const yb = q.y + Math.sin(clock * 4) * 4;
    ctx.font = 'bold 20px monospace'; ctx.textAlign = 'center';   // só a tecla E, numa teclinha
    ctx.fillStyle = '#000'; ctx.fillRect(q.x - 17, yb - 21, 34, 34);
    ctx.fillStyle = '#f4f1de'; ctx.fillRect(q.x - 15, yb - 19, 30, 30);
    ctx.fillStyle = '#bdb7a4'; ctx.fillRect(q.x - 15, yb + 7, 30, 4);
    ctx.fillStyle = '#10170f'; ctx.fillText('E', q.x, yb + 3);
    ctx.textAlign = 'left';
  }
}

    const count = [0, 0, 0, 0]; for (const m of mines) count[sideOf(m)]++;
    const side = count.indexOf(Math.min(...count));

      const x = house.x + Math.cos(a) * d, y = house.y + Math.sin(a) * d * 0.8;

  ctx.save(); ctx.beginPath(); ctx.rect(r.area.x - 8, r.area.y, r.area.w + 16, r.area.h); ctx.clip();
  for (const c of r.cards) drawShopCard(c);
  ctx.restore();
  for (const a of r.arrows) {                         // setas de rolagem (tábuas)
    const hl = hoveredIn([a]) === a && !a.off;
    woodBox(a.x, a.y, a.w, a.h, a.off ? 0.6 : hl ? 0 : 0.3, 2, a.off ? 0 : hl ? 0.8 : 0.6);
    const cx = a.x + a.w / 2, cy = a.y + a.h / 2, s2 = 10;
    ctx.fillStyle = a.off ? 'rgba(40,20,10,.35)' : '#2a1208'; ctx.beginPath();
    ctx.moveTo(cx + a.d * s2, cy); ctx.lineTo(cx - a.d * s2 * 0.7, cy - s2 * 1.3); ctx.lineTo(cx - a.d * s2 * 0.7, cy + s2 * 1.3); ctx.closePath(); ctx.fill();
  }
  if (r.arrows.length) {                              // bolinhas: quais itens estão à mostra
    const n = r.n, dot = 10, gp = 6, x0 = r.area.x + r.area.w / 2 - (n * (dot + gp) - gp) / 2, y0 = r.bottom + 14;
    for (let k = 0; k < n; k++) {
      const on = k >= shop.scroll && k < shop.scroll + SHOP_VISIBLE;
      ctx.fillStyle = on ? '#ffe8c2' : 'rgba(20,8,4,.6)'; ctx.fillRect(x0 + k * (dot + gp), y0, dot, dot);
      ctx.strokeStyle = '#140804'; ctx.lineWidth = 2; ctx.strokeRect(x0 + k * (dot + gp), y0, dot, dot);
    }
  }
  shopText('1/2/3 abas  ·  ←/→ ou roda do mouse rolam  ·  4 reabastece  ·  5 cura a casa', r.rx, r.py + r.ph - 24, '15px monospace', '#ffe8c2');
  ctx.restore();
}

// =====================================================================
// Cartas de upgrade (1 de 3) — aparecem ao fim de cada wave
// =====================================================================
const cards = { list: [], t: 0, picked: -1, pickT: 0 };
function openCards() {
  const pool = UPGRADES.filter(u => !u.max || lv[u.id] < u.max);   // cartas no nível máximo não aparecem mais
  cards.list = [];
  for (let i = 0; i < 3; i++) cards.list.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
  cards.t = 0; cards.picked = -1; cards.pickT = 0;
  mouse.down = false;
}
function cardRects() {
  const n = 3, gap = 18;
  const w = Math.min(260, (canvas.width - 40 - gap * 2) / 3), h = Math.min(340, w * 1.3, canvas.height - 150);
  const x0 = (canvas.width - (w * n + gap * (n - 1))) / 2, y = canvas.height / 2 - h / 2 + 20;
  return cards.list.map((u, i) => ({ u, i, x: x0 + i * (w + gap), y, w, h }));
}
function pickCard(i) {
  if (cards.picked >= 0 || !cards.list[i] || cards.t < 0.35) return;   // pequena trava contra clique acidental
  cards.picked = i; cards.pickT = 0;
  const u = cards.list[i];
  const oldMax = houseMax();
  lv[u.id]++;
  if (u.id === 'houseHp') house.hp += houseMax() - oldMax;       // a vida extra já vem cheia
  statFlash[u.id] = 1;
  sfx.upgrade();
}
function updateCards(dt) {
  cards.t += dt;
  if (cards.picked >= 0 && (cards.pickT += dt) > 0.45) {          // animação da escolha e volta ao jogo
    cards.list = [];
    if (cards.returnTo) { run.phase = cards.returnTo; cards.returnTo = null; if (run.phase === 'shop' || mode === 'test') openShop(); }
    else if (mode === 'rogue' && run.wave % BILL.every === 0) startShopVisit();   // depois das waves 5, 10...: o velho Bill
    else run.phase = 'break';
  }
}

// =====================================================================
// Melee
// =====================================================================
function startMelee() {
  player.meleeT = 0;
  player.meleeCd = meleeCooldown();
  player.meleeAngle = player.aim;
  player.meleeHit = false;
  player.reloading = false; player.reloadT = 0;   // golpe cancela a recarga
  sfx.swing();
}

function meleeStrike() {
  player.meleeHit = true;
  const h = hand(), a = player.meleeAngle;
  let hits = 0;
  for (const e of enemies) {
    if (!e.alive) continue;
    const dx = e.x - h.x, dy = e.y - h.y, dist = Math.hypot(dx, dy);
    let diff = Math.atan2(dy, dx) - a;
    diff = Math.atan2(Math.sin(diff), Math.cos(diff));
    const reach = meleeRange() + e.T.hitbox.w * e.T.sc / 2;
    if (dist < reach && (Math.abs(diff) < MELEE_ARC / 2 || dist < e.T.hitbox.w * e.T.sc)) {
      hits++;
      const ang = Math.atan2(dy, dx);
      const kb = meleeKnock() * Math.min(1, e.T.knockMul * 2);   // a faca empurra pesados o dobro que o tiro (tank: 60%)
      if (!e.homeRel) { e.x += Math.cos(ang) * kb; e.y += Math.sin(ang) * kb; }
      hitEnemy(e, { x: e.x - Math.cos(ang) * 20, y: e.y - Math.sin(ang) * 20 }, ang, meleeDamage());
    }
  }
  // faíscas do corte ao longo do arco
  for (let i = 0; i < 20; i++) {
    const t = a + rand(-MELEE_ARC / 2, MELEE_ARC / 2), r = rand(40, meleeRange());
    particles.push({ x: h.x + Math.cos(t) * r, y: h.y + Math.sin(t) * r, vx: Math.cos(t) * 80, vy: Math.sin(t) * 80,
      life: rand(0.1, 0.22), age: 0, size: rand(2, 4), color: '#ffffff', drag: 8 });
  }
  if (hits) { sfx.slash(); cam.trauma = Math.min(1, cam.trauma + 0.12); }
}

function updateMelee(dt) {
  const wasCooling = player.meleeCd > 0;
  player.meleeCd = Math.max(0, player.meleeCd - dt);
  if (wasCooling && player.meleeCd === 0) { player.meleeReadyPop = 1; sfx.meleeReady(); }
  player.meleeReadyPop *= Math.exp(-5 * dt);
  if (build.on && mouse.rightPressed) { build.on = false; mouse.rightPressed = false; sfx.hover(); }   // botão direito sai do modo cerca
  if (build.on && mouse.pressed) { placeFenceAtMouse(); mouse.pressed = false; mouse.down = false; }
  if (mouse.rightPressed && !gameOver && !cut.on) { const h = nearHat(); if (h) { pickHat(h); mouse.rightPressed = false; } }   // chapéu no chão: o botão direito pega
  if (mouse.rightPressed && player.meleeCd <= 0 && player.meleeT < 0 && !gameOver && !cut.on) startMelee();
  mouse.rightPressed = false;
  if (player.meleeT >= 0) {
    player.meleeT += dt;
    if (!player.meleeHit && player.meleeT >= MELEE_HIT_AT) meleeStrike();
    if (player.meleeT >= MELEE_FRAME * 3) player.meleeT = -1;
  }
}

// =====================================================================
// Update
// =====================================================================
function update(dt) {
  // constrói o mapa quando os tiles carregam
  if (!map.ready && sandSet.complete && grassSet.complete) buildMap();
  if (!map.ready) return;

  clock += dt; windClock += dt * (1 + (RAIN.windSpeed - 1) * windK());
  updateCamera(dt);
  const nt = nightTarget();
  if (nt !== nightPrev) {                       // começou a anoitecer / amanhecer
    if (mode !== 'menu') playDayNight(nt ? 'night' : 'day');
    nightPrev = nt;
  }
  nightK += Math.sign(nt - nightK) * Math.min(Math.abs(nt - nightK), dt / NIGHT.fade);
  if (mode === 'menu') {
    updateTrees(dt);
    if (story.open) { updateStory(dt); return; }
    if (setUI.open) { updateSettings(); return; }
    hoverSfx(menuButtons(), 'menu:');
    if (mouse.pressed) { const b = hoveredButton(); if (b) { if (b.id === 'story') openStory(); else if (b.id === 'settings') openSettings(); else startMode(b.id); } }
    mouse.pressed = false;
    return;
  }
  if (paused) {                       // tudo congelado; só os botões da pausa respondem
    if (setUI.open) { updateSettings(); mouse.rightPressed = false; mouse.down = false; return; }
    hoverSfx(pauseButtons(), 'pause:');
    if (mouse.pressed) { const b = hoveredIn(pauseButtons()); if (b) pauseAction(b.id); }
    mouse.pressed = false; mouse.rightPressed = false; mouse.down = false;
    return;
  }
  for (const k in statFlash) statFlash[k] = Math.max(0, statFlash[k] - dt * 0.8);
  if (shop.open) { updateShop(dt); return; }            // loja aberta: jogo congelado
  if (run.phase === 'cards' && (mode === 'rogue' || cards.list.length)) {   // escolhendo upgrade: jogo congelado
    updateCards(dt);
    if (cards.picked < 0 && cards.t > 0.3) hoverSfx(cardRects(), 'card:'); else lastHover = null;
    if (mouse.pressed) { const c = hoveredIn(cardRects()); if (c) pickCard(c.i); }
    mouse.pressed = false; mouse.rightPressed = false; mouse.down = false;
    updateTrees(dt);
    return;
  }

  // movimento
  let dx = 0, dy = 0;
  const locked = cut.on;                          // cutscene: jogador parado
  if (locked && mouse.pressed) { cutAdvance(); mouse.pressed = false; }
  if (locked) mouse.down = false;
  if (keys.has('a')) dx -= 1;
  if (keys.has('d')) dx += 1;
  if (keys.has('w')) dy -= 1;
  if (keys.has('s')) dy += 1;
  if (locked) { dx = 0; dy = 0; }
  const introWalk = intro.on && intro.state === 'walk';
  if (introWalk) dy = 1;                          // abertura: sai pela porta andando
  const len = Math.hypot(dx, dy);
  if (len > 0) { dx /= len; dy /= len; }
  if (gameOver) { dx = 0; dy = 0; }

  // corrida
  player.running = keys.has('shift') && len > 0 && !gameOver;
  if (player.running && (player.dustT -= dt) <= 0) {      // poeirinha saindo dos pés
    player.dustT = RUN.dustEvery;
    particles.push({ x: player.x - dx * 18 + rand(-8, 8), y: player.y + 34 + rand(-3, 3), vx: -dx * rand(30, 70) + rand(-20, 20),
      vy: rand(-25, -5), life: rand(0.3, 0.45), age: 0, size: rand(4, 7), grow: 14, color: 'dust', drag: 3 });
  }
  player.zapT = Math.max(0, (player.zapT || 0) - dt);
  if (player.zapT > 0 && Math.random() < 0.3) particles.push({ x: player.x + rand(-18, 18), y: player.y + rand(-30, 10), vx: rand(-60, 60), vy: rand(-80, -20), life: 0.2, age: 0, size: rand(2, 4), color: Math.random() < 0.5 ? '#ffffff' : '#bfe6ff', drag: 4 });   // faíscas do raio
  const spd = (introWalk ? SPEED * INTRO.walkSpeed : SPEED * (player.running ? RUN.mul : 1) * moveMul()) * (player.zapT > 0 ? 0.4 : 1);

  const kd = Math.exp(-12 * dt);           // knockback some rápido
  player.vx *= kd; player.vy *= kd;
  const prevX = player.x, prevY = player.y;
  // chão molhado: a velocidade demora a mudar (escorrega)
  const wantX = dx * spd, wantY = dy * spd;
  if (weather.k > 0.01 && !introWalk) {
    const a = Math.min(1, dt * (RAIN.slip + (1 - weather.k) * 60));
    player.svx = (player.svx || 0) + (wantX - (player.svx || 0)) * a; player.svy = (player.svy || 0) + (wantY - (player.svy || 0)) * a;
  } else { player.svx = wantX; player.svy = wantY; }
  player.x += (player.svx + player.vx) * dt;
  player.y += (player.svy + player.vy) * dt;
  player.x = Math.max(player.w / 2, Math.min(WORLD_W - player.w / 2, player.x));
  player.y = Math.max(player.h / 2, Math.min(WORLD_H - player.h / 2, player.y));
  if (!intro.on) pushOutOfHouse(player, PLAYER_HITBOX.w * SCALE / 2, PLAYER_HITBOX.h * SCALE / 2);
  updateIntro(dt);
  updateWalk(dt, len > 0, Math.hypot(player.x - prevX, player.y - prevY), dx);

  // mira
  const mw = mouseWorld(), h = hand();
  player.aim = Math.atan2(mw.y - h.y, mw.x - h.x);
  if (intro.on) player.aim = 0.35;                // na abertura olha para a frente, arma abaixada
  if (FACE_MOUSE) player.facing = Math.cos(player.aim) < 0 ? -1 : 1;
  else if (dx !== 0) player.facing = dx;

  // tiro
  player.cooldown -= dt;
  updateMelee(dt);
  if (mouse.down && !build.on && player.cooldown <= 0 && !gameOver && player.meleeT < 0 && !(player.zapT > 0)) {
    if (player.weapon !== 'shotgun') fireAlt();
    else if (player.ammo > 0) {
      player.reloading = false;      // atirar cancela a recarga (o cartucho em andamento não conta)
      shoot();
      player.ammo--;
      ammoPop[player.ammo] = 1;
      player.cooldown = shotCooldown();
    } else if (mouse.pressed && !player.reloading) {
      // sem munição: "clique seco" — HUD pisca e a arma dá um tranquinho
      emptyFlash = 1;
      sfx.dry();
      player.kick = 0.8;
      player.cooldown = 0.15;
    }
  }
  mouse.pressed = false;
  autoReload();
  updateReload(dt);
  updatePickups(dt);
  updateTeeth(dt);
  updateHats(dt); updateEventFx(dt); rodFx.flash = Math.max(0, rodFx.flash - dt * 2.5); player.hatPop = (player.hatPop || 0) * Math.exp(-5 * dt);
  updateBill(dt);
  updateWeather(dt);
  updateCombatExtras(dt);
  tips.t += dt; if (player.running) tips.usedRun = true; if (player.meleeT >= 0) tips.usedMelee = true;
  updateTufts(dt);
  updateTrees(dt);
  updateTrainingAmmo(dt);
  updateDev();
  reservePop *= Math.exp(-6 * dt);

  // roguelike: waves
  if (mode === 'rogue') updateWaves(dt);
  updateEnemyBullets(dt);
  house.heal = Math.max(0, (house.heal || 0) - dt * 1.5);

  // inimigos: perseguem (speed > 0) ou ficam parados; dano por contato
  for (const e of enemies) {
    const ox = (e.T.hitbox.w * e.T.sc + PLAYER_HITBOX.w * SCALE) / 2;
    const oy = (e.T.hitbox.h * e.T.sc + PLAYER_HITBOX.h * SCALE) / 2;
    e.flash -= dt;
    // piscar de vez em quando (só quem tem sprite de olho fechado)
    if (e.T.blink) {
      if (e.blinkT > 0) e.blinkT -= dt;
      else if ((e.blinkNext -= dt) <= 0) { e.blinkT = e.T.blinkDur || ENEMY_BLINK.dur; e.blinkNext = rand(...(e.T.blinkEvery || ENEMY_BLINK.every)); }
    }
    e.jiggle *= Math.exp(-12 * dt);
    e.hpShow -= dt;
    if (e.healGlow) e.healGlow *= Math.exp(-4 * dt);
    if (e.shieldT > 0) { e.shieldT -= dt; e.shieldHit = (e.shieldHit || 0) * Math.exp(-10 * dt); }
    if (!e.alive) {
      if (e.homeRel && (e.respawn -= dt) <= 0) {   // inimigo do campo de treino reaparece
        Object.assign(e, { alive: true, hp: e.maxHp, flash: 0.15, hpShow: 0 });
        particles.push({ x: e.x, y: e.y, vx: 0, vy: 0, life: 0.3, age: 0, size: 60, grow: -180, color: 'ring', drag: 0 });
      }
      continue;
    }
    e.lunge *= Math.exp(-10 * dt);
    if (e.hot && Math.random() < dt * 7) particles.push({ x: e.x + rand(-16, 16), y: e.y + rand(-24, 4), vx: rand(-20, 20), vy: rand(-110, -60), life: rand(0.3, 0.6), age: 0, size: rand(2, 4), color: Math.random() < 0.5 ? '#ff9f1c' : '#ffd166', drag: 2 });
    e.recoil = (e.recoil || 0) * Math.exp(-12 * dt);
    e.recoilB = (e.recoilB || 0) * Math.exp(-12 * dt);
    if (e.burnT > 0) {                        // pegando fogo (pimenta): dano contínuo
      e.burnT -= dt;
      if ((e.burnTick = (e.burnTick || 0) - dt) <= 0) {
        e.burnTick = 0.25; e.hp -= FIRE.dps * 0.25; e.hpShow = 2;
        particles.push({ x: e.x + rand(-14, 14), y: e.y + rand(-20, 10), vx: rand(-15, 15), vy: rand(-90, -50), life: rand(0.3, 0.5), age: 0,
          size: rand(3, 5), color: Math.random() < 0.5 ? '#ff9f1c' : '#ffd166', drag: 2 });
        if (e.hp <= 0) { killEnemy(e); continue; }
      }
    }
    if (e.scare) { updateScare(e, dt); continue; }
    if (e.frozenT > 0) { e.frozenT -= dt; e.attacking = false; continue; }   // congelado: não anda, não morde, não atira
    if (e.T.healer) { if (!gameOver) updateHealer(e, dt); continue; }
    if (e.T.ranged && house.active) { if (!gameOver) updateRanged(e, dt); continue; }
    if (e.speed > 0 && !gameOver) {
      // alvo: o ponto mais próximo da casa (roguelike) ou o jogador
      let tx = player.x, ty = player.y;
      if (house.active) {
        const R = houseRect();
        tx = Math.max(R.l, Math.min(R.r, e.x)); ty = Math.max(R.t, Math.min(R.b, e.y));
      }
      e.onAlly = ally.active && Math.hypot(ally.x - e.x, ally.y - e.y) < ANTONY.aggro;   // o primo Antony atrai quem passa perto
      if (e.onAlly) { tx = ally.x; ty = ally.y; }
      const ddx = tx - e.x, ddy = ty - e.y, dist = Math.hypot(ddx, ddy) || 1;
      if (Math.abs(ddx) > 4) e.facing = ddx < 0 ? -1 : 1;
      if (!e.attacking) {
        const sp = e.speed * (1 + RAIN.enemySpeed * weather.k);   // na chuva andam mais rápido
        e.x += ddx / dist * sp * dt;
        e.y += ddy / dist * sp * dt;
        e.walk += dt * sp;                 // distância andada (avança as pernas)
      }
      e.dirX = ddx / dist; e.dirY = ddy / dist;
    }
    if (e.onAlly && allyTouch(e)) {                 // mordendo o Antony
      e.attacking = true;
      if (!gameOver && (e.bite -= dt) <= 0) { e.bite = e.T.biteEvery || BITE_EVERY; e.lunge = 1; sfx.bite(); damageAlly(biteOf(e) * (e.hot ? HOT.bite : 1)); }
    } else if (fenceBlock(e, dt)) {
      // cerca no caminho: para e morde a cerca até quebrar
    } else if (house.active) {
      // encostou na casa: para e morde
      const hw = e.T.hitbox.w * e.T.sc / 2, hh = e.T.hitbox.h * e.T.sc / 2;
      e.attacking = pushOutOfHouse(e, hw + 1, hh + 1) || (() => {
        const R = houseRect();
        return e.x > R.l - hw - 3 && e.x < R.r + hw + 3 && e.y > R.t - hh - 3 && e.y < R.b + hh + 3;
      })();
      if (e.attacking && !gameOver && (e.bite -= dt) <= 0) { e.bite = e.T.biteEvery || BITE_EVERY; damageHouse(e); }
    } else if (Math.abs(player.x - e.x) < ox && Math.abs(player.y - e.y) < oy) hurtPlayer(e);
  }
  // separação simples para não empilharem
  for (let i = 0; i < enemies.length; i++) {
    const a = enemies[i]; if (!a.alive || a.homeRel) continue;
    for (let j = i + 1; j < enemies.length; j++) {
      const b = enemies[j]; if (!b.alive || b.homeRel) continue;
      const minD = (a.T.hitbox.w * a.T.sc + b.T.hitbox.w * b.T.sc) / 2 * 0.9;
      const ddx = b.x - a.x, ddy = b.y - a.y, d = Math.hypot(ddx, ddy);
      if (d > 0 && d < minD) {
        // o mais pesado empurra mais (o tank abre caminho entre os básicos)
        const ma = a.T.knockMul, mb = b.T.knockMul, push = minD - d, nx = ddx / d, ny = ddy / d;
        const fa = ma / (ma + mb), fb = mb / (ma + mb);
        a.x -= nx * push * fa; a.y -= ny * push * fa; b.x += nx * push * fb; b.y += ny * push * fb;
      }
    }
  }
  if (house.active) for (const e of enemies) if (e.alive) pushOutOfHouse(e, e.T.hitbox.w * e.T.sc / 2, e.T.hitbox.h * e.T.sc / 2);
  house.flash -= dt;
  house.shake *= Math.exp(-10 * dt);
  house.pop *= Math.exp(-5 * dt);

  // remove mortos que não reaparecem
  for (let i = enemies.length - 1; i >= 0; i--) if (!enemies[i].alive && !enemies[i].homeRel) enemies.splice(i, 1);

  player.invuln -= dt;
  player.hurt *= Math.exp(-8 * dt);
  heartPop *= Math.exp(-6 * dt);

  emptyFlash *= Math.exp(-6 * dt);
  for (let i = 0; i < AMMO_CAP; i++) ammoPop[i] *= Math.exp(-10 * dt);

  // recuperação do recuo / efeitos
  const rk = Math.exp(-14 * dt);
  player.kick *= rk; player.kickRot *= rk;
  for (let i = 0; i < 2; i++) { player.gunKick[i] *= Math.exp(-16 * dt); player.gunRot[i] *= Math.exp(-16 * dt); }
  player.flash -= dt;
  crossPulse *= Math.exp(-9 * dt);
  cam.trauma = Math.max(0, cam.trauma - dt * 3.5);
  const shake = cam.trauma * cam.trauma * 14 * SHAKE_SCALE * settings.shake;   // amplitude máxima ~4 px (x ajuste do jogador)
  cam.sx = rand(-1, 1) * shake; cam.sy = rand(-1, 1) * shake;

  // projéteis
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.age += dt;
    b.px = b.x; b.py = b.y;
    const d = Math.exp(-SHOT.drag * dt);
    b.vx *= d; b.vy *= d;
    b.x += b.vx * dt; b.y += b.vy * dt;
    const ang = Math.atan2(b.vy, b.vx);
    const out = b.x < 0 || b.y < 0 || b.x > WORLD_W || b.y > WORLD_H;
    // testa o ponto atual e o meio do passo (projéteis rápidos não atravessam o inimigo)
    const mx = (b.x + b.px) / 2, my = (b.y + b.py) / 2;
    const pad = b.pad ?? SHOT.bulletScale * (bulletMul() - 1) * 1.5;   // balas maiores acertam um pouco mais longe
    const target = enemies.find(e => e.alive && !b.hits.includes(e) && (inEnemy(e, b.x, b.y, pad) || inEnemy(e, mx, my, pad)));
    if (target) {
      // atravessa: acerta este jacaré e segue em frente, um pouco mais fraco e mais lento
      if (b.fire) ignite(target);
      hitEnemy(target, b, ang, (b.dmg ?? pelletDamage()) * b.dmgMul);
      b.hits.push(target);
      b.dmgMul *= SHOT.pierceFalloff;
      b.vx *= 0.85; b.vy *= 0.85;
      if (b.hits.length >= (b.pierce ?? SHOT.pierce) || target.T.id === 'tank') bullets.splice(i, 1);   // o tank segura a bala (não atravessa)
    } else if (out) {
      impact(Math.max(0, Math.min(WORLD_W, b.x)), Math.max(0, Math.min(WORLD_H, b.y)), ang, true);
      bullets.splice(i, 1);
    } else if (b.age >= b.life) {
      impact(b.x, b.y, ang, false);
      bullets.splice(i, 1);
    }
  }

  // partículas
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.age += dt;
    if (p.age >= p.life) { particles.splice(i, 1); continue; }
    const d = Math.exp(-(p.drag || 0) * dt);
    p.vx *= d; p.vy *= d;
    if (p.gravity) p.vy += p.gravity * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.grow) p.size += p.grow * dt;
    if (p.rot !== undefined) p.rot += p.vr * dt;
    if (p.floor !== undefined && p.y > p.floor && p.vy > 0) {   // quique da cápsula
      if (Math.abs(p.vy) > 120) sfx.shell();
      p.y = p.floor; p.vy *= -0.35; p.vx *= 0.6; p.vr *= 0.5;
      if (Math.abs(p.vy) < 40) { p.vy = 0; p.gravity = 0; p.drag = 10; }
    }
  }
}

// =====================================================================
// Render
// =====================================================================
// =====================================================================
// Tufos de grama: vento + dobram quando alguém passa (mola amortecida)
// =====================================================================
// =====================================================================
// Árvores: vento na copa, folhas caindo e tremida quando um jacaré sai
// =====================================================================
function shakeTree(t, dir) {
  t.vel += (dir || (Math.random() < 0.5 ? -1 : 1)) * TREE.shakeImpulse;
  t.cool = TREE.shakeCooldown;
  for (let i = 0; i < 5; i++) dropLeaf(t, true);
}

function dropLeaf(t, burst = false) {
  const S = TREE.scale, w = 48 * S;
  const left = t.x - TREE.trunkX * S;
  const x = left + rand(0.12, 0.88) * w, y = t.baseY - (TREE.baseRow - rand(4, 22)) * S;
  leaves.push({ x, y, vx: burst ? rand(-70, 70) : rand(-12, 12), vy: burst ? rand(-60, 10) : rand(15, 30),
    ph: rand(0, 6.28), sw: rand(18, 34), floor: t.baseY + rand(-6, 26), age: 0, landed: 0,
    size: Math.random() < 0.6 ? 2 : 1, color: LEAF_COLORS[Math.floor(Math.random() * LEAF_COLORS.length)] });
}

function updateTrees(dt) {
  for (const t of trees) {
    // jacaré andando passa pela árvore (tronco ou embaixo da copa) -> ela balança
    if ((t.cool -= dt) <= 0) {
      const S = TREE.scale;
      for (const e of enemies) {
        if (!e.alive || e.speed <= 0) continue;
        const feet = e.y + e.T.h * e.T.sc / 2;
        if (Math.abs(e.x - t.x) < 16 * S && feet > t.baseY - 26 * S && feet < t.baseY + 6 * S) {
          shakeTree(t, e.x < t.x ? 1 : -1);   // balança para o lado contrário de quem passou
          sfx.rustle();
          break;
        }
      }
    }
    // mola amortecida: a tremida vai sumindo
    t.vel += (-t.sway * 60 - t.vel * 5) * dt;
    t.sway += t.vel * dt;
    if ((t.leafT -= dt) <= 0) { t.leafT = rand(...TREE.leafEvery); if (t.side === 'top' || Math.random() < 0.6) dropLeaf(t); }
  }
  for (let i = leaves.length - 1; i >= 0; i--) {
    const l = leaves[i];
    l.age += dt;
    if (l.landed > 0) { if ((l.landed += dt) > 2.5) leaves.splice(i, 1); continue; }
    l.vx *= Math.exp(-2 * dt);
    l.vy += (40 - l.vy) * Math.min(1, dt * 2);          // cai devagar (resistência do ar)
    l.x += (l.vx + Math.cos(l.age * 3 + l.ph) * l.sw) * dt;   // vai e volta enquanto cai
    l.y += l.vy * dt;
    if (l.y >= l.floor) { l.y = l.floor; l.landed = 0.001; }
    if (l.age > 12) leaves.splice(i, 1);
  }
}

function drawTree(t) {
  if (!treeImg.complete) return;
  const S = TREE.scale;
  const wind = Math.sin(windClock * 1.1 + t.phase) * 0.6 + Math.sin(windClock * 0.47 + t.x * 0.01) * 0.4;
  const wk = 1 + (RAIN.wind - 1) * windK();                              // chuva/ventania: balança muito mais e deita para a esquerda
  const sway = wind * TREE.windAmp * wk - RAIN.lean * windK() + t.sway;
  const x0 = Math.round(t.x - TREE.trunkX * S), y0 = Math.round(t.baseY - TREE.baseRow * S);
  // sombra
  ctx.fillStyle = 'rgba(0,0,0,.22)';
  ctx.beginPath(); ctx.ellipse(t.x, t.baseY, 15 * S, 3 * S, 0, 0, Math.PI * 2); ctx.fill();
  // em faixas: a copa desliza mais em cima, o tronco não mexe
  if (t.flip) { ctx.save(); ctx.translate(2 * x0 + 48 * S, 0); ctx.scale(-1, 1); }
  for (let r = 0; r < 48; r += TREE.slice) {
    const n = Math.min(TREE.slice, 48 - r);
    let off = 0;
    if (r < TREE.canopyRows) off = Math.round(sway * (0.35 + 0.65 * Math.pow(1 - r / TREE.canopyRows, 1.2)));
    ctx.drawImage(treeImg, 0, r, 48, n, x0 + (t.flip ? -off : off), y0 + r * S, 48 * S, n * S);
  }
  if (t.flip) ctx.restore();
}

// =====================================================================
// Iluminação: sombra da mata nas bordas, sol na clareira, raios, luzes dinâmicas e vagalumes
// =====================================================================
const lightCanvas = document.createElement('canvas');
const lightCtx = lightCanvas.getContext('2d');
const shadeCache = document.createElement('canvas');   // sombra estática (recalculada só ao mudar o tamanho)

function buildLightCache() {
  const W = WORLD_W, H = WORLD_H, [r, g, b] = LIGHT.shade;
  shadeCache.width = W;
  shadeCache.height = H;
  const c = shadeCache.getContext('2d');
  c.clearRect(0, 0, W, H);
  // radial: clara no meio, escura perto das árvores (elíptica, acompanha a tela)
  const R = Math.max(W, H) * 0.62;
  c.save();
  c.translate(W / 2, H / 2);
  c.scale(W / Math.max(W, H), H / Math.max(W, H));
  const gr = c.createRadialGradient(0, 0, R * 0.42, 0, 0, R);
  gr.addColorStop(0, `rgba(${r},${g},${b},0)`);
  gr.addColorStop(0.45, `rgba(${r},${g},${b},${LIGHT.edgeDark * 0.35})`);
  gr.addColorStop(1, `rgba(${r},${g},${b},${LIGHT.edgeDark})`);
  c.fillStyle = gr;
  c.fillRect(-R * 2, -R * 2, R * 4, R * 4);
  c.restore();
  // faixa extra embaixo das copas (topo e base da tela)
  const top = c.createLinearGradient(0, 0, 0, 140);
  top.addColorStop(0, `rgba(${r},${g},${b},0.35)`); top.addColorStop(1, `rgba(${r},${g},${b},0)`);
  c.fillStyle = top; c.fillRect(0, 0, W, 140);
  const bot = c.createLinearGradient(0, H, 0, H - 90);
  bot.addColorStop(0, `rgba(${r},${g},${b},0.3)`); bot.addColorStop(1, `rgba(${r},${g},${b},0)`);
  c.fillStyle = bot; c.fillRect(0, H - 90, W, 90);
}

// abre um "buraco" de luz na sombra
function punchLight(x, y, radius, strength) {
  const g = lightCtx.createRadialGradient(x, y, 0, x, y, radius);
  g.addColorStop(0, `rgba(0,0,0,${strength})`);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  lightCtx.fillStyle = g;
  lightCtx.fillRect(x - radius, y - radius, radius * 2, radius * 2);
}

function fireflyPos(f) {
  return { x: f.bx + Math.sin(clock * f.sx + f.ph) * f.ax + Math.sin(clock * f.sx * 2.3 + f.ph * 2) * 10,
           y: f.by + Math.cos(clock * f.sy + f.ph) * f.ay + Math.sin(clock * 1.7 + f.ph) * 4 };
}
// pisca devagar e às vezes "apaga" (curva pontuda)
const fireflyGlow = f => Math.pow(Math.max(0, Math.sin(clock * f.blink + f.ph)), 3) * (f.night ? nightK : 1);

function drawLighting() {
  if (!WORLD_W) return;
  // 1) sombra: recorte da sombra estática só na área visível, com luzes recortadas
  const lw = Math.ceil(viewW()) + 4, lh = Math.ceil(viewH()) + 4;
  if (lightCanvas.width !== lw || lightCanvas.height !== lh) { lightCanvas.width = lw; lightCanvas.height = lh; }
  const ox = Math.floor(cam.x + cam.sx) - 2, oy = Math.floor(cam.y + cam.sy) - 2;
  lightCtx.setTransform(1, 0, 0, 1, 0, 0);
  lightCtx.globalCompositeOperation = 'source-over';
  lightCtx.clearRect(0, 0, lw, lh);
  lightCtx.drawImage(shadeCache, -ox, -oy);
  if (nightK > 0) {                                        // noite: escuridão azulada por cima de tudo
    const [r, g, b] = NIGHT.color;
    lightCtx.fillStyle = `rgba(${r},${g},${b},${NIGHT.dark * nightK})`;
    lightCtx.fillRect(0, 0, lw, lh);
  }
  lightCtx.translate(-ox, -oy);
  lightCtx.globalCompositeOperation = 'destination-out';
  const nk = nightK;
  if (mode !== 'menu' && player.hp > 0)
    punchLight(player.x, player.y, 150 + (NIGHT.playerR - 150) * nk, LIGHT.playerLight + (NIGHT.playerLight - LIGHT.playerLight) * nk);
  if (nk > 0.01) {
    punchLight(WORLD_W / 2, WORLD_H / 2 - 70, SAND_R * 1.55, NIGHT.moon * nk);             // luar de cima clareando a clareira
    const sk = 1 / Math.sqrt(Math.max(1, bullets.length / 2));                                   // vários chumbos juntos não estouram a luz
    for (const b of bullets) punchLight(b.x, b.y, NIGHT.shotR, NIGHT.shotLight * nk * sk);     // os tiros iluminam o caminho
    for (const b of enemyBullets) punchLight(b.x, b.y, 50 + enemyBulletSize(b) * 18, 0.65 * nk);   // bala do range brilha no escuro
    if (houseLit()) for (const q of houseWindowPts()) punchLight(q.x, q.y + 20, 110, 0.75 * nk);   // luz das janelas
    for (const e of enemies) if (e.alive && e.T.healer) { const q = healerTorch(e); punchLight(q.x, q.y, 150, 0.8 * nk); }   // chama verde do healer
    if (bill.active) { const c = cartPos(); punchLight(c.x, c.y - 70, 190, 0.7 * nk); punchLight(bill.x, bill.y - 40, 110, 0.5 * nk); }
  }
  if (player.flash > 0) {                                  // clarão do tiro ilumina em volta
    const m = muzzlePos(), k = player.flash / 0.07;
    punchLight(m.x, m.y, 260, 0.9 * k);
  }
  for (const f of fireflies) { const gl = fireflyGlow(f); if (gl < 0.02) continue; const q = fireflyPos(f); punchLight(q.x, q.y, 34 + 26 * nk, (0.5 + 0.3 * nk) * gl); }
  for (const p of particles) if (p.color === 'ring' && p.size > 20) punchLight(p.x, p.y, p.size * 1.2, 0.35 * (1 - p.age / p.life));
  ctx.drawImage(lightCanvas, ox, oy);

  // 2) luz quente da clareira + raios de sol (aditivo, bem sutil)
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const cx = WORLD_W / 2, cy = WORLD_H / 2, R = SAND_R * 1.35;
  const pulse = 1 + Math.sin(clock * 0.4) * 0.12, dayK = 1 - nightK;
  const sun = ctx.createRadialGradient(cx, cy - R * 0.15, 0, cx, cy, R);
  sun.addColorStop(0, `rgba(255,225,150,${LIGHT.sun * pulse * dayK})`);
  sun.addColorStop(1, 'rgba(255,225,150,0)');
  ctx.fillStyle = sun;
  ctx.fillRect(cx - R, cy - R, R * 2, R * 2);
  // raios diagonais vindos de cima à esquerda, oscilando devagar
  for (let i = 0; i < 4; i++) {
    const a = dayK * LIGHT.rays * (0.6 + 0.4 * Math.sin(clock * (0.25 + i * 0.07) + i * 2));
    const x = cx - R * 0.9 + i * R * 0.5 + Math.sin(clock * 0.15 + i) * 20, w = 26 + i * 9;
    const g = ctx.createLinearGradient(x, 0, x + WORLD_H * 0.45, WORLD_H);
    g.addColorStop(0, `rgba(255,240,190,${a})`);
    g.addColorStop(0.7, `rgba(255,240,190,${a * 0.4})`);
    g.addColorStop(1, 'rgba(255,240,190,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(x, 0); ctx.lineTo(x + w, 0);
    ctx.lineTo(x + w + WORLD_H * 0.45, WORLD_H); ctx.lineTo(x + WORLD_H * 0.45, WORLD_H);
    ctx.fill();
  }
  if (nightK > 0.01) {
    // luar frio bem fraco na clareira
    const moon = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * 1.3);
    moon.addColorStop(0, `rgba(120,150,235,${0.09 * nightK})`); moon.addColorStop(1, 'rgba(110,140,230,0)');
    ctx.fillStyle = moon; ctx.fillRect(cx - R * 1.3, cy - R * 1.3, R * 2.6, R * 2.6);
    // luz amarelada: janelas, tiros e clarão da escopeta
    const [wr, wg, wb] = NIGHT.warm;
    const warm = (x, y, r, a) => {
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, `rgba(${wr},${wg},${wb},${a})`); g.addColorStop(1, `rgba(${wr},${wg},${wb},0)`);
      ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
    };
    if (houseLit()) for (const q of houseWindowPts()) {
      const flick = 0.9 + Math.sin(clock * 7 + q.x) * 0.05 + Math.sin(clock * 13 + q.y) * 0.05;
      warm(q.x, q.y + 10, 95, 0.36 * nightK * flick);
    }
    const sk = 1 / Math.sqrt(Math.max(1, bullets.length / 2));
    for (const b of bullets) warm(b.x, b.y, NIGHT.shotR, NIGHT.shotWarm * nightK * sk);
    for (const b of enemyBullets) warm(b.x, b.y, NIGHT.shotR, NIGHT.shotWarm * 1.5 * nightK);
    if (player.flash > 0) { const m = muzzlePos(); warm(m.x, m.y, 200, 0.18 * nightK * player.flash / 0.07); }
    if (bill.active) { const c = cartPos(); warm(c.x, c.y - 80, 150, 0.22 * nightK); }
  }
  ctx.restore();
}

function drawFireflies() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const f of fireflies) {
    const g = fireflyGlow(f);
    if (g < 0.02) continue;
    const q = fireflyPos(f);
    const halo = ctx.createRadialGradient(q.x, q.y, 0, q.x, q.y, 14);
    halo.addColorStop(0, `rgba(210,255,120,${0.45 * g})`);
    halo.addColorStop(1, 'rgba(210,255,120,0)');
    ctx.fillStyle = halo;
    ctx.fillRect(q.x - 14, q.y - 14, 28, 28);
    ctx.fillStyle = `rgba(240,255,170,${0.9 * g})`;
    ctx.fillRect(Math.round(q.x) - 2, Math.round(q.y) - 2, 4, 4);   // miolo em pixel
  }
  ctx.restore();
}

function drawLeaves(landed) {
  const S = TREE.scale;
  for (const l of leaves) {
    if ((l.landed > 0) !== landed) continue;
    ctx.globalAlpha = l.landed > 0 ? Math.max(0, 1 - (l.landed - 1.5)) : 1;
    ctx.fillStyle = l.color;
    const w = (l.size === 2 ? 2 : 1) * S, h = S;
    // folha "virando" enquanto cai: alterna a largura
    const flipW = l.landed > 0 ? w : Math.max(S, Math.round(w * Math.abs(Math.cos(l.age * 5 + l.ph))));
    ctx.fillRect(Math.round(l.x - flipW / 2), Math.round(l.y), flipW, h);
  }
  ctx.globalAlpha = 1;
}

function updateTufts(dt) {
  const bodies = [];
  if (mode !== 'menu' && player.hp > 0) bodies.push({ x: player.x, y: player.y + player.h / 2 - 6, moving: true });
  for (const e of enemies) if (e.alive) bodies.push({ x: e.x, y: e.y + e.T.h * e.T.sc / 2 - 6 });
  for (const t of tufts) {
    let push = 0, near = false;
    for (const b of bodies) {
      const dx = t.x - b.x, dy = (t.y - b.y) * 1.6, dist = Math.hypot(dx, dy);
      if (dist < TUFT.pushRadius) {
        near = true;
        push += Math.sign(dx || 1) * TUFT.pushForce * (1 - dist / TUFT.pushRadius) * 1.6;
      }
    }
    if (near && !t.touched) {   // folhinhas ao entrar no tufo
      for (let i = 0; i < 2; i++)
        particles.push({ x: t.x + rand(-8, 8), y: t.y - rand(10, 24), vx: rand(-50, 50), vy: rand(-90, -40), life: rand(0.3, 0.5),
          age: 0, size: 3, color: Math.random() < .5 ? '#7bd04a' : '#4f9a3c', gravity: 300, drag: 3 });
    }
    t.touched = near;
    // mola: puxa para a posição empurrada (ou 0) e oscila um pouco ao soltar
    const target = Math.max(-TUFT.pushForce, Math.min(TUFT.pushForce, push));
    t.vel += ((target - t.bend) * 90 - t.vel * 9) * dt;
    t.bend += t.vel * dt;
  }
}

// quadros do tufo já inclinados, em cache (1 drawImage por tufo em vez de 1 por linha)
const tuftCache = new Map();
const TUFT_PAD = 16;                 // folga lateral (px de tela) para a inclinação
function tuftFrame(im, flip, swayQ) {
  const key = (im === tuftBigImg ? 'b' : 's') + (flip ? 'f' : '') + swayQ;
  let c = tuftCache.get(key);
  if (c) return c;
  const S = TUFT.scale, w = im.width, h = im.height, sway = swayQ / 2;
  c = document.createElement('canvas'); c.width = w * S + TUFT_PAD * 2; c.height = h * S;
  const g = c.getContext('2d'); g.imageSmoothingEnabled = false;
  // linha a linha: o topo se desloca mais que a base (base fica presa no chão)
  for (let r = 0; r < h; r++) {
    const off = Math.round(sway * Math.pow(1 - r / h, 1.6));
    if (flip) {
      g.save(); g.translate(TUFT_PAD + w * S + off, 0); g.scale(-1, 1);
      g.drawImage(im, 0, r, w, 1, 0, r * S, w * S, S);
      g.restore();
    } else g.drawImage(im, 0, r, w, 1, TUFT_PAD + off, r * S, w * S, S);
  }
  tuftCache.set(key, c);
  return c;
}
function drawTuft(t) {
  const im = t.big ? tuftBigImg : tuftSmallImg;
  if (!im.complete) return;
  const S = TUFT.scale, w = im.width, h = im.height;
  // vento: onda que atravessa a tela + rajadas lentas
  const wind = Math.sin(windClock * 1.7 + t.x * 0.011 + t.phase * 0.3) * 0.65
             + Math.sin(windClock * 0.53 + t.x * 0.004) * 0.35;
  const wk = 1 + (RAIN.wind - 1) * windK();
  const sway = Math.max(-TUFT_PAD, Math.min(TUFT_PAD, (wind * TUFT.windAmp * wk - RAIN.lean * windK()) * (t.big ? 1.2 : 0.8) + t.bend));
  const x0 = Math.round(t.x - (w * S) / 2), y0 = Math.round(t.y - h * S);
  ctx.drawImage(tuftFrame(im, t.flip, Math.round(sway * 2)), x0 - TUFT_PAD, y0);
}

function drawGun() {
  if (player.meleeT >= 0) {
    // golpe de faca: 3 frames do GIF, apontado para onde o golpe começou
    const f = meleeImgs[Math.min(2, Math.floor(player.meleeT / MELEE_FRAME))];
    if (!f.complete) return;
    const h = hand(), a = player.meleeAngle;
    ctx.save();
    ctx.translate(Math.round(h.x + Math.cos(a) * 2 * SCALE), Math.round(h.y + Math.sin(a) * 2 * SCALE));
    ctx.rotate(a);
    if (Math.cos(a) < 0) ctx.scale(1, -1);
    const ms = MELEE_SCALE * meleeRangeMul();   // faca cresce junto com o alcance
    ctx.drawImage(f, -MELEE_GRIP.x * ms, -MELEE_GRIP.y * ms, MELEE_W * ms, MELEE_H * ms);
    ctx.restore();
    return;
  }
  if (player.reloading && player.weapon === 'shotgun') {
    // pose de recarga: arma de lado, inclinada para cima, animação do GIF (frame 1 -> 2)
    const f = reloadImgs[player.reloadT < reloadShell() / 2 ? 0 : 1];
    if (!f.complete) return;
    const h = hand();
    ctx.save();
    ctx.translate(Math.round(h.x + player.facing * 8), Math.round(h.y - 2));
    ctx.scale(player.facing, 1);
    ctx.rotate(-0.35 + Math.sin(player.reloadT / reloadShell() * Math.PI) * 0.08);
    ctx.drawImage(f, -RELOAD_GRIP.x * SCALE, -RELOAD_GRIP.y * SCALE, RELOAD_W * SCALE, RELOAD_H * SCALE);
    ctx.restore();
    return;
  }
  const G = gunSpec();
  if (G.img.complete === false) return;
  const g = gunTransform();
  ctx.save();
  ctx.translate(Math.round(g.x), Math.round(g.y));
  ctx.rotate(player.reloading ? (g.flip > 0 ? -1.1 : Math.PI + 1.1) : g.rot);   // recarregando: arma apontada para cima
  if (g.flip < 0) ctx.scale(1, -1);  // mirando à esquerda: não fica de cabeça para baixo
  if (isDual(player.weapon) && !player.reloading) {
    // duas armas (revólveres ou duas uzis): cada uma recua e levanta sozinha quando atira.
    // Desenha primeiro a de fora (mais à frente) e por último a mais perto do corpo, que fica por cima.
    for (const i of [1, 0]) {
      ctx.save();
      ctx.translate((i ? dualSpacing(player.weapon) : 0) * SCALE - player.gunKick[i] * SCALE, i ? dualDrop(player.weapon) * SCALE : 0);
      ctx.rotate(-player.gunRot[i]);
      ctx.drawImage(G.img, -G.grip.x * SCALE, -G.grip.y * SCALE, G.w * SCALE, G.h * SCALE);
      ctx.restore();
    }
  } else {
    if (isDual(player.weapon))         // recarregando: as duas juntas apontadas para cima (a de fora primeiro)
      ctx.drawImage(G.img, (-G.grip.x + dualSpacing(player.weapon)) * SCALE, -G.grip.y * SCALE + dualDrop(player.weapon) * SCALE, G.w * SCALE, G.h * SCALE);
    ctx.drawImage(G.img, -G.grip.x * SCALE, -G.grip.y * SCALE, G.w * SCALE, G.h * SCALE);
  }

}

function drawMuzzleFlash() {
  if (player.flash <= 0) return;
  const m = muzzlePos(), a = player.flashAngle, k = player.flash / 0.07;
  ctx.save();
  ctx.translate(m.x, m.y); ctx.rotate(a);

// =====================================================================
// Caminhada: passo aberto -> pernas juntas (corpo sobe) -> passo aberto -> ...
// =====================================================================
function updateWalk(dt, input, moved, dx) {
  const walking = input && !gameOver && moved > SPEED * dt * 0.3;   // andando de verdade (não preso na parede)
  player.moveX += ((walking ? dx : 0) - player.moveX) * Math.min(1, dt * 12);
  if (walking) {
    if (!player.walking) player.walkDist = WALK.stepLen;  // começa já no passo aberto
    player.walkDist += moved;
    const frame = Math.floor(player.walkDist / WALK.stepLen) % 2 === 1 ? 'step' : 'pass';
    if (frame === 'step' && player.walkFrame !== 'step') footstep();
    player.walkFrame = frame;
    player.idleT = 0;
  } else {
    if (player.walking) player.walkFrame = 'stand';
    player.idleT += dt;
    // parado: pernas abertas, respirando (corpo sobe 1 px de vez em quando)
    player.walkFrame = Math.sin(player.idleT * 2.4) > 0.55 ? 'breath' : 'stand';
  }
  player.walking = walking;
  updateBlink(dt);
}

// piscadas: de vez em quando (3-7 s), às vezes duas seguidas
function updateBlink(dt) {
  if (player.blinkT > 0) { player.blinkT -= dt; return; }
  if ((player.blinkNext -= dt) > 0) return;
  player.blinkT = BLINK.dur;
  if (player.blinkAgain) {                       // esta é a segunda da dupla
    player.blinkAgain = false;
    player.blinkNext = rand(...BLINK.every);
  } else if (Math.random() < BLINK.doubleChance) {
    player.blinkAgain = true;
    player.blinkNext = BLINK.dur + 0.12;         // segunda piscada logo em seguida
  } else {
    player.blinkNext = rand(...BLINK.every);
  }
}

function footstep() {
  sfx.step();
  if (!WALK.dust) return;
  const fx = player.x + rand(-10, 10), fy = player.y + player.h / 2 - 4;
  for (let i = 0; i < 2; i++)
    particles.push({ x: fx, y: fy, vx: rand(-40, 40) - player.moveX * 30, vy: rand(-30, -8), life: rand(0.25, 0.4), age: 0,
      size: rand(3, 5), grow: 10, color: 'dust', drag: 4 });
}

function drawPlayer() {
  const px = Math.round(player.x), py = Math.round(player.y);
  ctx.fillStyle = 'rgba(0,0,0,.28)';
  ctx.beginPath();
  ctx.ellipse(px, py + player.h / 2 - 2, player.w * 0.35, 6, 0, 0, Math.PI * 2);
  ctx.fill();
  const fr = walkFrame(player.walkFrame, player.blinkT > 0);
  if (!fr) return;
  ctx.save();
  ctx.translate(px, py + player.h / 2);                 // pivô nos pés: inclina sem tirar os pés do chão
  ctx.rotate(player.moveX * WALK.tilt);
  if (player.facing !== SPRITE_FACES) ctx.scale(-1, 1);
  // invencível: pisca; logo após o dano: fica branco
  if (player.invuln > 0 && Math.floor(player.invuln * 14) % 2 === 0) ctx.globalAlpha = 0.35;
  ctx.drawImage(player.hurt > 0.5 ? whiteOf(fr) : fr, -player.w / 2, -player.h - SCALE, player.w, player.h + SCALE);
  if (player.hat) {
    const by = player.walkFrame === 'pass' || player.walkFrame === 'breath' ? 0 : 1, k = 1 + (player.hatPop || 0) * 0.4;
    ctx.save(); ctx.translate(0, -player.h - SCALE); ctx.scale(1, 1);
    if (k > 1.01) { const hd = headOf(bodyImg); if (hd) { const ax = -player.w / 2 + hd.x * SCALE, ay = (hd.top + by + 2) * SCALE; ctx.translate(ax, ay); ctx.scale(k, k); ctx.translate(-ax, -ay); } }
    drawHatOn(player.hat, bodyImg, -player.w / 2, 0, by, SCALE, player.hurt > 0.5);
    ctx.restore();
  }
  ctx.restore();
}

function drawParticles() {
  for (const p of particles) {

    } else if (p.color === 'img') {                  // sprite pequeno (cruz de cura do healer)

function drawRangedWeapon(e, w, h, frameName, back) {
  const T = e.T, sc = T.sc, shotgun = e.weapon === 'shotgun';
  const img = shotgun ? rangeShotgunImg : revolverImg;
  if (!img.complete) return;

  let rot = Math.atan2(Math.sin(lt - Math.PI), Math.cos(lt - Math.PI));            // o sprite aponta para a esquerda

  const up = frameName === 'pass' ? sc : 0;
  const H2 = back ? RANGE_HANDS.back : RANGE_HANDS.front, hx = H2.x, hy = H2.y;
  ctx.save();
  ctx.translate(-w / 2 + hx * sc, -h + hy * sc - up);
  ctx.rotate(rot);
  if (shotgun) { ctx.scale(-1, 1); ctx.drawImage(img, -RANGE_SG_GRIP.x * sc, -RANGE_SG_GRIP.y * sc, img.width * sc, img.height * sc); }   // escopeta: cano para a direita, espelha
  else ctx.drawImage(img, -REVOLVER_GRIP.x * sc, -REVOLVER_GRIP.y * sc, img.width * sc, img.height * sc);

function drawEnemy(e, ghost = false) {
  if (!e.alive) return;
  if (e.scare) return drawScare(e, ghost);
  const T = e.T, w = T.w * T.sc, h = T.h * T.sc;
  const lx = (e.dirX || 0) * e.lunge * 14, ly = (e.dirY || 0) * e.lunge * 14;   // bote na mordida
  const ex = Math.round(e.x + lx + rand(-1, 1) * e.jiggle * 4), ey = Math.round(e.y + ly);
  // andando: alterna passo aberto / pernas juntas (corpo sobe 1 px); parado ou mordendo: pernas abertas
  const moving = e.speed > 0 && !gameOver && !e.attacking;
  const frameName = moving ? (Math.floor(e.walk / T.stepLen) % 2 ? 'pass' : 'step') : 'stand';
  const fr = enemyFrame(T, frameName, e.blinkT > 0);
  if (!fr) return;
  const hop = 0;
  const tilt = moving ? (Math.floor(e.walk / (T.stepLen * 2)) % 2 ? 0.035 : -0.035) : 0;   // gingado a cada passada

  if (!ghost) {
    ctx.fillStyle = 'rgba(0,0,0,.28)';
    ctx.beginPath();
    ctx.ellipse(e.x, ey + h / 2 - 2, w * 0.35 * (1 - hop / 30), 6, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  const sq = 1 + e.jiggle * 0.08;  // "squash" rápido ao ser atingido
  ctx.save();
  ctx.translate(ex, ey + h / 2 - hop);
  ctx.rotate(tilt);
  ctx.scale(sq * (e.facing === -1 ? 1 : -1), 1 / sq);   // sprite olha para a esquerda
  if (ghost) {                           // atrás da casa: silhueta vermelha por cima do telhado
    ctx.globalAlpha = 0.5 + Math.sin(clock * 6) * 0.1;
    ctx.drawImage(tintOf(fr, e.flash > 0 ? '#ffffff' : '#ff5a4f'), -w / 2, -h - T.sc, w, h + T.sc);
    ctx.globalAlpha = 1;
    ctx.restore();
  } else {
  if (T.ranged && e.weapon === 'dual') drawRangedWeapon(e, w, h, frameName, true);   // segundo revólver: braço de trás, atrás do corpo
  ctx.drawImage(e.flash > 0 ? whiteOf(fr) : fr, -w / 2, -h - T.sc, w, h + T.sc);
  if (e.hot) { ctx.globalAlpha = 0.32 + 0.1 * Math.sin(clock * 12 + e.x); ctx.drawImage(tintOf(fr, '#ff5a1a'), -w / 2, -h - T.sc, w, h + T.sc); ctx.globalAlpha = 1; }
  if (e.hat) drawHatOn(e.hat, T.body, -w / 2, -h - T.sc, (T.top || 0) + (frameName === 'pass' ? 0 : 1), T.sc, e.flash > 0);
  if (e.healGlow > 0.02) {                // acabou de ser curado: brilho verde
    ctx.globalAlpha = 0.55 * e.healGlow; ctx.drawImage(tintOf(fr, '#7dff6a'), -w / 2, -h - T.sc, w, h + T.sc); ctx.globalAlpha = 1;
  }
  if (e.frozenT > 0) {                    // congelado: camada azul-gelo
    ctx.globalAlpha = Math.min(1, e.frozenT * 2) * 0.6; ctx.drawImage(tintOf(fr, '#bfefff'), -w / 2, -h - T.sc, w, h + T.sc); ctx.globalAlpha = 1;
  } else if (e.burnT > 0) {               // pegando fogo: brilho laranja tremendo
    ctx.globalAlpha = 0.22 + Math.sin(clock * 20 + e.x) * 0.08; ctx.drawImage(tintOf(fr, '#ff8a1f'), -w / 2, -h - T.sc, w, h + T.sc); ctx.globalAlpha = 1;
  }
  if (T.eye && nightK > 0.01) {          // guarda onde o olho ficou na tela (desenhado depois, por cima da escuridão)
    const open = T.id === 'range' ? e.blinkT > 0 : !(e.blinkT > 0 && T.blink);
    const fy = T.eye.y + (frameName === 'pass' ? 0 : 1);
    const q = ctx.getTransform().transformPoint(new DOMPoint(-w / 2 + (T.eye.x + 0.5) * T.sc, -h - T.sc + (fy + 0.5) * T.sc));
    e.eye = { x: q.x, y: q.y, on: open && e.flash <= 0, n: renderN };
  }
  if (T.ranged) drawRangedWeapon(e, w, h, frameName, false);   // arma da mão da frente (por cima do corpo)
  ctx.restore();
  }

  if (e.burnT > 0 && !ghost) {            // chamas (fogo.gif) sobre o corpo
    const fi = fireImgs[Math.floor((clock + e.x * 0.01) * 10) % 2];
    if (fi.complete) {
      const fw = 16 * T.sc;
      ctx.globalAlpha = Math.min(1, e.burnT * 2);
      ctx.drawImage(fi, Math.round(ex - fw / 2), Math.round(ey + h / 2 - fw - 2 * T.sc), fw, fw);
      ctx.globalAlpha = 1;
    }
  }
  // barra de vida (aparece depois de tomar dano)
  if (e.hpShow > 0) {
    const bw = T.id === 'tank' ? 84 : 56, bh = T.id === 'tank' ? 8 : 6, bx = e.x - bw / 2, by = ey - h / 2 - 16;
    ctx.globalAlpha = Math.min(1, e.hpShow * 2);
    ctx.fillStyle = '#000'; ctx.fillRect(bx - 2, by - 2, bw + 4, bh + 4);
    ctx.fillStyle = '#3a1414'; ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = '#e63946'; ctx.fillRect(bx, by, Math.round(bw * e.hp / e.maxHp), bh);
    ctx.globalAlpha = 1;
  }
}

// inimigos que a casa está escondendo (estão atrás dela e o sprite se sobrepõe ao da casa)
function drawHiddenBehindHouse() {
  if ((!house.active && !house.decor) || house.hp <= 0 || mode === 'menu') return;
  const hw = HOUSE_W * HOUSE_SCALE / 2, hh = HOUSE_H * HOUSE_SCALE / 2, key = houseRect().b - 36;
  const hidden = enemies.filter(e => {
    if (!e.alive || e.y >= key) return false;                   // está na frente da casa: já aparece
    const w = e.T.w * e.T.sc / 2, h = e.T.h * e.T.sc / 2;
    return !(e.x + w < house.x - hw || e.x - w > house.x + hw || e.y + h < house.y - hh || e.y - h > house.y + hh);
  });
  if (!hidden.length || !houseImg.complete) return;
  // desenha as silhuetas numa camada do tamanho da casa e recorta pelo formato dela (só a parte escondida fica vermelha)
  const L = ghostLayer, W2 = hw * 2, H2 = hh * 2;
  if (L.width !== W2 || L.height !== H2) { L.width = W2; L.height = H2; }
  const g = L.getContext('2d'), main = ctx;
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalCompositeOperation = 'source-over'; g.clearRect(0, 0, W2, H2);
  g.imageSmoothingEnabled = false;
  g.setTransform(1, 0, 0, 1, -(house.x - hw), -(house.y - hh));
  ctx = g;
  try { for (const e of hidden) drawEnemy(e, true); } finally { ctx = main; }
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalCompositeOperation = 'destination-in';
  g.drawImage(houseImg, 0, 0, W2, H2);
  g.globalCompositeOperation = 'source-over';
  const sx = rand(-1, 1) * house.shake * 4;
  ctx.drawImage(L, Math.round(house.x - hw + sx), Math.round(house.y - hh));
}

function drawRunHud() {
  if (mode !== 'rogue') return;
  const alive = enemies.filter(e => e.alive).length;
  const left = run.phase === 'fight' ? run.toSpawn + alive : 0;
  const text = run.phase === 'shop' ? 'VELHO BILL NA ÁREA' : run.wave === 0 ? 'PREPARE-SE' : `WAVE ${run.wave}`;
  const cx = canvas.width / 2;
  ctx.textAlign = 'center';
  ctx.font = 'bold 24px monospace';
  ctx.fillStyle = '#000'; ctx.fillText(text, cx + 2, 34);
  ctx.fillStyle = '#e9c46a'; ctx.fillText(text, cx, 32);
  ctx.font = 'bold 13px monospace';
  const sub = run.phase === 'fight' ? `${left} jacarés  ·  ${run.kills} abates`
            : run.phase === 'shop' ? (bill.state === 'idle' ? `próxima wave em ${Math.ceil(run.phaseT)}s  ·  ENTER para seguir` : '...')
                                    : `próxima em ${Math.ceil(run.phaseT)}s  ·  ${run.kills} abates`;
  ctx.fillStyle = '#000'; ctx.fillText(sub, cx + 1, 53);
  ctx.fillStyle = '#f4f1de'; ctx.fillText(sub, cx, 52);
  ctx.textAlign = 'left';
  drawBanner();
}

// "UMA NOVA AMEAÇA SURGE": aparece junto com o anúncio da wave em que entra um inimigo novo
function drawThreat(b, t, outA, cy) {
  const W = canvas.width, H = canvas.height, T = b.threat;
  const k = Math.max(0, Math.min(1, (t - 0.35) / 0.25));
  if (k <= 0) return;
  // vinheta vermelha pulsando nas bordas
  const pulse = 0.5 + 0.5 * Math.sin(t * 9);
  const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.75);
  vg.addColorStop(0, 'rgba(120,0,0,0)'); vg.addColorStop(1, `rgba(150,0,0,${(0.35 + 0.2 * pulse) * outA * k})`);
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.globalAlpha = outA * k;
  ctx.textAlign = 'center';
  // faixa de aviso acima do título
  const ty = cy - 110;
  ctx.fillStyle = 'rgba(0,0,0,.8)'; ctx.fillRect(0, ty - 30, W, 42);
  ctx.font = `bold ${Math.min(34, Math.floor(W / 22))}px monospace`;
  ctx.lineWidth = 6; ctx.lineJoin = 'round'; ctx.strokeStyle = '#000';
  const msg = 'UMA NOVA AMEAÇA SURGE';
  const jit = (1 - k) * 8 + (t < 1.2 ? 1.5 : 0);
  ctx.strokeText(msg, W / 2 + rand(-jit, jit), ty + rand(-jit, jit));
  ctx.fillStyle = pulse > 0.5 ? '#ff4d4d' : '#ffffff';
  ctx.fillText(msg, W / 2 + rand(-jit, jit), ty + rand(-jit, jit));
  ctx.restore();
}

// anúncios no centro. Início de wave: entra "batendo" na tela, com clarão e faixas de cinema.
function drawBanner() {
  const b = run.banner;
  if (!b || gameOver || paused || run.phase === 'cards') return;
  const W = canvas.width, H = canvas.height, t = b.t;
  const outA = Math.min(1, (b.dur - t) / 0.4);
  if (b.big) {
    // clarão
    if (t < 0.3) { ctx.fillStyle = `rgba(255,240,210,${0.45 * (1 - t / 0.3)})`; ctx.fillRect(0, 0, W, H); }
    // faixas de cinema
    const bar = H * 0.12 * Math.min(1, t / 0.18) * outA;
    ctx.fillStyle = 'rgba(0,0,0,.75)'; ctx.fillRect(0, 0, W, bar); ctx.fillRect(0, H - bar, W, bar);
    // faixa vermelha atrás do texto
    const cy = H * 0.42;
    const stripe = Math.min(1, t / 0.15);
    ctx.fillStyle = `rgba(150,20,20,${0.55 * outA})`;
    ctx.fillRect(W / 2 - (W / 2) * stripe, cy - 70, W * stripe, 120);
    ctx.fillStyle = `rgba(255,90,60,${0.8 * outA})`;
    ctx.fillRect(W / 2 - (W / 2) * stripe, cy - 74, W * stripe, 4); ctx.fillRect(W / 2 - (W / 2) * stripe, cy + 50, W * stripe, 4);
    // texto: começa enorme e "bate" no lugar, com um tremidinho só no texto
    const k = Math.min(1, t / 0.16);
    const sc = k < 1 ? 3 - 2 * (1 - Math.pow(1 - k, 3)) : 1 + Math.sin(Math.min(1, (t - 0.16) / 0.25) * Math.PI) * 0.06;
    const jit = t < 0.5 ? (1 - t / 0.5) * 5 : 0;
    const fs = Math.min(130, Math.floor(W / 5.2), Math.floor(W * 0.92 / (b.text.length * 0.62)));
    ctx.save();
    ctx.globalAlpha = Math.min(1, t / 0.08) * outA;
    ctx.translate(W / 2 + rand(-jit, jit), cy + rand(-jit, jit));
    ctx.scale(sc, sc);
    ctx.textAlign = 'center';
    ctx.font = `bold ${fs}px monospace`;
    ctx.lineJoin = 'round'; ctx.lineWidth = 10; ctx.strokeStyle = '#000';
    ctx.strokeText(b.text, 0, 26);
    const g = ctx.createLinearGradient(0, -fs * 0.6, 0, 26);
    g.addColorStop(0, '#ffe08a'); g.addColorStop(1, '#ff6b3d');
    ctx.fillStyle = g; ctx.fillText(b.text, 0, 26);
    if (b.sub) {
      ctx.font = 'bold 20px monospace';
      ctx.lineWidth = 5; ctx.strokeText(b.sub.toUpperCase(), 0, 66);
      ctx.fillStyle = '#f4f1de'; ctx.fillText(b.sub.toUpperCase(), 0, 66);
    }
    ctx.restore();
    if (b.threat) drawThreat(b, t, outA, cy);
    return;
  }
  const inT = Math.min(1, t / 0.25), a = Math.min(inT, outA), sc = 1 + (1 - inT) * 0.6;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.translate(W / 2, H * 0.3);
  ctx.scale(sc, sc);
  ctx.textAlign = 'center';
  ctx.font = 'bold 56px monospace';
  ctx.lineWidth = 8; ctx.lineJoin = 'round'; ctx.strokeStyle = '#000'; ctx.strokeText(b.text, 0, 0);
  ctx.fillStyle = b.color; ctx.fillText(b.text, 0, 0);
  if (b.sub) {
    ctx.font = 'bold 18px monospace';
    ctx.lineWidth = 4; ctx.strokeText(b.sub, 0, 34);
    ctx.fillStyle = '#f4f1de'; ctx.fillText(b.sub, 0, 34);
  }
  ctx.restore();
}

// jacarezinho com a escopeta na mão (tela inicial)
// protagonista gigante na esquerda, olhando para a direita, com a escopeta
// protagonista em close: enorme, cortado pela esquerda e por baixo, levemente inclinado, com a escopeta
function drawTitleGator(S, snoutX, headTop, tilt) {
  const fr = walkFrame(Math.sin(clock * 2.4) > 0.55 ? 'breath' : 'stand', clock % 4.3 < BLINK.dur);
  if (!fr || !gunSprite.complete) return;
  const w = PLAYER_SPR.w * S, h = (PLAYER_SPR.h + 1) * S;
  // caixa do sprite (virado para a direita): o focinho fica na borda direita da caixa
  const x0 = Math.round(snoutX - w), y0 = Math.round(headTop - S);
  ctx.save();
  ctx.translate(snoutX, headTop);
  ctx.rotate(tilt);
  ctx.translate(-snoutX, -headTop);
  ctx.save();
  ctx.translate(x0 + w, y0);
  ctx.scale(-1, 1);                                          // sprite olha para a esquerda: vira para a direita
  ctx.drawImage(fr, 0, 0, w, h);
  ctx.restore();
  // escopeta na mão, apontando para cima e para a frente, com um leve "respirar"
  const a = -0.3 + Math.sin(clock * 1.3) * 0.025;
  const hx = x0 + w / 2 + GUN_HAND.x * S, hy = y0 + S + PLAYER_SPR.h / 2 * S + GUN_HAND.y * S;
  ctx.translate(hx + Math.cos(a) * GUN_RADIUS * S, hy + Math.sin(a) * GUN_RADIUS * S);
  ctx.rotate(a);
  ctx.drawImage(gunSprite, -GUN_GRIP.x * S, -GUN_GRIP.y * S, GUN_W * S, GUN_H * S);
  ctx.restore();
}

function drawButtons(list, hov) {
  for (const b of list) {
    const on = hov === b;
    ctx.fillStyle = on ? '#f4f1de' : 'rgba(20,28,20,.9)';
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = '#f4f1de'; ctx.lineWidth = 2;
    ctx.strokeRect(b.x + 1, b.y + 1, b.w - 2, b.h - 2);
    ctx.fillStyle = on ? '#10170f' : '#f4f1de';
    ctx.font = b.small ? 'bold 26px monospace' : 'bold 20px monospace';
    if (!b.sub) { ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2 + (b.small ? 9 : 7)); continue; }
    ctx.fillText(b.label, b.x + b.w / 2, b.y + (b.h > 56 ? 28 : 26));
    ctx.font = '13px monospace';
    ctx.fillStyle = on ? '#3a4a3a' : '#a9b8a0';
    ctx.fillText(b.sub, b.x + b.w / 2, b.y + (b.h > 56 ? 48 : 43));
  }
}

// ícones pequenos em pixel art para as cartas
const PIX = {
  crit: ['...#...', '...#...', '.#####.', '##.#.##', '.#####.', '...#...', '...#...'],
  vamp: ['...#...', '..###..', '.#####.', '#######', '#######', '.#####.', '..###..'],
};
function drawPix(pat, x, y, s, col) {
  ctx.fillStyle = col;
  pat.forEach((row, r) => [...row].forEach((ch, c) => { if (ch === '#') ctx.fillRect(x + c * s, y + r * s, s, s); }));
}
function drawCardIcon(u, cx, cy, sz) {
  const ic = UPGRADE_ICONS[u.id];
  if (ic && ic.complete) {                     // escala inteira: pixel art nítido, ícones menores ficam menores
    const k = Math.max(2, Math.floor(sz / Math.max(11, ic.width, ic.height)));   // ícones pequenos (relógio, +) crescem um pouco
    // selo (um pixel menor que o ícone): '+' sobrepõe o canto; relógio com '−' fica ao lado, sem tapar o desenho
    const kb = Math.max(2, k - 1), B = ICON_BADGE_IMGS, badge = ICON_BADGE[u.id];
    const cdW = badge === 'cd' ? (B.menos.width + 1 + B.relogio.width) * kb : 0;
    const x = Math.round(cx - (ic.width * k + cdW) / 2), y = Math.round(cy - ic.height * k / 2);
    ctx.drawImage(ic, x, y, ic.width * k, ic.height * k);
    const put = (im2, lx, by) => im2.complete && ctx.drawImage(im2, Math.round(lx), Math.round(by - im2.height * kb), im2.width * kb, im2.height * kb);
    const bottom = y + ic.height * k + 2 * kb;
    if (badge === '+') put(B.mais, x + ic.width * k - 3 * kb, bottom);
    else if (badge === 'cd') {
      const lx = x + ic.width * k + kb;
      put(B.menos, lx, bottom - (B.relogio.height - B.menos.height) * kb / 2);
      put(B.relogio, lx + (B.menos.width + 1) * kb, bottom);
    }
    return;
  }
  const img2 = { atkSpd: gunSprite, shotDmg: gunSprite, pellets: gunSprite, reload: ammoFullImg, bulletSz: null,
    houseHp: houseImg, meleeCd: meleeImgs[0], meleeDmg: meleeImgs[0], meleeKb: meleeImgs[0], meleeRng: meleeImgs[0] }[u.id];
  if (u.id === 'crit') return drawPix(PIX.crit, cx - 3.5 * sz / 7, cy - 3.5 * sz / 7, sz / 7, '#ffd166');
  if (u.id === 'vamp') return drawPix(PIX.vamp, cx - 3.5 * sz / 7, cy - 3.5 * sz / 7, sz / 7, '#e63946');
  if (u.id === 'bulletSz') {                         // bala branca grande
    ctx.fillStyle = '#fff'; ctx.fillRect(cx - sz * 0.45, cy - sz * 0.15, sz * 0.9, sz * 0.3); return;
  }
  if (!img2 || !img2.complete) return;
  const k = sz / Math.max(img2.width, img2.height);
  ctx.drawImage(img2, Math.round(cx - img2.width * k / 2), Math.round(cy - img2.height * k / 2), img2.width * k, img2.height * k);
  if (u.id === 'pellets') { ctx.fillStyle = '#fff'; for (let i = 0; i < 3; i++) ctx.fillRect(cx + sz * 0.55, cy - 10 + i * 9, 10, 4); }
}

function wrapText(text, maxW) {
  const words = text.split(' '), lines = []; let line = '';
  for (const w of words) {
    const t = line ? line + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t;
  }
  if (line) lines.push(line);
  return lines;
}

function drawCards() {
  if (mode === 'menu' || run.phase !== 'cards' || !cards.list.length) return;
  ctx.fillStyle = 'rgba(6,10,8,.55)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  const rects = cardRects(), hov = cards.picked < 0 ? hoveredIn(rects) : null;
  ctx.textAlign = 'center';
  const titleA = Math.min(1, cards.t / 0.3);
  ctx.globalAlpha = titleA;
  ctx.font = 'bold 30px monospace';
  ctx.fillStyle = '#000'; ctx.fillText('ESCOLHA UM UPGRADE', canvas.width / 2 + 3, rects[0].y - 26);
  ctx.fillStyle = '#e9c46a'; ctx.fillText('ESCOLHA UM UPGRADE', canvas.width / 2, rects[0].y - 29);
  ctx.globalAlpha = 1;
  for (const r of rects) {
    // entrada: sobe e aparece, uma de cada vez
    const ent = Math.max(0, Math.min(1, (cards.t - r.i * 0.08) / 0.3));
    const e = 1 - Math.pow(1 - ent, 3);
    let y = r.y + (1 - e) * 60, a = e, sc = 1;
    const on = hov === r, chosen = cards.picked === r.i;
    if (on) y -= 8;
    if (cards.picked >= 0) {
      if (chosen) { sc = 1 + Math.sin(Math.min(1, cards.pickT / 0.2) * Math.PI) * 0.08; y -= 12; }
      else a *= Math.max(0, 1 - cards.pickT / 0.25);
    }
    if (a <= 0.01) continue;
    const col = CAT_COLOR[r.u.cat];
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(r.x + r.w / 2, y + r.h / 2); ctx.scale(sc, sc); ctx.translate(-r.w / 2, -r.h / 2);
    ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(5, 6, r.w, r.h);                 // sombra
    ctx.fillStyle = '#18221a'; ctx.fillRect(0, 0, r.w, r.h);
    ctx.fillStyle = col; ctx.fillRect(0, 0, r.w, 6);                                  // faixa da categoria
    ctx.strokeStyle = on || chosen ? '#fff' : col; ctx.lineWidth = on || chosen ? 3 : 2;
    ctx.strokeRect(1, 1, r.w - 2, r.h - 2);
    // ícone
    ctx.fillStyle = 'rgba(255,255,255,.05)'; ctx.fillRect(12, 18, r.w - 24, r.h * 0.34);
    drawCardIcon(r.u, r.w / 2, 18 + r.h * 0.17, Math.min(96, r.w * 0.42));
    // textos (crescem junto com a carta)
    const fk = Math.max(0.8, Math.min(1.35, r.w / 190));
    ctx.textAlign = 'center';
    ctx.font = `bold ${Math.round(15 * fk)}px monospace`; ctx.fillStyle = '#f4f1de';
    ctx.fillText(r.u.title, r.w / 2, r.h * 0.34 + 34 + 12 * fk);
    ctx.font = `${Math.round(12 * fk)}px monospace`; ctx.fillStyle = '#c9d4c0';
    wrapText(r.u.desc, r.w - 26).forEach((l, i) => ctx.fillText(l, r.w / 2, r.h * 0.34 + 50 + 26 * fk + i * 17 * fk));
    ctx.font = `bold ${Math.round(11 * fk)}px monospace`; ctx.fillStyle = col;
    ctx.fillText(r.u.cat.toUpperCase() + '  ·  ' + (lv[r.u.id] ? `nível ${lv[r.u.id]} → ${lv[r.u.id] + 1}` : 'NOVO'), r.w / 2, r.h - 18 - 14 * fk);
    ctx.fillStyle = 'rgba(244,241,222,.55)'; ctx.fillText(`[${r.i + 1}]`, r.w / 2, r.h - 12);
    ctx.restore();
  }
  ctx.textAlign = 'left';
}

// painel de stats (esquerda, discreto). Ctrl mostra/esconde.
const statFlash = {};
let showStats = true;
try { showStats = localStorage.getItem('gs_stats') !== '0'; } catch (e) {}
function toggleStats() {
  showStats = !showStats;
  try { localStorage.setItem('gs_stats', showStats ? '1' : '0'); } catch (e) {}
}
const pct = v => `${Math.round(v * 100)}%`;
function statLines() {
  return [
    ['crit',     'Crítico',        pct(critChance())],
    ['vamp',     'Vampirismo',     pct(vampirism())],

}
function drawStats() {
  if (!showStats || mode === 'menu') return;
  const lines = statLines(), lh = 16, x = 14;
  const y0 = Math.max(mode === 'rogue' ? 72 : 60, canvas.height / 2 - lines.length * lh / 2 - 20);

function drawPause() {
  if (!paused) return;
  ctx.fillStyle = 'rgba(8,12,8,.62)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.textAlign = 'center';
  ctx.font = 'bold 48px monospace';
  const y = canvas.height / 2 - 76;
