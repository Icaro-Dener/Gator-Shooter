const rand = (a, b) => a + Math.random() * (b - a);

// =====================================================================
// SFX sintetizados (Web Audio, sem arquivos) — M liga/desliga
// =====================================================================
const sfx = (() => {
  let ac = null, master = null, noiseBuf = null, muted = false;
  const last = {};
  function init() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = 0.45;
    const comp = ac.createDynamicsCompressor();       // evita estourar com muitos sons juntos
    master.connect(comp); comp.connect(ac.destination);
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  // o navegador só libera áudio depois de uma interação
  ['mousedown', 'keydown'].forEach(ev => window.addEventListener(ev, init));
  window.addEventListener('keydown', e => { if (e.key.toLowerCase() === 'm') muted = !muted; });

  const ok = (name, gap = 0) => {           // limita repetições muito próximas
    if (!ac || muted) return false;
    const t = ac.currentTime;
    if (last[name] !== undefined && t - last[name] < gap) return false;
    last[name] = t; return true;
  };
  function env(g, t, a, peak, dur) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  }
  // ruído filtrado
  function noise({ dur, peak = 0.5, type = 'lowpass', f0 = 2000, f1 = f0, q = 0.8, attack = 0.002, delay = 0 }) {
    const t = ac.currentTime + delay;
    const src = ac.createBufferSource(); src.buffer = noiseBuf;
    src.playbackRate.value = rand(0.9, 1.1);
    const flt = ac.createBiquadFilter(); flt.type = type; flt.Q.value = q;
    flt.frequency.setValueAtTime(f0, t); flt.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
    const g = ac.createGain(); env(g, t, attack, peak, dur);
    src.connect(flt); flt.connect(g); g.connect(master);
    src.start(t, rand(0, 0.5)); src.stop(t + dur + 0.05);
  }
  // tom com glide de frequência
  function tone({ dur, peak = 0.3, wave = 'square', f0 = 440, f1 = f0, attack = 0.003, delay = 0 }) {
    const t = ac.currentTime + delay;
    const o = ac.createOscillator(); o.type = wave;
    o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    const g = ac.createGain(); env(g, t, attack, peak, dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.05);
  }

  return {
    shot() {          // estouro de ruído + "thump" grave + cauda
      if (!ok('shot')) return;
      noise({ dur: 0.09, peak: 0.9, type: 'highpass', f0: 1200, f1: 400 });
      noise({ dur: 0.35, peak: 0.7, type: 'lowpass', f0: 3000, f1: 150 });
      tone({ dur: 0.18, peak: 0.6, wave: 'sine', f0: 140, f1: 40 });
      tone({ dur: 0.06, peak: 0.15, wave: 'square', f0: 900, f1: 300, delay: 0.16 }); // "chk" da bomba
      noise({ dur: 0.05, peak: 0.25, type: 'bandpass', f0: 2500, q: 3, delay: 0.17 });
    },
    dry() {           // clique seco sem munição
      if (!ok('dry', 0.05)) return;
      noise({ dur: 0.03, peak: 0.35, type: 'bandpass', f0: 3500, q: 4 });
      tone({ dur: 0.03, peak: 0.12, wave: 'square', f0: 1800, f1: 1200 });
    },
    shell() {         // cápsula quicando
      if (!ok('shell', 0.04)) return;
      tone({ dur: 0.05, peak: 0.06, wave: 'triangle', f0: rand(2600, 3400), f1: 2000 });
    },
    reload() {        // "clack-clack" + arpejo curto
      if (!ok('reload', 0.2)) return;
      noise({ dur: 0.04, peak: 0.4, type: 'bandpass', f0: 1800, q: 3 });
      noise({ dur: 0.05, peak: 0.45, type: 'bandpass', f0: 1200, q: 3, delay: 0.09 });
      [523, 659, 784, 1047].forEach((f, i) => tone({ dur: 0.09, peak: 0.12, wave: 'square', f0: f, delay: 0.14 + i * 0.05 }));
    },
    reloadStart() {   // abre a recarga
      if (!ok('reloadStart', 0.1)) return;
      noise({ dur: 0.04, peak: 0.25, type: 'bandpass', f0: 1400, q: 3 });
    },
    shellIn() {       // cartucho entrando no tubo
      if (!ok('shellIn', 0.05)) return;
      noise({ dur: 0.035, peak: 0.4, type: 'bandpass', f0: 2200, q: 4 });
      tone({ dur: 0.05, peak: 0.12, wave: 'square', f0: 700, f1: 420, delay: 0.02 });
      noise({ dur: 0.05, peak: 0.25, type: 'lowpass', f0: 900, f1: 300, delay: 0.04 });
    },
    swing() {         // faca cortando o ar
      if (!ok('swing', 0.1)) return;
      noise({ dur: 0.16, peak: 0.45, type: 'bandpass', f0: 900, f1: 3500, q: 1.5, attack: 0.03 });
    },
    slash() {         // faca acertando
      if (!ok('slash', 0.05)) return;
      noise({ dur: 0.1, peak: 0.55, type: 'highpass', f0: 2500, f1: 900 });
      tone({ dur: 0.09, peak: 0.3, wave: 'square', f0: 240, f1: 90 });
    },
    meleeReady() {    // faca disponível de novo
      if (!ok('meleeReady', 0.5)) return;
      tone({ dur: 0.08, peak: 0.08, wave: 'triangle', f0: 1568 });
      tone({ dur: 0.12, peak: 0.08, wave: 'triangle', f0: 2093, delay: 0.06 });
    },
    waveStart() {     // começo de wave: impacto grave + tambores
      if (!ok('waveStart', 1)) return;
      noise({ dur: 0.6, peak: 0.8, type: 'lowpass', f0: 1800, f1: 60 });
      tone({ dur: 0.7, peak: 0.6, wave: 'sine', f0: 90, f1: 35 });
      tone({ dur: 0.35, peak: 0.3, wave: 'sawtooth', f0: 220, f1: 110 });
      for (let i = 0; i < 3; i++) {
        tone({ dur: 0.18, peak: 0.35, wave: 'sine', f0: 120, f1: 50, delay: 0.35 + i * 0.16 });
        noise({ dur: 0.12, peak: 0.3, type: 'lowpass', f0: 500, f1: 80, delay: 0.35 + i * 0.16 });
      }
    },
    waveClear() {     // fim de wave: fanfarra curta
      if (!ok('waveClear', 1)) return;
      [523, 659, 784, 1047, 784, 1047].forEach((f, i) =>
        tone({ dur: i < 5 ? 0.1 : 0.3, peak: 0.14, wave: 'square', f0: f, delay: i * 0.09 }));
    },
    heal() {          // curativo
      if (!ok('heal', 0.2)) return;
      [392, 523, 659, 784].forEach((f, i) => tone({ dur: 0.14, peak: 0.12, wave: 'triangle', f0: f, f1: f * 1.02, delay: i * 0.06 }));
    },
    rustle() {        // folhagem balançando
      if (!ok('rustle', 0.15)) return;
      noise({ dur: 0.25, peak: 0.08, type: 'bandpass', f0: rand(2500, 4000), q: 1, attack: 0.04 });
    },
    crit() {          // crítico
      if (!ok('crit', 0.05)) return;
      tone({ dur: 0.08, peak: 0.16, wave: 'square', f0: 1400, f1: 2200 });
    },
    upgrade() {       // escolheu uma carta
      if (!ok('upgrade', 0.3)) return;
      [659, 880, 1175, 1568].forEach((f, i) => tone({ dur: 0.12, peak: 0.13, wave: 'square', f0: f, delay: i * 0.05 }));
    },
    step() {          // passo bem baixinho
      if (!ok('step', 0.06)) return;
      noise({ dur: 0.05, peak: 0.07, type: 'lowpass', f0: rand(500, 800), f1: 150 });
    },
    hit() {           // impacto no inimigo
      if (!ok('hit', 0.025)) return;
      tone({ dur: 0.07, peak: 0.22, wave: 'square', f0: rand(320, 380), f1: 120 });
      noise({ dur: 0.05, peak: 0.25, type: 'lowpass', f0: 1800, f1: 400 });

// Troca com fade; abaixa durante a pausa e a escolha de cartas; M silencia junto com os efeitos.
// =====================================================================
const MUSIC = { volume: 0.45, ducked: 0.22, fade: 1.6 };   // fade = quanto o volume anda por segundo
let musicLevel = 0.7;                                       // ajuste do jogador (0..1), no menu de pausa
try { const v = parseFloat(localStorage.getItem('gs_music')); if (!isNaN(v)) musicLevel = v; } catch (e) {}
let musicPreviewT = 0;                                      // ao mexer no volume, toca sem abaixar por um instante
function setMusicLevel(v) {
  musicLevel = Math.max(0, Math.min(1, Math.round(v * 10) / 10));
  musicPreviewT = 1.5;
  try { localStorage.setItem('gs_music', musicLevel); } catch (e) {}
}
const music = (() => {
  const tracks = {
    theme: new Audio('musica/gator-shooter-theme.mp3'),
    swamp: new Audio('musica/swamp-attack.mp3'),
  };
  for (const t of Object.values(tracks)) { t.loop = true; t.volume = 0; t.preload = 'auto'; }
  let unlocked = false, lastWant = null;
  // o navegador só deixa tocar áudio depois de uma interação
  const unlock = () => { unlocked = true; };
  ['mousedown', 'keydown'].forEach(ev => window.addEventListener(ev, unlock));
  const want = () => (mode === 'rogue' ? 'swamp' : 'theme');
  return {
    restart(name) { const t = tracks[name]; if (t) { try { t.currentTime = 0; } catch (e) {} } },
    update(dt) {
      if (!unlocked) return;
      const w = want();
      if (w !== lastWant) { if (w === 'swamp') this.restart('swamp'); lastWant = w; }   // horda começa do início
      musicPreviewT = Math.max(0, musicPreviewT - dt);
      const duck = (paused || (mode === 'rogue' && run.phase === 'cards')) && musicPreviewT <= 0;
      for (const [name, t] of Object.entries(tracks)) {
        const target = sfx.muted ? 0 : name === w ? MUSIC.volume * musicLevel * (duck ? MUSIC.ducked : 1) : 0;
        const v = t.volume + Math.sign(target - t.volume) * Math.min(Math.abs(target - t.volume), MUSIC.fade * dt);
        t.volume = Math.max(0, Math.min(1, v));
        if (t.volume > 0.001 && t.paused) t.play().catch(() => {});
        else if (t.volume <= 0.001 && !t.paused && target === 0) t.pause();
      }
    },
    tracks,
  };
})();

// =====================================================================
// Mapa: grama com clareiras/trilhas de areia (gerado com seed fixa)
// =====================================================================
const map = { canvas: document.createElement('canvas'), ready: false };

function buildMap() {
  // o mundo é exatamente a área visível; o mapa cobre a tela (último tile pode ficar cortado)
  map.builtW = canvas.width; map.builtH = canvas.height;
  WORLD_W = canvas.width; WORLD_H = canvas.height;
  MAP_W = Math.ceil(WORLD_W / TILE); MAP_H = Math.ceil(WORLD_H / TILE);
  if (!map.ready) { player.x = WORLD_W / 2; player.y = WORLD_H / 2; } // nasce no centro
  house.x = Math.round(WORLD_W / 2); house.y = Math.round(WORLD_H / 2);
  for (const e of enemies) if (e.homeRel) { e.x = Math.round(WORLD_W * e.homeRel.x); e.y = Math.round(WORLD_H * e.homeRel.y); }

  // PRNG com seed para o mapa ser sempre o mesmo
  let seed = 1337;
  const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;

  // terra só num círculo no meio, desenhado pixel a pixel (resolução nativa: 16 px por tile)
  const c = map.canvas; c.width = MAP_W * T; c.height = MAP_H * T;
  const m = c.getContext('2d');
  const ccx = WORLD_W / 2 / SCALE, ccy = WORLD_H / 2 / SCALE;            // centro = centro da tela
  const R = SAND_RADIUS * Math.min(WORLD_W, WORLD_H) / SCALE;
  const edge = (px, py) => {                                              // >0 fora (grama), <0 dentro (terra)
    const a = Math.atan2(py - ccy, px - ccx);
    const wob = Math.sin(a * 5 + 1.3) * 1.3 + Math.sin(a * 9 + 0.4) * 0.8 + Math.sin(a * 17) * 0.5;
    return Math.hypot(px - ccx, py - ccy) - (R + wob);
  };

  // tiles (para saber onde pode nascer tufo): terra se o centro do tile está perto do círculo
  map.tiles = [];
  for (let y = 0; y < MAP_H; y++)
    for (let x = 0; x < MAP_W; x++) map.tiles.push(edge(x * T + T / 2, y * T + T / 2) < T * 0.8 ? 1 : 0);
  const at = (x, y) => (x < 0 || y < 0 || x >= MAP_W || y >= MAP_H) ? -1 : map.tiles[y * MAP_W + x];

  // camadas completas de grama e de terra, com rotação aleatória para quebrar repetição
  const layer = set => {
    const L = document.createElement('canvas'); L.width = c.width; L.height = c.height;
    const g = L.getContext('2d');
    for (let y = 0; y < MAP_H; y++)
      for (let x = 0; x < MAP_W; x++) {
        g.save(); g.translate(x * T + T / 2, y * T + T / 2);
        g.rotate(Math.floor(rnd() * 4) * Math.PI / 2);
        g.drawImage(set, 4, 4, T, T, -T / 2, -T / 2, T, T);
        g.restore();
      }
    return g.getImageData(0, 0, L.width, L.height).data;
  };
  const grassD = layer(grassSet), sandD = layer(sandSet);

  // cores da franja da grama (linha de borda do tileset), para a borda serrilhada
  const fc = document.createElement('canvas'); fc.width = 24; fc.height = 24;
  const fg = fc.getContext('2d'); fg.drawImage(grassSet, 0, 0);
  const fd = fg.getImageData(4, 2, 16, 1).data, fringe = [];
  for (let k = 0; k < 16; k++) fringe.push([fd[k * 4], fd[k * 4 + 1], fd[k * 4 + 2]]);

  // composição: dentro = terra; faixa de 2 px na borda = franja da grama (linha cheia + linha serrilhada)
  const out = m.createImageData(c.width, c.height), o = out.data;
  for (let py = 0; py < c.height; py++) {
    for (let px = 0; px < c.width; px++) {
      const i = (py * c.width + px) * 4, e = edge(px + 0.5, py + 0.5);
      let src = grassD, col = null;
      if (e < -2) src = sandD;
      else if (e < -1) { if (rnd() < 0.5) src = sandD; else col = fringe[(px * 7 + py * 3) % 16]; }
      else if (e < 0) col = fringe[(px * 5 + py * 11) % 16];
      if (col) { o[i] = col[0]; o[i + 1] = col[1]; o[i + 2] = col[2]; }
      else { o[i] = src[i]; o[i + 1] = src[i + 1]; o[i + 2] = src[i + 2]; }
      o[i + 3] = 255;
    }
  }
  m.putImageData(out, 0, 0);

  // árvores: um anel denso em volta da tela, como uma clareira no meio da mata
  trees.length = 0;
  const addTree = (x, baseY, side) => trees.push({ x, baseY, side, phase: rnd() * 6.28, sway: 0, vel: 0,
    flip: rnd() < 0.5, leafT: rnd() * 8, cool: 0 });
  const jit = v => (rnd() - 0.5) * v;
  for (let x = -30; x <= WORLD_W + 30; x += TREE.spacing) {
    addTree(x + jit(30), 70 + jit(40), 'top');                          // topo: tronco e copa aparecendo
    addTree(x + TREE.spacing / 2 + jit(30), WORLD_H + 95 + jit(40), 'bottom');   // embaixo: só a copa
    if (rnd() < TREE.innerChance) addTree(x + jit(40), 125 + jit(25), 'top');
  }
  for (let y = 150; y <= WORLD_H + 40; y += TREE.spacing) {
    addTree(-14 + jit(24), y + jit(30), 'left');
    addTree(WORLD_W + 14 + jit(24), y + TREE.spacing / 2 + jit(30), 'right');
    if (rnd() < TREE.innerChance) addTree(28 + jit(16), y + jit(40), 'left');
    if (rnd() < TREE.innerChance) addTree(WORLD_W - 28 + jit(16), y + jit(40), 'right');
  }
  leaves.length = 0;
  buildLightCache();
  // vagalumes: vagando perto da mata (fora da clareira)
  fireflies.length = 0;
  for (let i = 0; i < LIGHT.fireflies; i++) {
    const a = rnd() * Math.PI * 2;
    const rr = 0.36 + rnd() * 0.12;
    fireflies.push({ bx: WORLD_W / 2 + Math.cos(a) * WORLD_W * rr, by: WORLD_H / 2 + Math.sin(a) * WORLD_H * rr,
      ax: 30 + rnd() * 50, ay: 20 + rnd() * 40, sx: 0.15 + rnd() * 0.25, sy: 0.12 + rnd() * 0.22,
      ph: rnd() * 6.28, blink: 0.6 + rnd() * 0.9 });
  }

  // tufos de grama: só em tiles de grama com grama dos 4 lados (longe das bordas) e fora da casa
  tufts.length = 0;
  const HR = houseRect();
  for (let y = 0; y < MAP_H; y++) {
    for (let x = 0; x < MAP_W; x++) {
      if (rnd() > TUFT.density) continue;
      if (at(x, y) !== 0 || at(x - 1, y) === 1 || at(x + 1, y) === 1 || at(x, y - 1) === 1 || at(x, y + 1) === 1) continue;
      const tx = (x + 0.2 + rnd() * 0.6) * TILE, ty = (y + 0.35 + rnd() * 0.55) * TILE;
      if (tx > HR.l - 40 && tx < HR.r + 40 && ty > HR.t - 70 && ty < HR.b + 30) continue;
      if (trees.some(tr => Math.abs(tr.x - tx) < 50 && ty < tr.baseY + 24 && ty > tr.baseY - 40)) continue;
      tufts.push({ x: tx, y: ty, big: rnd() < TUFT.bigChance, flip: rnd() < 0.5, phase: rnd() * Math.PI * 2,
        bend: 0, vel: 0, touched: false });
    }
  }

  // borda escura do mundo
  m.strokeStyle = 'rgba(0,0,0,.45)'; m.lineWidth = 2;
  m.strokeRect(1, 1, c.width - 2, c.height - 2);
  map.ready = true;
}

// casa: x/y = centro do sprite; o retângulo sólido é a parte das paredes
const house = { x: 0, y: 0, hp: 0, flash: 0, shake: 0, pop: 0, active: false };
function houseRect() {
  const w = HOUSE_W * HOUSE_SCALE, h = HOUSE_H * HOUSE_SCALE;
  const left = house.x - w / 2, top = house.y - h / 2;
  return { l: left + 2 * HOUSE_SCALE, r: left + w - 3 * HOUSE_SCALE, t: top + HOUSE_SOLID_TOP * HOUSE_SCALE, b: top + h };
}
// empurra um corpo (centro x,y; meia-largura hw, meia-altura hh) para fora da casa
function pushOutOfHouse(o, hw, hh) {
  if (!house.active && !house.decor) return false;   // decorativa também é sólida
  const R = houseRect();
  const l = R.l - hw, r = R.r + hw, t = R.t - hh, b = R.b + hh;
  if (o.x <= l || o.x >= r || o.y <= t || o.y >= b) return false;
  const pen = [o.x - l, r - o.x, o.y - t, b - o.y];
  const m = Math.min(...pen);
  if (m === pen[0]) o.x = l; else if (m === pen[1]) o.x = r; else if (m === pen[2]) o.y = t; else o.y = b;
  return true;
}
// homeRel: posição fixa relativa à tela (inimigo do campo de treino, que reaparece). speed 0 = estático.

const whiteCache = new Map();
function whiteOf(image) {
  if (whiteCache.has(image)) return whiteCache.get(image);
  const c = document.createElement('canvas');
  c.width = image.width; c.height = image.height;
  const g = c.getContext('2d');
  g.drawImage(image, 0, 0);
  g.globalCompositeOperation = 'source-in';
  g.fillStyle = '#ffffff';
  g.fillRect(0, 0, c.width, c.height);
  whiteCache.set(image, c);
  return c;
}

// posição/orientação da arma (já com recuo) — usada para desenhar e para achar o cano
function gunTransform() {
  const a = player.aim, h = hand();
  const flip = Math.cos(a) < 0 ? -1 : 1;
  const r = (GUN_RADIUS - player.kick) * SCALE;
  return { x: h.x + Math.cos(a) * r, y: h.y + Math.sin(a) * r, rot: a - player.kickRot * flip, flip };
}
function muzzlePos() {
  const g = gunTransform();
  const lx = (GUN_MUZZLE.x - GUN_GRIP.x) * SCALE, ly = (GUN_MUZZLE.y - GUN_GRIP.y) * SCALE * g.flip;
  const c = Math.cos(g.rot), s = Math.sin(g.rot);
  return { x: g.x + lx * c - ly * s, y: g.y + lx * s + ly * c };
}

// =====================================================================
// Tiro
// =====================================================================
function shoot() {
  sfx.shot();
  const m = muzzlePos(), a = player.aim;

  const nPellets = pelletCount();
  for (let i = 0; i < nPellets; i++) {
    // distribuição uniforme + jitter, para o leque ficar cheio mas orgânico
    const t = nPellets === 1 ? 0 : i / (nPellets - 1) - 0.5;
    const ang = a + t * SHOT.spread + rand(-0.05, 0.05);
    const sp = rand(SHOT.speedMin, SHOT.speedMax);
    bullets.push({
      x: m.x, y: m.y, px: m.x, py: m.y,
      vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
      life: SHOT.life * rand(0.75, 1), age: 0,
      hits: [], dmgMul: 1,           // jacarés já atingidos por este projétil (atravessa)
    });
  }

  // clarão do cano
  player.flash = 0.07; player.flashAngle = a;
  for (let i = 0; i < 10; i++) {           // faíscas
    const ang = a + rand(-0.6, 0.6), sp = rand(250, 700);
    particles.push({ x: m.x, y: m.y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
      life: rand(0.08, 0.18), age: 0, size: rand(2, 4), color: Math.random() < .5 ? '#ffe08a' : '#ff9f3b', drag: 8 });
  }
  for (let i = 0; i < 6; i++) {            // fumaça
    const ang = a + rand(-0.5, 0.5), sp = rand(30, 130);
    particles.push({ x: m.x, y: m.y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 20,
      life: rand(0.35, 0.7), age: 0, size: rand(6, 12), grow: 18, color: 'smoke', drag: 3 });
  }
  // cápsula ejetada (cai e quica)
  const side = Math.cos(a) < 0 ? 1 : -1;
  const h = hand();
  particles.push({ x: h.x, y: h.y - 6, vx: -Math.cos(a) * rand(60, 140) + side * rand(10, 40), vy: rand(-320, -220),
    life: 1.4, age: 0, size: 0, color: 'shell', gravity: 1100, floor: h.y + player.h / 2 - 8, rot: 0, vr: rand(-20, 20), drag: 0.5 });

  // sensação: recuo da arma, tranco na tela, empurrão no jogador, mira pulsando
  player.kick = 2.5;
  player.kickRot = 0.35;
  cam.trauma = Math.min(1, cam.trauma + SHOT.shake);
  player.vx -= Math.cos(a) * SHOT.knockback;
  player.vy -= Math.sin(a) * SHOT.knockback;
  crossPulse = 1;
}
